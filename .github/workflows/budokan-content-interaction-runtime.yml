name: Budokan Content Interaction Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/footer.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_footer.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-buttonLink-style.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/common.js'
      - 'experiments/wordpress-acf-runtime/scripts/seed-budokan-content-interaction-qa.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-runtime-qa.sh'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-browser-qa.mjs'
      - '.github/workflows/budokan-content-interaction-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress normal-page content runtime QA
        env:
          BUDOKAN_CONTENT_INTERACTION_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-runtime-qa.sh

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run normal-page content interaction stability QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          page_id="$(docker compose run --rm cli option get budokan_content_interaction_qa_page_id)"
          qa_url="${WP_URL}/?page_id=${page_id}"
          cd ../..
          node experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
