schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: CR-REF001-002
    summary: Static visual affordances do not by themselves authorize interaction behavior, hidden records, or a specific production library; behavior should remain UNDETERMINED until prototype, source, product, or equivalent evidence exists.
    category: RUNTIME
    applicability:
      scope: CROSS_REFERENCE
      conditions:
        - A static design shows arrows, counters, states, scrollers, calendars, or similar affordances but the actual behavior contract is incomplete.
      exclusions:
        - Explicit prototype reactions, backend/source data, product requirements, or supplied project code can establish a stronger behavior contract.
    promotion_state: CANDIDATE
    promotion:
      candidate: true
      rationale: REF-001 has a measured clean implementation with zero interaction inventions; REF-002 independently applies the same evidence gate during WordPress intake and separates known benchmark interaction evidence from unknown production-library choice, but REF-002 has not yet measured an implementation outcome.
      blocked_by:
        - Complete an independent implementation/clean replay with explicit interaction evidence and measure interaction-invention/rework outcome.
        - Exercise at least one case where explicit product/prototype evidence requires implementing the interaction, proving that the rule gates evidence rather than suppressing valid behavior.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-CR002-REF001-WP-ACF
          kind: LOCAL_RESEARCH
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: experiments/ref001-wordpress-acf/README.md
          commit: ''
          note: REF-001 learning separates visible state/counters from an authorized interaction or hidden CMS record contract.
        - evidence_id: EV-CR002-REF001-CANDIDATE
          kind: CANONICAL_DOC
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: playbook/candidates/cr-ref001-002-evidence-gated-interaction.yaml
          commit: ''
          note: Existing E2/OPTIONAL candidate records zero interaction inventions in the REF-001 Blind Clean Replay.
        - evidence_id: EV-CR002-REF002-THEME-INTAKE
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/theme-intake.yaml
          commit: ''
          note: REF-002 keeps interactions UNDETERMINED except where benchmark evidence is recorded, and explicitly avoids carrying FullCalendar as a production dependency before observing the supplied Theme/company rules.
      contradicts: []
    notes:
      - Cross-reference decision-boundary evidence is real, but keep E2/OPTIONAL until the second reference produces measurable implementation evidence.
