name: REF001 Refresh Final Runtime Evidence

on:
  push:
    branches:
      - agent/ref001-v2-final-micro-qa
    paths:
      - .github/workflows/ref001-refresh-final-runtime-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '9176961036'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ref001-v2-final-micro-qa
          fetch-depth: 1
      - name: Download passing final runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref001-final
          curl --fail --location --retry 2 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/m-shogo/figma-ai-project/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/ref001-final.zip
          unzip -q /tmp/ref001-final.zip -d /tmp/ref001-final
          dst='experiments/ref001-blind-clean-20260812/evidence/final/latest'
          cp /tmp/ref001-final/first-pass-320.png "$dst/first-pass-320.png"
          cp /tmp/ref001-final/first-pass-375.png "$dst/first-pass-375.png"
          cp /tmp/ref001-final/first-pass-1380.png "$dst/first-pass-1380.png"
          cp /tmp/ref001-final/runtime-probes.json "$dst/runtime-probes.json"
      - name: Verify final probes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('experiments/ref001-blind-clean-20260812/evidence/final/latest')
          expected={320:(320,10781),375:(375,10777),1380:(1380,7714)}
          for width,dims in expected.items():
              p=root/f'first-pass-{width}.png'
              d=p.read_bytes()[:24]
              assert d[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',d[16:24])==dims
          rows=json.loads((root/'runtime-probes.json').read_text())
          assert len(rows)==11
          for row in rows:
              assert row['pageOverflowPx']==0, row
              assert not row['readableTextClipping'], row
              assert not row['imageFailures'], row
              assert not row['runtimeErrors'], row
          by={r['width']:r for r in rows}
          assert by[375]['bodyHeight']==10777
          assert by[1380]['bodyHeight']==7714
          print('PASS final evidence')
          PY
      - name: Commit final evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-320.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-375.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-1380.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/runtime-probes.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence: refresh final V2 runtime captures'
          git push origin HEAD:agent/ref001-v2-final-micro-qa
