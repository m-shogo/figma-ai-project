name: Budokan News Master QA Temp

on:
  pull_request:
    paths:
      - 'experiments/budokan-wordpress/TOP_NOTES.md'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-news-master-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live Budokan capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed master news archive fixture
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh

          ids="$(docker compose run --rm cli post list --post_type=post --post_status=publish --format=ids)"
          if [ -n "$ids" ]; then
            docker compose run --rm cli post delete $ids --force >/dev/null
          fi

          front_page_id="$(docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='TOP' --post_name='top' --porcelain)"
          news_page_id="$(docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='お知らせ' --post_name='news' --porcelain)"
          docker compose run --rm cli option update show_on_front page >/dev/null
          docker compose run --rm cli option update page_on_front "$front_page_id" >/dev/null
          docker compose run --rm cli option update page_for_posts "$news_page_id" >/dev/null
          docker compose run --rm cli rewrite structure '/%postname%/' --hard >/dev/null
          docker compose run --rm cli rewrite flush --hard >/dev/null

          names=('武道' '書道' '刊行物' '研修' '事務局')
          slugs=('budo' 'shodo' 'publication' 'training' 'office')
          cat_ids=()

          for i in "${!names[@]}"; do
            existing="$(docker compose run --rm cli term get category "${slugs[$i]}" --by=slug --field=term_id 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              cat_ids+=("$existing")
            else
              created="$(docker compose run --rm cli term create category "${names[$i]}" --slug="${slugs[$i]}" --porcelain)"
              cat_ids+=("$created")
            fi
          done

          for i in $(seq 1 12); do
            cat_index=$(( (i - 1) % 5 ))
            day="$(printf '%02d' "$i")"
            docker compose run --rm cli post create \
              --post_type=post \
              --post_status=publish \
              --post_title="お知らせテスト ${i}" \
              --post_date="2025-08-${day} 12:00:00" \
              --post_category="${cat_ids[$cat_index]}" \
              --porcelain >/dev/null
          done

          count="$(docker compose run --rm cli post list --post_type=post --post_status=publish --format=count)"
          test "$count" = "12"

      - name: Capture archive master and TOP derivative
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-news-master
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewportWidth: 390, contentWidth: 375, height: 1100 },
              { name: 'pc', viewportWidth: 1395, contentWidth: 1380, height: 1000 },
            ];
            const results = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.viewportWidth, height: item.height } });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));

              const topResponse = await page.goto(process.env.WP_URL, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const topMetrics = await page.evaluate(() => {
                const rect = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { x: r.x, y: r.y, width: r.width, height: r.height };
                };
                return {
                  section: rect('#top_news-01'),
                  panel: rect('#top_news-01 .top_news_panel'),
                  articleCount: document.querySelectorAll('#top_news-01 .news_item').length,
                  tabCount: document.querySelectorAll('#top_news-01 .news_tabs_item').length,
                };
              });
              await page.locator('#top_news-01').screenshot({ path: `.runtime/budokan-news-master/${item.name}-top-news.png` });

              const archiveResponse = await page.goto(new URL('/news/', process.env.WP_URL).href, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const archiveMetrics = await page.evaluate(() => {
                const rect = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { x: r.x, y: r.y, width: r.width, height: r.height };
                };
                const style = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const css = getComputedStyle(el);
                  return {
                    display: css.display,
                    borderRadius: css.borderRadius,
                    borderBottomWidth: css.borderBottomWidth,
                    backgroundColor: css.backgroundColor,
                    color: css.color,
                    clipPath: css.clipPath,
                  };
                };
                const active = document.querySelector('.news_tabs_archive .news_tabs_item.is-active');
                const masthead = document.querySelector('.global_mainVisual .gm_title');
                const breadcrumb = document.querySelector('.module_breadCrumb');
                return {
                  archive: rect('.news_archive'),
                  tabs: rect('.news_tabs_archive'),
                  firstItem: rect('.news_archive .news_item'),
                  articleCount: document.querySelectorAll('.news_archive .news_item').length,
                  tabCount: document.querySelectorAll('.news_tabs_archive .news_tabs_item').length,
                  activeLabel: active ? active.textContent.trim() : '',
                  pagerCount: document.querySelectorAll('.news_archive .news_pager').length,
                  pager: rect('.news_archive .news_pager'),
                  pagerCurrent: rect('.news_archive .news_pager_numbers .page-numbers.current'),
                  pagerCurrentStyle: style('.news_archive .news_pager_numbers .page-numbers.current'),
                  pagerNextIcon: rect('.news_archive .news_pager_next .page-numbers span'),
                  pagerNextIconStyle: style('.news_archive .news_pager_next .page-numbers span'),
                  masthead: masthead ? masthead.textContent.trim() : '',
                  breadcrumb: breadcrumb ? breadcrumb.textContent.replace(/\s+/g, ' ').trim() : '',
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                };
              });
              await page.locator('.news_archive').screenshot({ path: `.runtime/budokan-news-master/${item.name}-archive-news.png` });
              await page.locator('.news_archive .news_pager').screenshot({ path: `.runtime/budokan-news-master/${item.name}-archive-pager.png` });
              await page.screenshot({ path: `.runtime/budokan-news-master/${item.name}-archive-page.png`, fullPage: true });

              const desiredCategory = page.locator('.news_tabs_archive .news_tabs_item').filter({ hasText: '武道' }).first();
              const firstCategoryHref = await desiredCategory.locator('a').getAttribute('href');
              let categoryStatus = 0;
              let categoryActive = '';
              let categoryMasthead = '';
              let categoryBreadcrumb = '';
              if (firstCategoryHref) {
                const categoryResponse = await page.goto(firstCategoryHref, { waitUntil: 'networkidle' });
                categoryStatus = categoryResponse?.status() || 0;
                categoryActive = await page.locator('.news_tabs_archive .news_tabs_item.is-active').innerText();
                categoryMasthead = (await page.locator('.global_mainVisual .gm_title').innerText()).trim();
                categoryBreadcrumb = (await page.locator('.module_breadCrumb').innerText()).replace(/\s+/g, ' ').trim();
              }

              const horizontalOverflow = archiveMetrics.scrollWidth > archiveMetrics.clientWidth + 1;
              if ((topResponse?.status() || 0) >= 400 || (archiveResponse?.status() || 0) >= 400 || categoryStatus >= 400 || pageErrors.length) failed = true;
              if (topMetrics.articleCount !== 5 || topMetrics.tabCount !== 6) failed = true;
              if (archiveMetrics.articleCount !== 10 || archiveMetrics.tabCount !== 6 || archiveMetrics.activeLabel !== 'すべて' || archiveMetrics.pagerCount !== 1 || horizontalOverflow) failed = true;
              if (archiveMetrics.masthead !== 'お知らせ' || !archiveMetrics.breadcrumb.includes('お知らせ')) failed = true;
              if (categoryActive.trim() !== '武道' || categoryMasthead !== 'お知らせ' || !categoryBreadcrumb.includes('武道')) failed = true;

              if (item.name === 'sp') {
                if (Math.abs(topMetrics.section.width - item.contentWidth) > 1 || Math.abs(topMetrics.panel.x - 24) > 1 || Math.abs(topMetrics.panel.width - 327) > 1) failed = true;
                if (Math.abs(archiveMetrics.archive.x - 20) > 1 || Math.abs(archiveMetrics.archive.width - 335) > 1 || Math.abs(archiveMetrics.firstItem.width - 335) > 1) failed = true;
                if (!archiveMetrics.pager || Math.abs(archiveMetrics.pager.width - 335) > 1 || Math.abs(archiveMetrics.pager.height - 94) > 1) failed = true;
                if (!archiveMetrics.pagerCurrent || Math.abs(archiveMetrics.pagerCurrent.width - 40) > 1 || Math.abs(archiveMetrics.pagerCurrent.height - 40) > 1) failed = true;
                if (!archiveMetrics.pagerCurrentStyle || archiveMetrics.pagerCurrentStyle.borderRadius !== '50%' || archiveMetrics.pagerCurrentStyle.backgroundColor !== 'rgb(51, 51, 51)') failed = true;
                if (!archiveMetrics.pagerNextIcon || Math.abs(archiveMetrics.pagerNextIcon.width - 30) > 1 || Math.abs(archiveMetrics.pagerNextIcon.height - 30) > 1) failed = true;
                if (!archiveMetrics.pagerNextIconStyle || archiveMetrics.pagerNextIconStyle.borderRadius !== '50%' || archiveMetrics.pagerNextIconStyle.backgroundColor !== 'rgb(242, 242, 242)') failed = true;
              } else {
                if (Math.abs(topMetrics.section.width - item.contentWidth) > 1 || Math.abs(topMetrics.panel.x - 110) > 1 || Math.abs(topMetrics.panel.width - 1160) > 2 || Math.abs(topMetrics.panel.height - 606) > 2) failed = true;
                if (Math.abs(archiveMetrics.archive.x - 210) > 2 || Math.abs(archiveMetrics.archive.width - 960) > 2 || Math.abs(archiveMetrics.firstItem.width - 960) > 2 || Math.abs(archiveMetrics.firstItem.height - 90) > 2) failed = true;
                if (!archiveMetrics.pager || Math.abs(archiveMetrics.pager.height - 40) > 1) failed = true;
                if (!archiveMetrics.pagerCurrent || Math.abs(archiveMetrics.pagerCurrent.width - 50) > 1 || Math.abs(archiveMetrics.pagerCurrent.height - 40) > 1) failed = true;
                if (!archiveMetrics.pagerCurrentStyle || archiveMetrics.pagerCurrentStyle.borderRadius !== '0px' || archiveMetrics.pagerCurrentStyle.borderBottomWidth !== '2px') failed = true;
                if (!archiveMetrics.pagerNextIcon || Math.abs(archiveMetrics.pagerNextIcon.width - 40) > 1 || Math.abs(archiveMetrics.pagerNextIcon.height - 40) > 1) failed = true;
                if (!archiveMetrics.pagerNextIconStyle || archiveMetrics.pagerNextIconStyle.backgroundColor !== 'rgb(191, 62, 43)' || archiveMetrics.pagerNextIconStyle.clipPath === 'none') failed = true;
              }

              results.push({
                viewport: item,
                topStatus: topResponse?.status() || 0,
                archiveStatus: archiveResponse?.status() || 0,
                categoryStatus,
                categoryActive: categoryActive.trim(),
                categoryMasthead,
                categoryBreadcrumb,
                pageErrors,
                horizontalOverflow,
                topMetrics,
                archiveMetrics,
              });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-news-master/runtime.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-news-master-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-news-master
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
