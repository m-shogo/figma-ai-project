schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-FLAT-MARKUP-INNER-INSET
    summary: >-
      When current Figma gives heading text a small inner block inset while a decorative rail spans the
      full component height, a flat WordPress heading should preserve the authored text line-height and
      reproduce the wrapper geometry at the shared owner instead of inflating line-height or adding a
      page-specific patch.
    category: VISUAL_FIDELITY
    applicability:
      scope: REFERENCE
      conditions:
        - Current Figma evidence shows text-wrapper block inset that is not represented by an equivalent wrapper in the production markup.
        - A decorative child or pseudo-element must span the full component height including that inset.
        - The existing shared component owner is authoritative for all consumers.
      exclusions:
        - Do not use negative margins when the production markup already has an equivalent child wrapper that can own the inset directly.
        - Do not generalize the exact 2px inset or negative-margin value to other references without their own Figma evidence.
    promotion_state: null
    promotion:
      candidate: false
      rationale: >-
        This repair is directly evidenced by the Budokan PC/SP h4 masters and repeated tournament h4
        instances, but it is still one reference family. Keep it as an observation until another
        reference reproduces the same flat-markup versus inner-wrapper geometry problem.
      blocked_by:
        - Independent-reference evidence showing the same technique preserves multiline geometry and reduces page-local repair.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-H4-SHARED-OWNER-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-heading-style.css
          commit: 1a64aa04ade2c2dea7112c586649f0ea4dd9030a
          note: >-
            Current Figma PC 1157:8189 and SP 1468:7466 both use a 2px block inset around the 18px/1.4
            heading text while the 4px rail spans the full height; the shared Theme owner now preserves
            line-height and extends the rail through that inset without page-specific CSS.
      contradicts: []
    notes:
      - Youth tournament current PC node 2108:10725 reuses the same h4 family repeatedly, confirming this is a shared-owner repair within Budokan rather than a one-page exception.
      - Exact values remain reference-specific; the portable idea is to preserve typography metrics and repair the missing wrapper geometry at the canonical owner.
