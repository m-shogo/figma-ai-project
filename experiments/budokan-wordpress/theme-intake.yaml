qa_reuse:
  layers:
    - id: wordpress_runtime
      existing_asset: experiments/wordpress-acf-runtime
      reuse_mode: REUSE
      notes:
        - "案件共通の disposable runtime。theme mount のみ差し替える"
        - "提供Themeは experiments/wordpress-acf-runtime/theme-dropin/ へ置くか THEME_SOURCE_DIR で指す"
        - "production Theme構造を sample-theme から継承しない"
        - "旧 experiments/wordpress-acf-pro-standalone-lp は残置。新規はこちらを使う"
    - id: acf_pro_resolution
      existing_asset: experiments/wordpress-acf-runtime/scripts/setup.sh
      reuse_mode: REUSE
      notes:
        - "ACF_PRO_LICENSE_KEY の secret 境界をそのまま使う"
    - id: cms_mutation_qa
      existing_asset: experiments/wordpress-acf-runtime/tests/runtime.mjs
      reuse_mode: ADAPT
      notes:
        - "0/1/8/多数・長文・改行・空・画像なし・並び替え の形を budokan field へ写す"
        - "fixture 内容は ACF field 構造が決まってから作る"
    - id: visual_diff
      existing_asset: experiments/wordpress-acf-runtime/tests/visual-diff.mjs
      reuse_mode: REUSE
      notes:
        - "VISUAL_DIFF_MAX_RATIO 未設定時は MEASURE_ONLY。universal tolerance を入れない"
    - id: typography_metrics
      existing_asset: docs/ref001-typography-runtime-metrics-learning.md
      reuse_mode: ADAPT
      notes:
        - "font-size / line-height / letter-spacing / font-weight を computed style で検証する"
    - id: asset_lineage
      existing_asset: tools/implementation-intake/visual_truth_guard.py
      reuse_mode: REUSE
      notes:
        - "ASSET_PENDING / ASSET_READY / ASSET_CORRUPT / ASSET_INVALID_EPHEMERAL_METADATA をそのまま使う"
        - "Protected PR #142 head 1320476ccaaf86eef6efde6b5cad99533faf085d では PC/SP ASSET_PENDING=0。production Themeへは baseline-asset-source.yaml から必要assetだけselective importし、再hashする"
        - "旧HTML/CSS/JSや旧asset pathはproduction authorityにしない"
    - id: target_readiness
      existing_asset: scripts/coordinate_wordpress_target_readiness.py
      reuse_mode: REUSE
      notes:
        - "Theme到着時の read-only preflight"
  viewports:
    - width: 1380
      role: PC canonical
    - width: 375
      role: SP canonical
  acf_secret_boundary:
    secret_name: ACF_PRO_LICENSE_KEY
    committed: false

