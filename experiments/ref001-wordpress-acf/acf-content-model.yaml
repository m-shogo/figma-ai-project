      - id: reason_3_image
        type: image
        return_format: ID
      - id: reason_3_title
        type: text
      - id: reason_3_body
        type: textarea
    cardinality:
      figma_count: 3
      editor_add_remove: UNDETERMINED
      editor_reorder: UNDETERMINED
      current_decision: FIXED_THREE_FIELDS
      repeater_candidate: BLOCKED_UNTIL_EDITOR_REQUIREMENT_AND_ACF_PRO_CONFIRMED
      rationale:
        - "Figma proves a three-item visual pattern, not that editors should change its cardinality."
        - "Repeater is an ACF PRO feature; license/tier is currently unresolved."
