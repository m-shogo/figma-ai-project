records:
  - learning_id: OBS-BUDOKAN-PAGE-TOP-FOCUS-CONTINUITY
    summary: >-
      A keyboard-activated visual Page Top control can complete its scroll correctly while leaving sequential focus stranded on the
      now-off-screen footer control. Preserve the existing scroll owner, distinguish keyboard activation from pointer activation, reuse
      the existing animation completion signal, and move keyboard focus with preventScroll to an already-visible stable header control.
      Test scroll settlement and post-scroll focus continuity as separate runtime properties.
    category: ACCESSIBILITY
    applicability:
      scope: PROJECT
      conditions:
        - Nippon Budokan uses a footer Page Top anchor whose 300ms scroll animation is owned by common.js.
        - The global header remains visible after Page Top completes and already contains a stable logo link suitable for focus continuity.
        - Actual disposable WordPress output can be exercised with pointer hit-testing and keyboard activation in a real browser runtime.
      exclusions:
        - Do not move focus for pointer activation when the existing pointer interaction does not require it.
        - Do not introduce a second scroll owner or duplicate an animation duration when the existing animation queue exposes completion.
        - Do not invent a new focusable element when an existing visible control already provides a stable destination.
        - Do not treat successful visual scroll settlement as proof that keyboard focus continuity is correct.
        - Same-project evidence is not independent evidence for cross-project promotion.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        PR #437 reproduced the defect on actual disposable WordPress output before repair: Enter activation reached scrollY=0 but retained
        focus in the off-screen footer. The bounded repair kept common.js as the scroll owner, acted only on keyboard-generated clicks,
        reused the existing jQuery body/html animation queue, and focused the existing header logo with preventScroll. Dedicated PC/SP
        Page Top QA and the affected shared runtime blast-radius workflows passed before squash merge.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-PAGE-TOP-FOCUS-CONTINUITY-20260906
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/page-top-focus-stability.js
          commit: 1914ae7af8a7aac8805dc4ded2b3be4c45f18d20
          note: >-
            PR #437 squash-merged after QA-first reproduction. Dedicated real WordPress/Playwright QA covered a non-zero deep-scroll
            baseline, real pointer ownership, keyboard activation, top settlement, visible header focus ownership, pointer activation,
            horizontal overflow and page errors. Shared TOP FV and Mega Touch regressions and REF001 audit were green before merge; the
            merge commit REF001 audit was also green.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-06: KEEP_PROJECT_ONLY; Budokan-only evidence, no auto-promotion."
