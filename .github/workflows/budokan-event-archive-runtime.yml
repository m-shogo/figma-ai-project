name: Budokan Event Archive Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/archive.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/inc/event.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/json/group_event.json'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_event-archive.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_event-card.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_event-month-nav.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_news-tabs.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_label-category.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/module/module_eventArchive.css'
      - 'experiments/wordpress-acf-runtime/scripts/seed-event-archive-qa.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-event-archive-rhythm-browser-qa.mjs'
      - '.github/workflows/budokan-event-archive-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable WordPress runtime
        env:
          BUDOKAN_NEWS_ARCHIVE_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-news-archive-runtime-qa.sh

      - name: Seed current-month Event archive fixture
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose run --rm cli eval-file /fixture/scripts/seed-event-archive-qa.php

          html="$(mktemp)"
          http_code="$(curl --silent --show-error --location --max-redirs 3 --output "$html" --write-out '%{http_code}' "${WP_URL}/event/")"
          [[ "$http_code" == "200" ]]
          grep -Fq 'class="global_inner _content event_archive_inner"' "$html"
          grep -Fq 'class="ea_list"' "$html"
          grep -Fq 'class="ea_card"' "$html"
          grep -Fq '一般' "$html"
          grep -Fq '武道' "$html"
          grep -Fq '書道' "$html"
          card_count="$(grep -o 'class="ea_card"' "$html" | wc -l | tr -d ' ')"
          [[ "$card_count" -eq 10 ]]
          rm -f "$html"

      - name: Run PC and SP Event archive browser QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/event/"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node experiments/wordpress-acf-runtime/scripts/budokan-event-archive-rhythm-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
