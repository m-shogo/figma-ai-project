responsive:
  breakpoint_evidence:
    source: OWNER
    source_refs:
      - "Owner decision recorded 2026-08-11: production breakpoint is 768px; mobile <= 767px, desktop >= 768px."
    values:
      - name: mobile
        media_query: "(max-width: 767px)"
        min_width_px: null
        max_width_px: 767
      - name: desktop
        media_query: "(min-width: 768px)"
        min_width_px: 768
        max_width_px: null
    notes:
      - "Figma provides 1380px PC and 375px SP reference frames; those remain exact visual acceptance endpoints, not breakpoint evidence."
      - "The production threshold was resolved separately by the owner and is therefore recorded with source=OWNER rather than inferred from Figma frame widths."
      - "Runtime safety probes should include 767/768/769 around the resolved boundary in addition to representative widths."
  invariants:
    - "All visible website-content top-level sections have high-confidence PC/SP pairings."
    - "Content identity and order remain useful even when corresponding PC/SP layer names differ."
    - "Visible PC/SP roots explicitly pin their expected template Variable Mode before implementation."
    - "Education preserves semantic stage order 01→04 across PC/SP."
    - "Student Voice preserves three supplied summary items across PC/SP, with only item 1 supplied as expanded detail."
    - "Messages PC/SP share the same current item source/content even though only one of four indicated records is present."
  transitions:
    - "Reason changes from a three-column PC presentation to a vertical SP stack."
    - "Education changes from a horizontal four-stage progression to a tall vertical SP composition while preserving stage order."
    - "Student Voice expanded/collapsed presentations become substantially taller on SP."
    - "Messages changes from a large right-side image composition to a 343px-class SP image crop while keeping the current 1/4 state."
  ordering_rules:
    - "Preserve the semantic page order Header → MainVisual → Reason → Education → CTA → Student Voice → Messages → CTA → Courses → Links → CTA Value → Footer."
  visibility_rules: []
  wrapping_rules: []
  container_rules: []
  unknowns:
    - "Student Voice interaction contract: disclosure/navigation/default state/keyboard/animation."
    - "Messages records 2–4 and carousel/slider behavior."
    - "Deep layout/interaction details for Courses, CTA Value, and remaining not-yet-profiled sections."

owner_notes:
  - "Keep PC/SP on the same Figma page as a provisional working convention for this run; promote to a project rule only after real-run evidence accumulates."
  - "Do not redesign the supplied Figma; implementation fidelity is the objective."
  - "The visible PC root was re-captured after the owner corrected template mode inheritance; use current visible-root IDs rather than hidden pre-fix copies."
  - "Implementation target is WordPress fixed-page template + ACF. The target theme repository still must be inspected before theme-specific choices are frozen."
  - "Production breakpoint is owner-resolved at 768px: mobile <= 767px and desktop >= 768px; 375/1380 remain visual acceptance endpoints."
  - "Learning-first rule: missing interaction/content evidence stays BLOCKED/UNDETERMINED rather than being filled with plausible CMS or JavaScript architecture."

