cms_decision:
  page_acf_ownership: PAGE_COPY_OVER_FIXED_DOMAIN_IDENTITIES
  cardinality: 7
  editor_add_remove: false
  editor_reorder: false
  repeater: NOT_BASELINE
  rationale:
    - "The supplied design names seven institutional courses and presents the section as 未来につながる７つのコース."
    - "Course count/order is domain identity in the learning baseline, not page-builder flexibility."
    - "The eventual WordPress theme must be inspected for an existing Course CPT/taxonomy/options/config source before page-local duplication is accepted."

identity_contract:
  code_or_domain_owned:
    - key
    - title
    - order
    - color_token
    - icon_identity
  page_acf_editable:
    - description
    - recommendation_1
    - recommendation_2
  unresolved_until_target_repo:
    - link_url
    - shared_course_source
    - icon_asset_source

