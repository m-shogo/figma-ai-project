schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-TOP-FV-CURRENT-AUTHORITY-BOUNDARY
    summary: >-
      For a large Figma full-page frame that cannot be returned as full design context, resolve the current full-page authority first,
      then inspect bounded same-file sub-compositions that visibly belong to that surface before correcting Theme geometry. Do not
      carry measurements from old Figma files merely because the component name is unchanged.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - A current full-page Figma frame is too large for one design-context response.
        - The same current Figma file contains a bounded composition exposing exact geometry and typography for the target surface.
        - The Theme owner is isolated enough that the correction does not widen into unrelated page consumers.
      exclusions:
        - Do not substitute retired Figma file keys or historical node IDs for missing current authority.
        - Do not infer a dedicated SP TOP design when the current SP page does not expose a proven 375px TOP full-page authority.
        - Do not overwrite ACF content ownership; align only fallback fixture copy and proven Theme presentation differences.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        The evidence is strong for the Budokan TOP owner: the current PC page resolves TOP as 1603:7062, and bounded current-file
        FV nodes 2182:8103 through 2182:8240 expose the 1030px MV, 60px title inset, exact current fallback copy, gradient,
        notice border/radii, guide separator color, and final guide-title tracking. This is still one project/reference family and
        does not satisfy the cross-reference requirement for broader promotion.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: >-
        The Theme previously documented retired fileKey fKYDn9ikpJk1nW7IWFtaUx and old node IDs while CURRENT_AUTHORITY.md now
        requires FKQaJDu5TZXHoCzPsfP92E only. The current SP page has a 1380-wide TOP frame but no proven 375px TOP full-page
        counterpart, so existing SP responsive behavior is preserved rather than re-authored from historical SP evidence.
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-TOP-FV-CURRENT-FIGMA-20260904
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_mainVisual.css
          commit: ''
          note: >-
            LIVE current Figma file FKQaJDu5TZXHoCzPsfP92E was re-resolved from PC page 0:1. TOP is current frame 1603:7062.
            Because that full page is too large for one design-context response, same-file bounded FV reference 2182:8103 was
            read directly: image 1030x600 at x=60; title group x=120/top=407 (60px inset from MV, 307px from MV top);
            title 46px Zen Old Mincho 1.5/5% and lead 18px Zen Kaku 1.4/5%; current fallback copy is
            '伝統を未来へつなぐ、／武道文化の中心地' with '武道、書道の普及・振興、公益目的事業の拠点として活動しています。'.
            The overlay gradient is rgba(16,24,39,.6) 17.905% to transparent 46.76% at 25.47deg. Notice is 600x70 white,
            primary 1px border, with top-left square and the other three corners 3px. Current guide node 2182:8115 shows
            #e2d3b8 separators and 10% tracking only on the 日本武道館 heading. Theme TOP-only CSS and fallback fixture copy
            were corrected; production ACF owners top_slider-01/top_notice-01 remain unchanged.
        - evidence_id: EV-BUDOKAN-TOP-FV-ACF-CAPABILITY-RUNTIME-20260904
          kind: RUN_RECORD
          reference_id: REF-002-BUDOKAN
          run_id: 'pr-378-runtime-correction'
          path: experiments/wordpress-acf-runtime/scripts/budokan-top-fv-runtime-qa.sh
          commit: ''
          note: >-
            The first disposable WordPress run had the public ACF plugin active, so get_field()/have_rows() existed while the
            ACF Pro Repeater field type/data did not. Function-presence alone therefore caused the TOP notice owner to be read as
            absent/off and hid the intended fallback. Removing ACF entirely was also invalid because existing shared Theme header
            code calls get_field() unguarded and produced HTTP 500. The bounded correction keeps ACF APIs available for existing
            Theme consumers while front-page.php checks the actual Pro Repeater capability (`acf_field_repeater`) before claiming
            top_slider-01/top_notice-01 ownership. Real production ACF Pro semantics remain unchanged; no field group or data model
            was invented.
        - evidence_id: EV-BUDOKAN-TOP-FV-FLUID-PC-RUNTIME-20260904
          kind: RUN_RECORD
          reference_id: REF-002-BUDOKAN
          run_id: 'pr-378-browser-correction'
          path: experiments/wordpress-acf-runtime/scripts/budokan-top-fv-browser-qa.mjs
          commit: ''
          note: >-
            Playwright at a nominal 1380px browser viewport renders the TOP root/stage at 1365px because the existing shared
            normalize.css declares `scrollbar-gutter: stable` on :root, reserving the platform scrollbar gutter. That leaves a
            1015px fluid MV while preserving the current-Figma fixed allocation of 60px left padding, 30px right padding, 20px gap
            and 240px guide. Changing the shared scrollbar policy only to force TOP to 1030px would widen blast radius across the
            site, so it remains untouched. Browser QA instead proves those authored fixed dimensions and verifies the MV as the exact
            remaining fluid allocation; without a reserved gutter, a 1380px stage resolves to the authored 1030px Figma width.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-04: KEEP_PROJECT_ONLY; current same-file evidence plus project runtime evidence proves the Budokan TOP correction but is not independent cross-project evidence."
      - Preserve current SP behavior until a current 375px TOP authority is explicitly present or Human declares a shared SP master.
      - Prefer capability checks for Pro-only ACF field owners over generic ACF function-presence checks when a degraded/test runtime can expose public ACF APIs without the Pro field type.
      - Preserve the shared stable scrollbar gutter unless a site-wide authority explicitly changes it; do not compensate for it with TOP-only overflow or fixed canvas width.
