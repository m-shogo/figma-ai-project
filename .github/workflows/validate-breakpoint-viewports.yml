name: Validate breakpoint viewports

on:
  push:
    paths:
      - "templates/shared-contract.yaml"
      - "contracts/**/*.yaml"
      - "references/**/*.yaml"
      - "experiments/**/*.yaml"
      - "scripts/validate_breakpoint_viewports.py"
      - "tests/test_breakpoint_viewports.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-breakpoint-viewports.yml"
  pull_request:
    paths:
      - "templates/shared-contract.yaml"
      - "contracts/**/*.yaml"
      - "references/**/*.yaml"
      - "experiments/**/*.yaml"
      - "scripts/validate_breakpoint_viewports.py"
      - "tests/test_breakpoint_viewports.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-breakpoint-viewports.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate breakpoint verification viewport mapping
        run: python scripts/validate_breakpoint_viewports.py

      - name: Test breakpoint viewport validator
        run: python -m unittest tests.test_breakpoint_viewports -v
