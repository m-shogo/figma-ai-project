schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: BUDOKAN-WP-ARCHIVE-ROUTE-OWNER
    summary: A WordPress post type display label is not a route contract; detail return links should resolve from WordPress-owned posts/archive APIs rather than reconstructing URL paths from labels.
    category: CMS
    applicability:
      scope: PROJECT
      conditions:
        - A WordPress detail view needs a link back to the configured posts page or a custom post type archive.
        - Human-readable post type labels, translated names, or assumed slugs differ from or could drift from routing ownership.
      exclusions:
        - An explicit project contract intentionally routes the return action to a non-archive landing page.
        - The target post type has no archive and another destination is explicitly authoritative.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: The Budokan Theme contains a concrete label-derived routing failure boundary and real runtime proof can verify the core archive API path. Keep the rule project-scoped until an independent WordPress project/reference confirms the same failure or measurable avoided rework.
      blocked_by:
        - Independent WordPress project/reference confirming the same route-ownership failure or avoided repair cost.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-WP-ARCHIVE-ROUTE-NOTE
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/learning-notes/2026-09-02-detail-archive-route-owner.md
          commit: ''
          note: Records the display-label versus route-owner bug, root cause, WordPress-core fix, runtime proof, and project-level generalization boundary.
        - evidence_id: EV-BUDOKAN-WP-ARCHIVE-ROUTE-THEME
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/inc/custom.php
          commit: ''
          note: The Event post type is registered under key event with display label イベント and has_archive enabled, demonstrating that display identity and archive-route ownership are separate concepts.
      contradicts: []
    notes:
      - Keep PROJECT_ONLY; do not auto-promote from one project/reference.
      - Re-review through the canonical promotion cadence if independent evidence appears or the WordPress routing model changes.
