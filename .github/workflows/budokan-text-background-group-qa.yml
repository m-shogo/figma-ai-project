name: Budokan Text Background Group QA

on:
  push:
    branches:
      - agent/budokan-text-background-group-master
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-group-style.css'
      - '.github/workflows/budokan-text-background-group-qa.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start real WordPress + ACF PRO runtime
        run: bash experiments/wordpress-acf-runtime/scripts/setup.sh

      - name: Seed native Gutenberg background Group
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          CONTENT='<!-- wp:group {"style":{"color":{"background":"#ffffff"}}} --><div class="wp-block-group has-background" style="background-color:#ffffff"><!-- wp:paragraph --><p>背景付きテキストボックス 日本武道館では、武道大会や研修会など、多様な参加型イベントを開催しています。</p><!-- /wp:paragraph --></div><!-- /wp:group -->'
          docker compose run --rm cli post create \
            --post_type=page \
            --post_status=publish \
            --post_title='Background Group QA' \
            --post_name='background-group-qa' \
            --post_content="$CONTENT" >/dev/null
          printf '%s' "$WP_URL/background-group-qa/" > /tmp/budokan-group-url

      - name: Install browser probe
        run: |
          mkdir -p /tmp/budokan-playwright
          cd /tmp/budokan-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify SP then PC runtime geometry
        env:
          QA_URL_FILE: /tmp/budokan-group-url
        run: |
          cat > /tmp/budokan-playwright/qa.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const url = fs.readFileSync(process.env.QA_URL_FILE, 'utf8');
          const browser = await chromium.launch({headless:true});
          const results = {};
          for (const [name,width,expected] of [['sp',390,30],['pc',1395,32]]) {
            const page = await browser.newPage({viewport:{width,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto(url,{waitUntil:'networkidle'});
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP ${response?.status()}`);
            const data=await page.locator('.block-editor_wrap .wp-block-group.has-background').first().evaluate(el=>{
              const s=getComputedStyle(el); const p=el.querySelector('p'); const ps=p?getComputedStyle(p):null;
              return {paddingTop:parseFloat(s.paddingTop),paddingRight:parseFloat(s.paddingRight),paddingBottom:parseFloat(s.paddingBottom),paddingLeft:parseFloat(s.paddingLeft),background:s.backgroundColor,paragraphMarginTop:ps?parseFloat(ps.marginTop):null,rect:el.getBoundingClientRect().toJSON(),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            for (const k of ['paddingTop','paddingRight','paddingBottom','paddingLeft']) if (Math.abs(data[k]-expected)>0.1) throw new Error(`${name}: ${k}=${data[k]} expected ${expected}`);
            if (data.background !== 'rgb(255, 255, 255)') throw new Error(`${name}: background ${data.background}`);
            if (Math.abs(data.paragraphMarginTop)>0.1) throw new Error(`${name}: first child margin-top ${data.paragraphMarginTop}`);
            if (data.overflow > 0.5) throw new Error(`${name}: page overflow ${data.overflow}`);
            if (errors.length) throw new Error(`${name}: page errors ${errors.join('; ')}`);
            results[name]=data;
            await page.screenshot({path:`/tmp/budokan-${name}-group.png`,fullPage:true});
            await page.close();
          }
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          JS
          cd /tmp/budokan-playwright
          node qa.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-text-background-group
          path: /tmp/budokan-*-group.png
          if-no-files-found: ignore

      - name: Stop runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
