name: Budokan News Archive Runtime

on:
  pull_request:
    paths:
      - 'projects/nipponbudokan/theme/archive.php'
      - 'projects/nipponbudokan/theme/template-parts/_news-archive.php'
      - 'projects/nipponbudokan/theme/template-parts/_news-tabs.php'
      - 'projects/nipponbudokan/theme/template-parts/_list-news.php'
      - 'projects/nipponbudokan/theme/template-parts/_list-news_article.php'
      - 'projects/nipponbudokan/theme/css/module/global_mainVisual.css'
      - 'projects/nipponbudokan/theme/css/module/module_newsList-01.css'
      - 'projects/nipponbudokan/qa/budokan-news-archive-runtime-qa.sh'
      - 'projects/nipponbudokan/qa/budokan-news-archive-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-news-archive-rhythm-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-news-archive-interaction-browser-qa.mjs'
      - 'projects/nipponbudokan/docs/learning-notes/2026-08-31-news-archive-master.md'
      - '.github/workflows/budokan-news-archive-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: nipponbudokan
  COMPOSE_PROJECT_NAME: nipponbudokan-qa
  WP_PORT: '27248'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress News archive runtime QA
        env:
          BUDOKAN_NEWS_ARCHIVE_KEEP_RUNTIME: '1'
        run: bash projects/nipponbudokan/qa/budokan-news-archive-runtime-qa.sh

      - name: Run SP and PC News archive browser geometry and interaction QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/news/"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node projects/nipponbudokan/qa/budokan-news-archive-browser-qa.mjs "$qa_url"
          node projects/nipponbudokan/qa/budokan-news-archive-rhythm-browser-qa.mjs "$qa_url"
          node projects/nipponbudokan/qa/budokan-news-archive-interaction-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
