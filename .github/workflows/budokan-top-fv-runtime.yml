name: Budokan TOP FV Runtime

on:
  pull_request:
    paths:
      - 'projects/nipponbudokan/theme/functions.php'
      - 'projects/nipponbudokan/theme/front-page.php'
      - 'projects/nipponbudokan/theme/template-parts/_header.php'
      - 'projects/nipponbudokan/theme/template-parts/_footer.php'
      - 'projects/nipponbudokan/theme/inc/menu.php'
      - 'projects/nipponbudokan/theme/css/project/top_mainVisual.css'
      - 'projects/nipponbudokan/theme/css/layout/global_header.css'
      - 'projects/nipponbudokan/theme/css/layout/global_wrapper.css'
      - 'projects/nipponbudokan/theme/js/common.js'
      - 'projects/nipponbudokan/theme/js/header-focus-stability.js'
      - 'projects/nipponbudokan/theme/js/home.js'
      - 'projects/nipponbudokan/qa/budokan-top-fv-runtime-qa.sh'
      - 'projects/nipponbudokan/qa/budokan-top-fv-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-top-slider-motion-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-overlay-stability-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-search-backdrop-close-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-header-state-stability-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-footer-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-fallback-navigation-browser-qa.mjs'
      - 'projects/nipponbudokan/docs/TOP_FV_VISUAL_ALIGNMENT_2026-08-31.md'
      - '.github/workflows/budokan-top-fv-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: nipponbudokan
  COMPOSE_PROJECT_NAME: nipponbudokan-qa
  WP_PORT: '27248'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress TOP FV runtime QA
        env:
          BUDOKAN_TOP_FV_KEEP_RUNTIME: '1'
        run: bash projects/nipponbudokan/qa/budokan-top-fv-runtime-qa.sh

      - name: Install Playwright Chromium for TOP browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run SP and PC TOP FV browser geometry QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-top-fv-browser-qa.mjs "$qa_url"

      - name: Run TOP slider reduced-motion browser QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-top-slider-motion-browser-qa.mjs "$qa_url"

      - name: Run SP and PC overlay background stability QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-overlay-stability-browser-qa.mjs "$qa_url"

      - name: Run SP and PC search backdrop close pointer QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-search-backdrop-close-browser-qa.mjs "$qa_url"

      - name: Run SP and PC header interaction state stability QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-header-state-stability-browser-qa.mjs "$qa_url"

      - name: Run SP and PC footer geometry and placeholder QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-footer-browser-qa.mjs "$qa_url"

      - name: Run unassigned menu fallback interaction QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-fallback-navigation-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
