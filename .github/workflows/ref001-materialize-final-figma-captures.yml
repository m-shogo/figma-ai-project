name: REF001 Materialize Final Review Evidence

on:
  push:
    branches:
      - agent/ref001-v2-final-micro-qa
    paths:
      - .github/workflows/ref001-materialize-final-figma-captures.yml

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      RUNTIME_ARTIFACT_ID: '9176362177'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ref001-v2-final-micro-qa
          fetch-depth: 1

      - name: Download final passing runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref001-runtime
          curl --fail --location --retry 2 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/m-shogo/figma-ai-project/actions/artifacts/${RUNTIME_ARTIFACT_ID}/zip" \
            -o /tmp/ref001-runtime.zip
          unzip -q /tmp/ref001-runtime.zip -d /tmp/ref001-runtime
          mkdir -p experiments/ref001-blind-clean-20260812/evidence/final/latest
          cp /tmp/ref001-runtime/first-pass-320.png experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-320.png
          cp /tmp/ref001-runtime/first-pass-375.png experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-375.png
          cp /tmp/ref001-runtime/first-pass-1380.png experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-1380.png
          cp /tmp/ref001-runtime/runtime-probes.json experiments/ref001-blind-clean-20260812/evidence/final/latest/runtime-probes.json

      - name: Verify acceptance endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path('experiments/ref001-blind-clean-20260812/evidence/final/latest')
          expected_png = {
              root / 'first-pass-320.png': (320, 10781),
              root / 'first-pass-375.png': (375, 10777),
              root / 'first-pass-1380.png': (1380, 7714),
          }
          for path, dims in expected_png.items():
              data = path.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'not png: {path}')
              actual = struct.unpack('>II', data[16:24])
              if actual != dims:
                  raise SystemExit(f'wrong dimensions: {path}: {actual} != {dims}')
          probes = json.loads((root / 'runtime-probes.json').read_text())
          by_width = {row['width']: row for row in probes}
          for width, height in ((375, 10777), (1380, 7714)):
              row = by_width[width]
              assert row['bodyHeight'] == height, (width, row['bodyHeight'])
              assert row['pageOverflowPx'] == 0, (width, row['pageOverflowPx'])
              assert not row['readableTextClipping'], (width, row['readableTextClipping'])
              assert not row['runtimeErrors'], (width, row['runtimeErrors'])
          print('final runtime evidence verified')
          PY

      - name: Commit final deterministic Web captures
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-320.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-375.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/first-pass-1380.png \
                  experiments/ref001-blind-clean-20260812/evidence/final/latest/runtime-probes.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence: refresh final V2 runtime captures'
          git push origin HEAD:agent/ref001-v2-final-micro-qa
