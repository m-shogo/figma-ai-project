name: REF001 one-shot runtime fix

on:
  push:
    branches:
      - agent/ref001-css-canonicalize
    paths:
      - '.github/workflows/ref001-one-shot-runtime-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ref001-css-canonicalize
          fetch-depth: 0
      - name: Apply deterministic canonical CSS fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css')
          source = path.read_text()

          replacements = {
              "url('assets/images/": "url('../images/",
              "url('assets/icons/": "url('../icons/",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected CSS path contract missing: {old}')
              source = source.replace(old, new)

          marker = '/* REF001 narrow-mobile overflow contract */'
          if marker in source:
              raise SystemExit('narrow-mobile overflow contract already present')
          source += '''\n\n/* REF001 narrow-mobile overflow contract */\n@media (max-width:374px){\n  .ref-links__grid{\n    --ref-links-gap:min(19px,5vw);\n    --group-size:calc((100vw - 32px - var(--ref-links-gap))/2);\n    --face-size:calc(var(--group-size) - 7px);\n    column-gap:var(--ref-links-gap)!important;\n  }\n}\n'''
          path.write_text(source)
          PY
      - name: Validate no broken CSS-relative REF001 asset paths remain
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css').read_text()
          assert "url('assets/icons/" not in css
          assert "url('assets/images/" not in css
          assert "url('../icons/" in css
          assert "url('../images/" in css
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/ref001-one-shot-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css .github/workflows/ref001-one-shot-runtime-fix.yml
          git commit -m 'Fix REF-001 runtime asset paths and narrow-mobile overflow'
          git push origin HEAD:agent/ref001-css-canonicalize
