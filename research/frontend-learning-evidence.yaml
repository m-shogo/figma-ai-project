      - Operational use is already stronger than the cross-design generalization evidence; keep that distinction visible.

  - learning_id: OBS-REF001-HUMAN-EDITABILITY-EVIDENCE
    summary: Human editability is more trustworthy when task-based change drills preserve snapshot provenance, located ownership, actual change surface, and regression evidence instead of relying on a numeric self-score alone.
    category: MAINTAINABILITY
    applicability:
      scope: REFERENCE
      conditions:
        - A delivered implementation is expected to be modified by a human after generation.
      exclusions:
        - Non-file CMS changes can legitimately have no changed file when the evidence explains the runtime/admin mutation.
    promotion_state: null
    promotion:
      candidate: true
      rationale: REF-001 provides real change-drill evidence and validator proof, but broader project-family evidence is still desirable.
      blocked_by:
        - Independent implementation family or reference proving the drill evidence remains useful without becoming ceremonial overhead.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-HUMAN-EDITABILITY-DOC
          kind: CANONICAL_DOC
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: docs/human-editability.md
          commit: ''
          note: Defines discoverability, locality, intent readability, reuse safety, content ownership, and disposable change drills.
        - evidence_id: EV-HUMAN-EDITABILITY-HISTORICAL-RUN
          kind: RUN_RECORD
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: RUN-REF001-BLIND-CLEAN-20260812-A
          path: experiments/ref001-blind-clean-20260812/run.yaml
          commit: ''
          note: Historical run contains rich PASS-prefixed regression results for three real change drills.
        - evidence_id: EV-HUMAN-EDITABILITY-STRICT-EVIDENCE
          kind: COMMIT
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: scripts/validate_human_editability.py
          commit: 41ff4dcdb6aa0c5cb59ad144092650ba87f93426
          note: PR #208 requires material drill evidence for new schema-v13+ runs while preserving historical semantics.
      contradicts: []
    notes: []

  - learning_id: OBS-PROJECT-RUN-TEMPLATE-AUTHORITY
    summary: Record generators should derive from the canonical template rather than manually duplicating evolving schema fields, because duplicated constructors drift silently as the contract grows.
    category: TOOLING
    applicability:
      scope: PROJECT
      conditions:
        - A generated record has a canonical checked-in template whose schema evolves over time.
      exclusions:
        - This does not imply every runtime object in every project must be template-generated.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: Confirmed repository-internal tooling invariant; not a cross-project frontend implementation rule.
      blocked_by: []
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-RUN-TEMPLATE-GENERATOR
          kind: COMMIT
          reference_id: ''
          run_id: ''
          path: scripts/create_section_run.py
          commit: b57a6c089c359d02fca5ce3a00e5fd384b1e3472
          note: PR #206 removed the stale hardcoded schema-10 run constructor and made the canonical run template authoritative.
        - evidence_id: EV-RUN-TEMPLATE-CANONICAL
          kind: CANONICAL_DOC
          reference_id: ''
          run_id: ''
          path: templates/run-record.yaml
          commit: ''
          note: Current run template carries the evolving contract fields consumed by the generator.
      contradicts: []
    notes:
      - Keep PROJECT_ONLY unless independent repositories show the same architecture and benefit.
