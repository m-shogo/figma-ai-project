schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-COMPONENT-INTERNAL-VS-PAGE-COMPOSITION-SPACING
    summary: >-
      When a repeated page composition visually differs from a shared layout master, separate component-internal
      geometry from page-composition geometry before changing shared CSS. Reuse the verified component owner for its
      internal spacing and keep isolated outer grid spacing content-owned until repeated runtime/authority evidence
      proves a reusable shared derivative.
    category: REUSE
    applicability:
      scope: PROJECT
      conditions:
        - Current Figma page and existing Theme block owners were inspected against the same composition.
        - A component's internal geometry already matches an existing reusable Theme owner.
        - The remaining visual delta belongs to an outer page composition whose shared consumers use a different canonical spacing.
      exclusions:
        - Do not globally widen a shared columns/grid rule to match one page composition.
        - Do not invent page-specific CSS, a Gutenberg style slot, ACF field, CPT, or repeater solely from visual repetition.
        - Do not treat same-project evidence as independent promotion evidence.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        Tournament page 2108:10725 provides one Budokan-local case: each 大会案内 card has a 30px image/text gap
        already owned correctly by wp-block-media-text-style.css, while the outer card grid uses 40px horizontal and
        60px vertical composition gaps. The generic wp-block-columns owner has a separate 24px shared contract.
        This supports a project-local reuse/blast-radius rule but supplies no independent reference evidence.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-TOURNAMENT-CARD-COMPOSITION-20260903
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/TOURNAMENT_CARD_COMPOSITION_AUDIT_2026-09-03.md
          commit: ''
          note: >-
            LIVE current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected at tournament page 2108:10725. The
            大会案内 cards are 500px two-column items with 240x160 media and a 30px internal media/text gap, matching
            the existing shared wp-block-media-text owner. Their outer repeated grid uses 40px horizontal / 60px
            vertical gaps, while the generic wp-block-columns owner remains a 24px shared text-column master.
            No Theme code or data-model change was made; the outer spacing stays content/composition-owned until a
            reusable variant is proven.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-03: KEEP_PROJECT_ONLY; same-project REF-002-BUDOKAN evidence does not satisfy independent-reference promotion cadence."
      - Preserve the verified shared component owner and distinguish its geometry from surrounding page composition before creating a new variant.
