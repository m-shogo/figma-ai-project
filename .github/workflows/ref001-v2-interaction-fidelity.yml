name: REF001 V2 Interaction Fidelity

on:
  pull_request:
    paths:
      - 'experiments/ref001-blind-clean-20260812/implementation/**'
      - 'experiments/ref001-blind-clean-20260812/tools/verify-human-polish.mjs'
      - 'experiments/ref001-blind-clean-20260812/tools/verify-js-no-visual-diff.mjs'
      - '.github/workflows/ref001-v2-interaction-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-polish-interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP syntax and authority contract
        run: |
          find experiments/ref001-blind-clean-20260812/implementation/theme -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '
            $a = require "experiments/ref001-blind-clean-20260812/implementation/theme/inc/figma-authority.php";
            $p = $a["interaction"]["prototype"] ?? [];
            $audit = $p["component_reaction_audit"] ?? [];
            if (($a["frames"]["pc"]["node"] ?? null) !== "21384:8173") exit(1);
            if (($a["frames"]["sp"]["node"] ?? null) !== "21376:4401") exit(2);
            if (($p["pc_final_frame_reactions"] ?? null) !== 0) exit(3);
            if (($p["sp_final_frame_reactions"] ?? null) !== 0) exit(4);
            if (($p["valid_ref001_reactions"] ?? null) !== 0) exit(5);
            if (($audit["pc-header"]["status"] ?? null) !== "STALE_REJECTED") exit(6);
            if (($audit["pc-footer"]["status"] ?? null) !== "STALE_REJECTED") exit(7);
            if (($a["interaction"]["transition_ms"] ?? null) !== 300) exit(8);
            if (($a["interaction"]["student-voice"]["runtime_authority"] ?? null) !== "PRODUCT_DECISION") exit(9);
            if (($a["interaction"]["messages"]["runtime_authority"] ?? null) !== "PRODUCT_DECISION") exit(10);
            if (($a["interaction"]["messages"]["authored_slide_content_count"] ?? null) !== 1) exit(11);
            if (($a["interaction"]["messages"]["runtime_slide_count"] ?? null) !== 4) exit(12);
          '

      - name: Stage canonical rendered assets
        run: |
          SOURCE='implementation/theme/assets/images/ref001/rendered'
          DEST='experiments/ref001-blind-clean-20260812/implementation/theme/assets/images/ref001/rendered'
          if [ -d "$SOURCE" ]; then
            mkdir -p "$DEST"
            cp -R "$SOURCE"/. "$DEST"/
          fi

      - name: Install browser runtime
        run: |
          mkdir -p /tmp/ref001-human-polish
          cd /tmp/ref001-human-polish
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/experiments/ref001-blind-clean-20260812/tools/verify-human-polish.mjs" ./verify.mjs

      - name: Start current fixture
        run: |
          php -S 127.0.0.1:8765 -t "$GITHUB_WORKSPACE/experiments/ref001-blind-clean-20260812/implementation/theme" >/tmp/ref001-head.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/preview.php >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ref001-head.log
          exit 1

      - name: Verify Human Review interaction contract
        env:
          NODE_PATH: /tmp/ref001-human-polish/node_modules
        run: |
          cd /tmp/ref001-human-polish
          node verify.mjs \
            http://127.0.0.1:8765/preview.php \
            "$GITHUB_WORKSPACE/experiments/ref001-blind-clean-20260812/evidence/human-polish"

      - name: Publish summary
        if: always()
        run: |
          REPORT='experiments/ref001-blind-clean-20260812/evidence/human-polish/report.json'
          {
            echo '## REF-001 Human Review interaction QA'
            echo
            echo '- Visual changes are explicitly user-approved work-in-progress for `/latest/`; exact base/head pixel equality is intentionally not the gate in this phase.'
            echo '- `/final/` remains separately frozen until explicit human approval.'
            if [ -f "$REPORT" ]; then
              echo '- PC/SP overflow + runtime readiness: evaluated'
              echo '- 0.3s interaction contract: evaluated'
              echo '- button + OC hover inversion: evaluated'
              echo '- Student Voice disclosure: evaluated'
              echo '- Swiper next navigation: evaluated'
              echo '- Page Top scroll behavior: evaluated'
              echo '- Footer destinations: evaluated'
            else
              echo '- Evidence report was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Human Review interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref001-human-polish
          path: experiments/ref001-blind-clean-20260812/evidence/human-polish
          if-no-files-found: warn
          retention-days: 14
