schema_version: 3
policy_id: COMPANY-POLICY-XXXX
company: ""
project_scope: ""
status: DRAFT # DRAFT | ACTIVE | SUPERSEDED
created_at: ""
updated_at: ""

precedence:
  # Compatibility baseline evidence order only. Effective frontend authority also resolves
  # explicit authorized Project/Owner overrides per docs/frontend-authority-model.md.
  implementation_constraints:
    - COMPANY_POLICY
    - EXISTING_CODEBASE
    - FIGMA_IMPLEMENTATION_EVIDENCE
    - AGENT_INFERENCE
  visual_design_source: FIGMA_REFERENCE
  conflict_policy: RECORD_AND_ESCALATE # RECORD_AND_ESCALATE | OWNER_DECIDES
  notes: []

