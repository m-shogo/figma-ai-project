name: REF001 Plugin Rendered Asset PoC

on:
  push:
    branches:
      - agent/figma-plugin-rendered-asset-transfer
    paths:
      - 'tmp/ref001-plugin-asset/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble URL-less Figma rendered asset
        run: |
          python scripts/assemble_figma_plugin_asset.py \
            --chunks-dir tmp/ref001-plugin-asset/chunks \
            --output experiments/ref001-wordpress-acf/artifacts/rendered-media/education-01-visible.jpg \
            --file-key ZYTdtw4wCgkcBy2cVnhxVI \
            --node-id 21378:7980 \
            --logical-name education-01-visible-composite \
            --export-format JPG \
            --expected-size 37616

      - name: Validate persisted asset provenance and integrity
        run: python scripts/validate_asset_manifests.py

      - name: Remove transport-only material
        run: |
          rm -rf tmp/ref001-plugin-asset
          rm .github/workflows/ref001-plugin-rendered-asset-poc.yml
          git diff --check

      - name: Commit durable asset only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Persist REF-001 rendered Education asset'
          git push
