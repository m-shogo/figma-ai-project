schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-FIGMA-SP-AUTHORITY-DISCOVERY
    summary: >-
      When a Figma family map says a responsive authority is unobserved or points at historical lineage,
      inspect the canonical responsive canvas/root and its current child frames before concluding that the
      variant is missing; a live child frame may exist even when a stale historical node no longer resolves.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - A current Figma file has an explicit responsive root or canvas authority.
        - A family mapping still carries an unobserved or historical responsive node state.
      exclusions:
        - Do not infer a responsive frame from naming alone; verify the current node and inspect its actual subtree/content.
        - Do not rewrite unrelated historical mappings solely because one family was re-verified.
        - Reject current-looking candidates whose body is incomplete or whose title, breadcrumb, and semantic family do not agree.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        Budokan has three same-project positive recoveries: POST_DETAIL as SP_post 1451:5197,
        NEWS_ARCHIVE as SP_archive 1399:14225, and FEATURE_PAGE_TRAINING_CENTER as SP_navigation 1468:6595
        under the canonical current SP root 114:5409. A later root-wide audit also rejected two current-looking
        SP_navigation candidates after inspecting their actual content. This strengthens the project-local
        procedure but still comes entirely from REF-002-BUDOKAN, not independent cross-reference evidence.
        Keep PROJECT_ONLY and do not auto-promote.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-SP-POST-LIVE-AUTHORITY-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            Current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected through the canonical SP root 114:5409;
            SP_post 1451:5197 was then retrieved directly and matched the POST_DETAIL family before updating
            only that family mapping.
        - evidence_id: EV-BUDOKAN-SP-NEWS-ARCHIVE-LIVE-AUTHORITY-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            Current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected through the canonical SP root 114:5409.
            The live SP_archive frame 1399:14225 contains the expected News archive page title, six category tabs,
            repeated post cards, pagination, breadcrumb, footer, and mobile purpose menu, so the historical 560:2524
            mapping was replaced only for NEWS_ARCHIVE.
        - evidence_id: EV-BUDOKAN-SP-TRAINING-CENTER-LIVE-AUTHORITY-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            Current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected under the canonical SP root 114:5409.
            Live frame SP_navigation 1468:6595 is explicitly identified by its page title and breadcrumb as
            the training-center page and exposes authored headings, body copy, gallery images, fee sections,
            notices, and navigation buttons, so only FEATURE_PAGE_TRAINING_CENTER authority was refreshed.
        - evidence_id: EV-BUDOKAN-SP-LOCAL-NAV-CANDIDATES-REJECTED-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            A read-only audit enumerated full-height frames under the canonical SP root 114:5409 and inspected
            candidate content rather than trusting frame names. SP_navigation 1455:5489 is the complete
            '現代武道9種目紹介' content page with repeated in-body navigation cards, not a dedicated Local Nav visual.
            SP_navigation 1468:7508 is an incomplete '大会・行事に参加したい' frame whose breadcrumb still reads
            '研修センターについて' and whose authored body is absent. Neither candidate closes the Local Nav SP gate.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-02: KEEP_PROJECT_ONLY; three positive mappings plus a same-project negative-candidate audit still do not satisfy independent-reference evidence requirements."
      - Re-verify other historical family nodes individually rather than bulk-rewriting the map.
