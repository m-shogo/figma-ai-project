name: Update Radar

on:
  schedule:
    # Daily 12:17 JST. Deliberately off the top of the hour to reduce scheduler contention.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch official update sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_update_radar.py --write-history

      - name: Validate generated YAML/JSON-adjacent contracts
        run: |
          python scripts/validate_yaml_unique_keys.py
          python scripts/validate_company_policy.py

      - name: Detect radar changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- research/update-radar; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit radar state
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/update-radar
          git commit -m "radar: refresh official update signals"
          git push

      - name: Update rolling radar issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/update_radar_issue.py
