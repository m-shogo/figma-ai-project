name: WP ACF Runtime Verified Merge

on:
  push:
    branches:
      - agent/wordpress-acf-runtime-capability
    paths:
      - '.github/workflows/wp-acf-runtime-verified-merge.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate capability probe change
        run: |
          set -euo pipefail
          python -m unittest tests.test_probe_wordpress_acf_runtime
          python scripts/check_repository_readiness.py
          python -m unittest discover -s tests -p 'test_*.py'
          git fetch origin so --depth=1
          git diff --check origin/so...HEAD

      - name: Resolve single open PR for head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:agent%2Fwordpress-acf-runtime-capability&base=so&per_page=10"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > /tmp/prs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          prs = json.loads(Path('/tmp/prs.json').read_text())
          if len(prs) != 1:
              raise SystemExit(f'expected exactly one open PR for head, found {len(prs)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"number={prs[0]['number']}\n")
          print(f"resolved PR #{prs[0]['number']}")
          PY

      - name: Remove one-shot workflow from final tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wp-acf-runtime-verified-merge.yml
          git commit -m 'Remove WP ACF verified merge workflow'
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for ordinary checks on final head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${FINAL_HEAD}/check-runs?per_page=100" > /tmp/checks.json
            state=$(python - <<'PY'
          import json
          from pathlib import Path
          runs = json.loads(Path('/tmp/checks.json').read_text()).get('check_runs', [])
          if not runs:
              print('WAIT')
          else:
              bad=[]; pending=[]
              for run in runs:
                  name=run.get('name','<unnamed>'); status=run.get('status'); conclusion=run.get('conclusion')
                  if status != 'completed': pending.append(name)
                  elif conclusion not in {'success','neutral','skipped'}: bad.append(f'{name}:{conclusion}')
              print('FAIL:'+','.join(bad) if bad else ('WAIT:'+','.join(pending) if pending else 'PASS'))
          PY
          )
            case "$state" in
              PASS) exit 0 ;;
              FAIL:*) echo "$state" >&2; exit 1 ;;
              *) echo "checks pending (${attempt}/90): ${state}"; sleep 10 ;;
            esac
          done
          echo 'timed out waiting for final-head checks' >&2
          exit 1

      - name: Squash merge exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/merge.json
          import json, os
          print(json.dumps({
              'sha': os.environ['FINAL_HEAD'],
              'merge_method': 'squash',
              'commit_title': 'Add WordPress ACF runtime capability probe',
              'commit_message': 'Add a read-only real-runtime capability probe while preserving the boundary between runtime readiness and the unexecuted browser ADMIN_UI import smoke.'
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            --data-binary @/tmp/merge.json > /tmp/merge-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/merge-result.json').read_text())
          if result.get('merged') is not True:
              raise SystemExit(f"merge rejected: {result.get('message','unknown')}")
          print(f"merged sha={result.get('sha')}")
          PY

      - name: Delete merged work branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/wordpress-acf-runtime-capability"
