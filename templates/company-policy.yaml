  browserslist: []
  explicit_minimums: []
  test_matrix: []
  mobile_devices: [] # legacy/simple inventory; environment_profiles is canonical for device-specific behavior
  webviews: [] # legacy/simple inventory; environment_profiles is canonical for device-specific behavior
  environment_profiles: []
