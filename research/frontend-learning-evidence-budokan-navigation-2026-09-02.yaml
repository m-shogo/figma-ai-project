schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-NAV-TRAILING-AFFORDANCE
    summary: >-
      When Figma authors an optional trailing affordance as a separate right-edge slot in a shared row,
      rendering the same affordance as an inline pseudo-element can collapse its alignment; preserve the
      existing semantic markup but give the shared row enough flex ownership to keep the trailing slot at
      the authored edge.
    category: VISUAL_FIDELITY
    applicability:
      scope: REFERENCE
      conditions:
        - A repeated component has an optional trailing icon or status aligned independently from its title text.
        - Existing production markup already exposes the state semantically, such as target=_blank.
      exclusions:
        - Do not create a trailing slot when the current Figma actually places the icon inline with text.
        - Do not add new CMS fields or markup solely to imitate Figma layer nesting when existing semantics are sufficient.
    promotion_state: null
    promotion:
      candidate: false
      rationale: >-
        The Budokan Navigation Large master and existing Theme expose one clear instance of the failure mode,
        but there is not yet independent-reference evidence that this should become a portable frontend rule.
      blocked_by:
        - Reproduce the same trailing-affordance alignment failure and repair on an independent reference or implementation family.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-NAV-TRAILING-AFFORDANCE-AUDIT
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/NAVIGATION_LARGE_DEPENDENCY_AUDIT.md
          commit: ''
          note: >-
            Current PC/SP Figma masters place the optional external-link glyph at the far edge while the Theme
            already exposes target=_blank; the audit records the shared-CSS repair without changing PHP or ACF.
      contradicts: []
    notes:
      - Keep as an observation until another reference demonstrates the same ownership pattern and measurable repair benefit.

  - learning_id: OBS-BUDOKAN-NAV-THEME-LOCATION-OWNERSHIP
    summary: >-
      A WordPress navigation template should render from the registered theme-location assignment and fail
      closed when that location is unassigned; a hard-coded menu name can silently bypass the human-editable
      ownership contract and an unconditional outer wrapper can leave empty layout chrome behind.
    category: CMS
    applicability:
      scope: PROJECT
      conditions:
        - WordPress navigation is already registered and managed through a theme location.
        - The template is expected to remain human-editable through Appearance > Menus / Navigation assignment.
      exclusions:
        - Do not remove a deliberately hard-coded menu when canonical project authority explicitly requires one.
        - Do not invent a new menu location solely to satisfy this observation.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        The Budokan Theme exposes the same ownership failure across dropdown-nav, sidebar-nav, and the Header's
        global-nav/sub-nav calls: each location was already registered for Human assignment while its template
        also named a fixed menu. Reusing theme_location restores the existing WordPress ownership contract
        without introducing new data. These additional surfaces strengthen the project finding but remain the
        same REF-002-BUDOKAN reference, so they are not independent promotion evidence.
      blocked_by: []
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-NAV-THEME-LOCATION-FAIL-CLOSED-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_dropdown-navigation.php
          commit: 0af42e815a334a20049dc7bc7d7eca711c83d589
          note: >-
            The template now checks has_nav_menu('dropdown-nav'), removes the hard-coded menu name, and lets
            wp_nav_menu resolve the editor-assigned menu through theme_location. Unassigned navigation renders
            no empty wrapper and no fallback menu.
        - evidence_id: EV-BUDOKAN-SIDEBAR-THEME-LOCATION-FAIL-CLOSED-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/sidebar.php
          commit: 004076078b3dd99c191e4015a1e398e6f87afd96
          note: >-
            The sidebar template now follows the same registered-location contract: it removes the fixed
            sidebar-nav menu name, resolves the Human-assigned menu through theme_location, and emits no local
            navigation wrapper when the location is unassigned.
        - evidence_id: EV-BUDOKAN-HEADER-THEME-LOCATION-OWNER-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_header.php
          commit: 9d7d14ff0a5e05a77ae13c31092fc289a46277e3
          note: >-
            Header global-nav and sub-nav now resolve the Human-assigned menus through their already-registered
            theme locations instead of also naming fixed menus. Existing global-nav fallback behavior and all
            Header markup, walker classes, menu IDs/classes, and styling remain unchanged.
      contradicts: []
    notes:
      - Keep PROJECT_ONLY until a distinct WordPress implementation demonstrates the same failure and benefit.
      - Dropdown, sidebar, and Header observations are multiple surfaces in the same Budokan reference and must not be counted as independent references.
