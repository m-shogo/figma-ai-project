schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-CMS-NATIVE-MARKUP-SELECTOR-CONTRACT
    summary: Shared CSS for CMS/core blocks must be validated against the actual serialized or rendered markup; selectors that assume descendants the CMS never emits, or accidentally exclude authorized modifier classes of the same semantic primitive, can leave part of the visual contract dead even when the stylesheet syntax is valid.
    category: MAINTAINABILITY
    applicability:
      scope: PROJECT
      conditions:
        - A CMS or framework owns the output markup of a shared content primitive.
        - Shared CSS depends on descendant hooks, wrapper classes, or class-presence filters such as `:not([class])`.
      exclusions:
        - A verified render transform, block renderer, plugin, or component layer explicitly materializes the required hooks before output.
        - Project-specific markup intentionally owns the full component DOM rather than a CMS/core primitive.
        - A modifier intentionally defines a different semantic or visual primitive and therefore should not inherit the base contract.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: Budokan now provides two concrete selector-to-rendered-markup failures repaired at shared owners (Core Details descendants and background Paragraph modifier coverage), but both are still one project/reference and do not yet prove cross-project rework reduction.
      blocked_by:
        - Independent CMS/framework implementation reproducing a selector-to-rendered-markup mismatch.
        - Measured evidence that preflight markup-contract validation reduces dead CSS or repair rounds in another reference/project.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-CORE-DETAILS-AUDIT-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/CORE_DETAILS_NATIVE_MARKUP_AUDIT.md
          commit: ''
          note: Current Figma, immutable parts.php markup, and Theme CSS were reconciled; synthetic Details descendants were not emitted by the authorized Core markup.
        - evidence_id: EV-BUDOKAN-CORE-DETAILS-CSS-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-details-style.css
          commit: 9ef8de4b456602f31adb311b277ed7cead65cf51
          note: Shared CSS was changed to style native details > summary and direct editor-owned content without adding markup or page-specific overrides.
        - evidence_id: EV-BUDOKAN-BACKGROUND-PARAGRAPH-AUDIT-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/BACKGROUND_PARAGRAPH_SELECTOR_AUDIT.md
          commit: ''
          note: Current Figma background text-box evidence was reconciled with Gutenberg paragraph output; `p.has-background` had surface styling but was excluded from the shared body typography selector by class-presence filtering.
        - evidence_id: EV-BUDOKAN-BACKGROUND-PARAGRAPH-CSS-20260902
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-text-style.css
          commit: dc78d461c5f497bb405fe3e4dde33dfaed3bd4ef
          note: Shared Paragraph typography now includes the authorized `.has-background` modifier instead of duplicating typography in a page-specific or surface-only rule.
      contradicts: []
    notes:
      - Keep PROJECT_ONLY until independent evidence proves portability; two failures inside the same Budokan reference do not satisfy cross-reference promotion.
