prototype_delivery:
  acf_export_path: "experiments/ref001-wordpress-acf/artifacts/acf-export.json"
  template_location_placeholder: "page-templates/template-ref001.php"
  warning: "The prototype JSON is intentionally not a frozen production field group. Wave-2 modeling adds evidence but does not automatically expand the JSON until each section's CMS contract is sufficiently complete."

learning_notes:
  - "CMS flexibility is a product/editorial requirement, not something that can be inferred from visual repetition alone."
  - "Responsive variants can share one media field even when crop geometry differs substantially."
  - "Art-directed text is not automatically a CMS field just because it is text in Figma."
  - "Global/shared Figma components should trigger target-code reconnaissance before page-level ACF field creation."
  - "An ordered pedagogical progression should not become editor-reorderable just because its stages look like repeated cards."
  - "A visible open/collapsed design state does not prove accordion behavior when no prototype/annotation/codebase interaction evidence exists."
  - "An indicator showing 1/4 proves a presented total, not that the current Figma node contains four complete CMS records."
  - "Missing source content must remain UNKNOWN/BLOCKED rather than being filled with invented placeholder records."
