  runtime_detection:
    default: CAPABILITY_FIRST # CAPABILITY_FIRST | FEATURE_FIRST | COMPANY_EXPLICIT
    feature_detection_required: true
    css_supports_preferred: true
    ua_sniffing: BUG_FIX_ONLY # FORBID | BUG_FIX_ONLY | COMPANY_ALLOWED
    width_only_device_classification_forbidden: true
    notes: []
  javascript_required: true
  progressive_enhancement: REQUIRED # REQUIRED | PREFERRED | OPTIONAL
  unsupported_behavior: DOCUMENT # DOCUMENT | BLOCK | BEST_EFFORT
  notes: []

stack:
  frameworks_allowed: []
  cms_allowed: []
  package_manager: ""
  build_tool: ""
  language_policy: []
  notes: []

project_structure:
  source_root: ""
  section_unit: ADAPT_TO_STACK # ADAPT_TO_STACK | COMPONENT | TEMPLATE_PART | ACF_BLOCK | INCLUDE | OTHER
  folder_rules: []
  naming_rules: []
  shared_paths: []
  section_paths: []
  generated_paths: []
  forbidden_patterns: []
  notes: []

css:
  strategy: EXISTING_PROJECT_FIRST
  reset_policy: EXISTING_FIRST # EXISTING_FIRST | COMPANY_RESET | FRAMEWORK_NATIVE | TAILWIND_PREFLIGHT | MODERN_NORMALIZE | NORMALIZE | CUSTOM_MINIMAL | NONE
  reset_path: ""
  foundation_layers:
    reset_required: true
    base_required: true
    environment_required: true
    tokens_required: true
    device_specific_full_reset: false
    environment_overrides_allowed: true
    focus_styles_may_be_removed: false
    form_controls_font_inherit: true
    text_size_adjust_policy: EXISTING_OR_ENVIRONMENT_PROFILE
    appearance_policy: EXISTING_OR_COMPONENT
    scrollbar_layout_shift_policy: TEST_TARGET_MATRIX
    notes: []
  box_sizing_border_box: true
  scss_allowed: false
  custom_properties_for_shared_tokens: true
  nesting_policy: ""
  specificity_policy: ""
  utility_policy: ""
  notes: []

responsive:
  # Resolve from REQUIRED environment profiles / explicit Project contract.
  # 360 CSS px may be used as a CANDIDATE exploratory fallback when no support floor exists yet,
  # but it is not a universal hard product minimum.
  minimum_product_viewport_css_px: null
  below_minimum_requires_explicit_project_contract: true
  breakpoint_source: COMPANY_OR_EXISTING
  breakpoints: []
  container_policy: ""
  viewport_meta:
    width_device_width: true
    initial_scale: 1.0
    viewport_fit: AUTO # AUTO | CONTAIN | COVER
    interactive_widget: DEFAULT # DEFAULT | RESIZES_VISUAL | RESIZES_CONTENT | OVERLAYS_CONTENT
    notes: []
  viewport_units:
    policy: DYNAMIC_WHEN_NEEDED # EXISTING | LEGACY_VH | DYNAMIC_WHEN_NEEDED | COMPANY_EXPLICIT
    allow_svh_lvh_dvh: true
    fallback_required_by_target_matrix: true
    notes: []
  safe_area:
    policy: APPLY_WHEN_NEEDED # APPLY_WHEN_NEEDED | ALWAYS_FOR_COVER | EXISTING_ONLY | NONE
    fallback_required: true
    notes: []
  virtual_keyboard:
    policy: TEST_INTERACTIVE_UI # TEST_INTERACTIVE_UI | VISUAL_VIEWPORT_WHEN_NEEDED | EXISTING_ONLY | IGNORE
    notes: []
  input_capability_queries:
    hover_pointer_required: true
    any_hover_pointer_when_secondary_input_matters: true
    width_only_hover_inference_forbidden: true
    notes: []
  user_preference_queries:
    reduced_motion_required: true
    contrast_when_relevant: true
    forced_colors_when_relevant: true
    color_scheme_when_relevant: true
    notes: []
  output_capability_queries:
    color_gamut_when_relevant: true
    dynamic_range_when_relevant: false
    notes: []
  viewport_units_policy: "" # legacy free-text field; prefer viewport_units above
  container_queries: ALLOW_WHEN_SUPPORTED # ALLOW_WHEN_SUPPORTED | FORBID | EXISTING_ONLY
  notes: []

interaction:
  smooth_scroll:
    required_for_anchor_navigation: true
    implementation: NATIVE_CSS_FIRST # NATIVE_CSS_FIRST | EXISTING_LIBRARY | CUSTOM
    respect_reduced_motion: true
    fixed_header_offset_required: true
    per_environment_override_allowed: true
    polyfill_only_if_policy_requires: true
    notes: []
  hover:
    required_when_specified: true
    hover_capability_gate: true
    keyboard_focus_equivalent: true
    touch_fallback_required: true
    primary_vs_any_input_distinguished: true
    notes: []
  touch:
    browser_gestures_preserved_by_default: true
    touch_action_none_requires_evidence: true
    pinch_zoom_must_not_be_disabled_without_requirement: true
    notes: []
  scroll_lock:
    body_lock_strategy: EXISTING_OR_ENVIRONMENT_PROFILE
    overscroll_behavior_requires_target_check: true
    visual_viewport_check_for_keyboard_overlays: true
    notes: []
  hamburger_navigation:
    pattern: DISCLOSURE_NAVIGATION # DISCLOSURE_NAVIGATION | MODAL_DRAWER | EXISTING
    escape_closes: true
    restore_focus: true
    body_scroll_lock_when_overlay: true
    use_aria_menu_role: false
    notes: []
  carousel:
    simple_preference: CSS_SCROLL_SNAP
    complex_preference: APPROVED_LIBRARY
    approved_libraries: []
    autoplay_default: false
    pause_control_if_autoplay: true
    pause_on_focus_if_autoplay: true
    pause_on_hover_if_autoplay: true
    reduced_motion_disables_autoplay: true
    keyboard_operable: true
    touch_gesture_qa_required: true
    notes: []
  animation:
    simple_preference: CSS
    react_preference: EXISTING_OR_MOTION
    complex_scroll_preference: EXISTING_OR_GSAP
    approved_libraries: []
    reduced_motion_required: true
    scroll_jacking_allowed: false
    performance_budget_notes: []
    notes: []

accessibility:
  standard: WCAG_2_2
  conformance: AA # A | AA | AAA | COMPANY_CUSTOM
  semantic_html_required: true
  keyboard_all_interactive: true
  focus_visible_required: true
  focus_not_obscured_required: true
  skip_link_required_when_relevant: true
  target_size_min_css_px: 24
  target_size_exception_policy: WCAG_2_2
  resize_text_percent: 200
  reflow_400_percent_required: true
  reflow_width_equivalent_css_px: 320 # WCAG-equivalent probe; separate from product support floor
  horizontal_scroll_exception_policy: WCAG_2_2
  zoom_must_not_be_disabled: true
  hover_focus_content_policy: DISMISSIBLE_HOVERABLE_PERSISTENT
  screen_reader_smoke_required_for_complex_widgets: true
  accessible_name_required: true
  form_label_error_policy: REQUIRED
  contrast_policy: WCAG_CONFORMANCE
  live_region_policy: EXISTING_OR_SEMANTIC_FIRST
  notes: []

figma_handoff:
  read_annotations: true
  read_prototype_interactions: true
  read_comments_when_accessible: true
  comments_are_authoritative: false
  annotation_priority: IMPLEMENTATION_EVIDENCE
  comment_priority: SUPPLEMENTARY_EVIDENCE
  cross_section_comment_policy: GLOBAL_OR_BOUNDARY_EVIDENCE
  dev_resources: true
  unresolved_instruction_policy: RECORD_CONFLICT
  notes: []

cms:
  wordpress:
    enabled: false
    theme_type: UNKNOWN # CLASSIC | BLOCK | HYBRID | UNKNOWN
    acf_enabled: false
    acf_architecture: EXISTING_PROJECT # EXISTING_PROJECT | ACF_BLOCKS | TEMPLATE_FIELDS | FLEXIBLE_CONTENT | HYBRID
    acf_block_api_version: ""
    image_field_return_format: ID # ID | ARRAY | URL | EXISTING_PROJECT
    escape_output: true
    template_part_policy: ""
    flexible_content_policy: ""
    repeater_policy: ""
    block_bindings_policy: ""
    notes: []

images:
  exact_source_preferred: true
  responsive_images_required: true
  intrinsic_dimensions_required: true
  alt_required: true
  lazy_loading_policy: BELOW_FOLD
  priority_image_policy: EXPLICIT
  picture_for_art_direction: true
  object_fit_allowed: true
  focal_point_policy: PRESERVE_REFERENCE
  svg_policy: ""
  formats_allowed: []
  wordpress_attachment_id_preferred: true
  per_environment_profile_allowed: true
  color_gamut_sensitive_assets: RECORD_WHEN_RELEVANT
  notes: []

gradients:
  structured_figma_paint_required_when_available: true
  capture_type: true
  capture_handles_or_transform: true
  capture_stops: true
  capture_stop_alpha: true
  capture_layer_opacity: true
  capture_blend_mode: true
  variable_binding_when_available: true
  screenshot_only_inference: LAST_RESORT
  browser_color_space_policy: COMPANY_BROWSER_SUPPORT
  output_gamut_qa_when_relevant: true
  notes: []

visual_tolerance:
  canonical_browser: ""
  canonical_os: ""
  canonical_dpr: null
  canonical_environment_profile: ""
  environment_specific_baselines_allowed: true
  geometry_css_px: 1.0
  isolated_geometry_css_px_max: 2.0
  repeated_drift_is_failure: true
  text_wrap_must_match: true
  typography_block_geometry_must_match: true
  antialiasing_pixel_diff_ignored: true
  gradient_shadow_raster_policy: PERCEPTUAL_DIFF
  owner_override_allowed: true
  notes: []

integration:
  section_capture_required: true
  boundary_capture_required: true
  full_page_capture_required: true
  adjacent_boundary_default: true
  high_coupling_cluster_capture: true
  cumulative_capture_optional: true
  per_environment_capture_required_for_required_profiles: true
  required_checks:
    - section_order
    - boundary_spacing
    - container_alignment
    - background_continuity
    - typography_continuity
    - z_index_continuity
    - responsive_continuity
    - global_overflow
    - input_capability_behavior
    - safe_area_and_dynamic_viewport
    - accessibility_focus_and_target_size
  notes: []

update_policy:
  significant_run_preflight: true
  periodic_review_cadence: QUARTERLY # MONTHLY | QUARTERLY | RELEASE_TRIGGERED | MANUAL
  release_triggered_retest: true
  environment_matrix_retest_on_browser_major: true
  environment_matrix_retest_on_os_major: true
  sources:
    - Figma release notes
    - Figma developer/MCP docs
    - MDN / web platform compatibility
    - W3C/WAI accessibility guidance
    - WordPress/ACF official docs when applicable
    - approved library official changelogs/docs
  community_sources_allowed: true
  community_signal_requires_validation: true
  notes: []

unknowns: []
conflicts: []
approvals: []
