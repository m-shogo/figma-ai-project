; Local fixture only: keep plugin/media/ACF JSON uploads off the PHP ceilings.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
max_file_uploads = 50

; Theme PHP edits must show on the next request during local visual work.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
