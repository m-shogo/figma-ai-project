name: REF001 Public Pages Contract

on:
  push:
    branches:
      - so
    paths:
      - 'research/figma-assets/ref001/2026-08-18-pages-republish.md'
  workflow_run:
    workflows:
      - Publish Human Review Dashboard
    types:
      - completed

permissions:
  contents: write

jobs:
  verify-public-pages:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'so')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout so
        uses: actions/checkout@v6
        with:
          ref: so
          fetch-depth: 0

      - name: Verify deployed REF-001 CSS contract
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://m-shogo.github.io/figma-ai-project/ref-001/latest'
          BASE="$ROOT/preview"
          MANIFEST='/tmp/ref001-public-manifest.json'
          HTML='/tmp/ref001-public-preview.html'
          CSS='/tmp/ref001-public-ref001.css'

          deployed=''
          for attempt in $(seq 1 120); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$ROOT/review/manifest.json?qa=${SOURCE_SHA}-${attempt}" -o "$MANIFEST"; then
              deployed=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('/tmp/ref001-public-manifest.json').read_text(encoding='utf-8'))
              print(payload.get('generated', {}).get('source_commit', ''))
          except Exception:
              print('')
          PY
              )
              if [ "$deployed" = "$SOURCE_SHA" ]; then
                echo "PASS public deployment source commit: $deployed"
                break
              fi
            fi
            sleep 5
          done
          if [ "$deployed" != "$SOURCE_SHA" ]; then
            echo "FAIL public Pages did not reach source commit $SOURCE_SHA (observed: ${deployed:-none})" >&2
            exit 1
          fi

          fetch_with_retry() {
            local url="$1"
            local out="$2"
            for attempt in $(seq 1 30); do
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?qa=${SOURCE_SHA}-${attempt}" -o "$out"; then
                return 0
              fi
              sleep 5
            done
            echo "FAIL public fetch: $url" >&2
            return 1
          }

          fetch_with_retry "$BASE/" "$HTML"
          grep -Fq 'assets/css/ref001.css' "$HTML" || { echo 'FAIL canonical stylesheet is not loaded by public preview' >&2; exit 1; }
          if grep -Fq 'v2-intermediate-desktop.css' "$HTML"; then
            echo 'FAIL public preview still loads retired intermediate stylesheet' >&2
            exit 1
          fi

          fetch_with_retry "$BASE/assets/css/ref001.css" "$CSS"
          if grep -Eq '1299px|1300px' "$CSS"; then
            echo 'FAIL retired 1299/1300 boundary remains in public CSS' >&2
            grep -En '1299px|1300px' "$CSS" >&2 || true
            exit 1
          fi

          python - <<'PY'
          import re
          from pathlib import Path
          css = Path('/tmp/ref001-public-ref001.css').read_text(encoding='utf-8')
          queries = re.findall(r'@media\s*\([^)]*?(max|min)-width\s*:\s*(\d+)px[^)]*\)', css)
          allowed = {('max', '767'), ('min', '768')}
          unexpected = sorted(set(queries) - allowed)
          if unexpected:
              raise SystemExit(f'FAIL unexpected public media-query boundaries: {unexpected}')
          required = (
              '.ref-course__rec-label',
              '.ref-mv__oc-kicker',
              '.ref-messages__nav::before',
          )
          missing = [selector for selector in required if selector not in css]
          if missing:
              raise SystemExit(f'FAIL approved public selectors missing: {missing}')
          print('PASS public media-query boundaries:', sorted(set(queries)))
          print('PASS approved selectors present:', ', '.join(required))
          PY

          if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/v2-intermediate-desktop.css?qa=${SOURCE_SHA}" -o /tmp/ref001-retired.css; then
            echo 'FAIL retired intermediate stylesheet is still publicly served' >&2
            exit 1
          fi

          CSS_SHA256=$(sha256sum "$CSS" | awk '{print $1}')
          MEDIA_QUERIES=$(grep -oE '@media[^\{]+' "$CSS" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' || true)
          mkdir -p qa
          cat > qa/ref001-public-pages-contract.md <<EOF
          # REF-001 Public Pages Contract

          - result: PASS
          - checked deployed source commit: \`${SOURCE_SHA}\`
          - verification trigger run: \`${VERIFY_RUN_ID}\`
          - public manifest source commit: \`${deployed}\`
          - public preview: \`${BASE}/\`
          - public stylesheet: \`${BASE}/assets/css/ref001.css\`
          - public CSS sha256: \`${CSS_SHA256}\`
          - retired \`1299px\` boundary: absent
          - retired \`1300px\` boundary: absent
          - retired \`v2-intermediate-desktop.css\`: not loaded and not served
          - allowed responsive contract: \`max-width: 767px\` / \`min-width: 768px\`
          - approved selectors: present
          - observed media queries: \`${MEDIA_QUERIES}\`
          EOF

      - name: Commit public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin so
          git add qa/ref001-public-pages-contract.md
          if git diff --cached --quiet; then
            echo 'Public verification evidence already current.'
            exit 0
          fi
          git commit -m 'qa(ref001): record public Pages CSS verification'
          git push origin HEAD:so
