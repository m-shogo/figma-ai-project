integration:
  status: PLANNED # PLANNED | RUNNING | COMPLETE
  root_composition_path: ""
  product_min_viewport_css_px: null # resolved from Effective Environment Contract
  accessibility_reflow_probe_css_px: 320 # WCAG-equivalent probe; separate from product support floor
  required_checks:
    - section_order
    - container_alignment
    - cross_section_spacing
    - typography_consistency
    - shared_component_consistency
    - breakpoint_consistency
    - responsive_continuity
    - global_overflow
    - z_index_continuity
    - background_continuity
    - asset_quality
    - runtime_state_integrity
    - font_loading_stability
    - relevant_third_party_fallback
  observation_coverage:
    sp_full_page: PENDING # PENDING | PASS | KNOWN_GAP | NOT_APPLICABLE
