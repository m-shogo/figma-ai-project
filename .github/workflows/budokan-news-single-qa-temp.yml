name: Budokan News Single QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-news-single-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-single:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Start real WordPress + ACF PRO + Budokan Theme
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed authored single-post fixture
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          wpcli() { docker compose run --rm cli "$@"; }
          NEWS_PAGE="$(wpcli post create --post_type=page --post_status=publish --post_title='お知らせ' --post_name=news --porcelain)"
          wpcli option update page_for_posts "$NEWS_PAGE" >/dev/null
          TERM_ID="$(wpcli term create _cat '書道' --slug=calligraphy --porcelain)"
          POST_ID="$(wpcli post create --post_type=post --post_status=publish --post_title='第42回 高円宮杯日本武道館書写書道大展覧会令和8年8月23日（日）開催' --post_date='2025-08-08 12:00:00' --post_content='<p>日本武道館は、昭和39年の開館以来、書写・書道の普及奨励を図っています。</p><h3>作品募集（毛筆の部・硬筆の部）</h3><ul><li>出品締切日　令和8年6月9日（火）</li><li>送付先　日本武道館 書道展事務局</li></ul><h3>授賞式及び展覧会</h3><table><tbody><tr><th>日時</th><td>令和8年8月23日（日）</td></tr><tr><th>会場</th><td>日本武道館 中道場</td></tr><tr><th>お問い合わせ先</th><td>日本武道館 書道展事務局</td></tr></tbody></table>' --porcelain)"
          wpcli post term set "$POST_ID" _cat "$TERM_ID" --by=id >/dev/null
          ATTACH_ID="$(wpcli media import /fixture/theme-dropin/nipponbudokan/images/top/mv-sample.png --title='記事メイン画像' --caption='高円宮妃殿下から受賞者に高円宮杯が授与された' --porcelain)"
          wpcli post meta update "$POST_ID" _thumbnail_id "$ATTACH_ID" >/dev/null
          wpcli post meta update "$POST_ID" post_type article >/dev/null || true
          echo "POST_URL=$(wpcli post url "$POST_ID")" >> "$GITHUB_ENV"

      - name: Install browser QA dependency
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Verify SP and PC against Figma geometry
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/budokan-news-single
          POST_URL="$POST_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name:'sp', width:375, height:900, titleSize:22, titlePad:32, contentWidth:311, featuredMax:335 },
              { name:'pc', width:1380, height:900, titleSize:32, titlePad:48, contentWidth:960, featuredMax:800 },
            ];
            const results=[]; let failed=false;
            for (const c of cases) {
              const page=await browser.newPage({viewport:{width:c.width,height:c.height}});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto(process.env.POST_URL,{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const m=await page.evaluate(()=>{
                const box=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                const css=s=>{const e=document.querySelector(s);if(!e)return null;const v=getComputedStyle(e);return {fontSize:parseFloat(v.fontSize),paddingTop:parseFloat(v.paddingTop),paddingBottom:parseFloat(v.paddingBottom),fontFamily:v.fontFamily,fontWeight:v.fontWeight}};
                return {title:box('.module_titleSingle'),head:box('.module_titleSingle .head'),body:box('.module_titleSingle .body'),h1:box('.module_titleSingle h1'),featured:box('.single_featured'),featuredImg:box('.single_featured img'),titleCss:css('.module_titleSingle'),h1Css:css('.module_titleSingle h1'),scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};
              });
              const status=response?.status()||0;
              if(status>=400||errors.length||m.scrollWidth>m.clientWidth+1) failed=true;
              if(!m.title||Math.abs(m.title.width-c.width)>1) failed=true;
              if(!m.head||Math.abs(m.head.width-c.contentWidth)>2) failed=true;
              if(!m.body||Math.abs(m.body.width-c.contentWidth)>2) failed=true;
              if(!m.h1Css||Math.abs(m.h1Css.fontSize-c.titleSize)>0.5) failed=true;
              if(!m.titleCss||Math.abs(m.titleCss.paddingTop-c.titlePad)>0.5||Math.abs(m.titleCss.paddingBottom-c.titlePad)>0.5) failed=true;
              if(!m.featured||m.featured.width>c.featuredMax+2) failed=true;
              await page.screenshot({path:`.runtime/budokan-news-single/${c.name}-full.png`,fullPage:true});
              await page.locator('.module_titleSingle').screenshot({path:`.runtime/budokan-news-single/${c.name}-title.png`});
              results.push({case:c,status,errors,metrics:m});
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('.runtime/budokan-news-single/runtime.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(failed) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-news-single-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-news-single
          if-no-files-found: warn

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
