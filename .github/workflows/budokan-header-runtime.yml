name: Budokan Header Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_header.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_head_contents.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/layout/global_header.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/layout/global_navigation.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/global/variables.css'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-header-runtime-qa.sh'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-header-browser-qa.mjs'
      - 'experiments/budokan-wordpress/learning-notes/2026-08-31-header-current-figma-resync.md'
      - '.github/workflows/budokan-header-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress Header runtime QA
        env:
          BUDOKAN_HEADER_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-header-runtime-qa.sh

      - name: Run SP and PC Header browser geometry QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node experiments/wordpress-acf-runtime/scripts/budokan-header-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
