name: Budokan Quote Runtime QA

on:
  pull_request:
    branches: [so]
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-quote-style.css'
      - '.github/workflows/budokan-quote-runtime.yml'

jobs:
  quote-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress + ACF PRO runtime
        working-directory: experiments/wordpress-acf-runtime
        run: |
          test -n "$ACF_PRO_LICENSE_KEY"
          cp .env.example .env
          printf '\nACF_PRO_LICENSE_KEY=%s\n' "$ACF_PRO_LICENSE_KEY" >> .env
          bash ./scripts/setup.sh
      - name: Seed native Gutenberg quote fixture
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source ./scripts/runtime-env.sh
          CONTENT='<!-- wp:quote --><blockquote class="wp-block-quote"><!-- wp:paragraph --><p>日本武道館では、武道大会や研修会など、多様な参加型イベントを開催しています。</p><!-- /wp:paragraph --></blockquote><!-- /wp:quote -->'
          docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='Quote QA' --post_name='quote-qa' --post_content="$CONTENT" --porcelain
          curl --fail --silent --show-error "$WP_URL/quote-qa/" | grep -q 'wp-block-quote'
      - name: Install browser probe
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify SP and PC computed quote geometry
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source ./scripts/runtime-env.sh
          export QA_URL="$WP_URL/quote-qa/"
          node --input-type=module <<'NODE'
          import { chromium } from '../../../node_modules/playwright/index.mjs';
          const browser = await chromium.launch({headless:true});
          const cases = [
            {name:'SP', width:390, padding:34, quote:24},
            {name:'PC', width:1395, padding:46, quote:36},
          ];
          for (const c of cases) {
            const page = await browser.newPage({viewport:{width:c.width,height:900}});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            const res = await page.goto(process.env.QA_URL, {waitUntil:'networkidle'});
            if (!res || res.status() !== 200) throw new Error(`${c.name}: HTTP ${res?.status()}`);
            const data = await page.locator('.wp-block-quote').first().evaluate(el => {
              const s=getComputedStyle(el), b=getComputedStyle(el,'::before'), a=getComputedStyle(el,'::after');
              return {
                paddingLeft:parseFloat(s.paddingLeft), paddingRight:parseFloat(s.paddingRight),
                beforeW:parseFloat(b.width), beforeH:parseFloat(b.height), afterW:parseFloat(a.width), afterH:parseFloat(a.height),
                beforeOpacity:parseFloat(b.opacity), afterOpacity:parseFloat(a.opacity),
                bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            const eq=(actual,expected,label)=>{if(Math.abs(actual-expected)>0.1) throw new Error(`${c.name} ${label}: ${actual} != ${expected}`)};
            eq(data.paddingLeft,c.padding,'paddingLeft'); eq(data.paddingRight,c.padding,'paddingRight');
            eq(data.beforeW,c.quote,'beforeW'); eq(data.beforeH,c.quote,'beforeH'); eq(data.afterW,c.quote,'afterW'); eq(data.afterH,c.quote,'afterH');
            eq(data.beforeOpacity,0.2,'beforeOpacity'); eq(data.afterOpacity,0.2,'afterOpacity');
            if (data.bodyOverflow > 1) throw new Error(`${c.name}: page overflow ${data.bodyOverflow}`);
            if (errors.length) throw new Error(`${c.name}: page errors ${errors.join('; ')}`);
            console.log('PASS', c.name, data);
            await page.close();
          }
          await browser.close();
          NODE
      - name: Tear down runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: bash ./scripts/reset.sh || true
