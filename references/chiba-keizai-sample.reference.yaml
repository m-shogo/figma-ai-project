structure:
  page_node_id: "21376:1600"
  page_name: AI
  responsive_frame_placement: SAME_PAGE_SEPARATE_TOP_LEVEL_FRAMES
  responsive_mode_finding: "The AI page itself resolves template=SP, while the visible desktop and mobile roots explicitly pin template=PC and template=SP respectively. Root pins isolate each responsive subtree."
  discovery_method:
    - direct-child order
    - semantic names
    - text anchors
    - assets
    - page order
    - child structure
    - screenshot evidence
    - current root visibility
    - responsive variable mode resolution
  discovery_finding: "Layer names alone are insufficient: the SP student-voice group is named Group 338, while the SP messages group is named voice. Text anchors, state labels, page order, and content identity resolve the pairings."
  section_pairs:
    - id: header
      pc_node_id: "21378:8066"
      sp_node_id: "21376:4918"
      mapping_confidence: HIGH
      provisional_strategy: HYBRID
      evidence:
        - "PC/SP Header roots are Component Instances and resolve the expected responsive Variable Modes."
        - "Live structure profiling found no Auto Layout inside either Header instance and a high ratio of generic internal layer names, so component identity is trusted but raw child geometry is not treated as semantic code structure."
        - "Detailed evidence is in references/chiba-keizai-sample.structure-profile.yaml."
    - id: main-visual
      pc_node_id: "21378:8032"
      sp_node_id: "21376:4886"
      mapping_confidence: HIGH
      provisional_strategy: HYBRID
      evidence:
        - "PC/SP main visuals share semantic content but rely on masks, image crops, vectors, and manual grouping."
        - "The SP MV Group remains 1380px wide inside the 375px reference while responsive children resolve SP values, so raw Figma group dimensions must not be copied blindly into production CSS."
        - "PC/SP foreground image sources were hash-compared and can share WordPress attachment fields when content ownership matches."
    - id: reason
      pc_node_id: "21378:7999"
      sp_node_id: "21376:4852"
      mapping_confidence: HIGH
      provisional_strategy: STRUCTURE_FIRST
      evidence:
        - "The same three semantic cards are horizontal on PC and vertically stacked on SP."
        - "Live profiling found 5/5 Auto Layout-capable containers active in both variants; the reasons container explicitly changes HORIZONTAL on PC to VERTICAL on SP."
        - "Detailed evidence is in references/chiba-keizai-sample.structure-profile.yaml."
    - id: education
      pc_node_id: "21378:7868"
      sp_node_id: "21376:4720"
      mapping_confidence: HIGH
      provisional_strategy: HYBRID
      evidence:
        - "PC/SP contain the same fixed semantic progression 01/スタート → 02/学ぶ → 03/出会う → 04/ゴール."
        - "Both variants contain 22 Auto Layout containers inside stage lists/labels, while the outer stage-and-arrow composition remains manually grouped."
        - "Some stages retain alternate/underlay image layers, so canonical CMS media must be selected rather than exposing every Figma image layer."
    - id: cta-after-education
      pc_node_id: "21378:7867"
      sp_node_id: "21376:4719"
      mapping_confidence: HIGH
      provisional_strategy: COMPONENT_FIRST
      evidence:
        - "Both are CTA instances at the same section boundary."
        - "PC CTA instance resolves template=PC after the root-mode correction; its variable-bound img/mask returned from 375 to 1380 without manual width override."
    - id: student-voice
      pc_node_id: "21378:7766"
      sp_node_id: "21376:4650"
      mapping_confidence: HIGH
      provisional_strategy: HYBRID
      evidence:
        - "Both PC/SP contain three student summary groups; item 1 is supplied as an expanded visual state and items 2/3 are collapsed."
        - "Only item 1 contains expanded detail content in the supplied Figma state."
        - "No prototype reactions were found in the inspected section, so visual open/collapsed states do not yet prove an accordion interaction contract."
        - "SP layer name is Group 338, demonstrating that text/state/content identity must override a generic root name."
    - id: messages
      pc_node_id: "21378:7746"
      sp_node_id: "21376:4629"
      mapping_confidence: HIGH
      provisional_strategy: HYBRID
      evidence:
        - "PC/SP show the same current message, profile, 1/4 indicator, arrow affordances, and shared underlying image hash."
        - "The inspected node contains content for only one of the four indicated records and no prototype reactions."
        - "Carousel/slider behavior and the other three message records remain unresolved and must not be invented."
        - "SP layer is named voice despite matching the PC messages section, so text anchors override the misleading name."
    - id: cta-before-courses
      pc_node_id: "21378:7730"
      sp_node_id: "21376:4628"
      mapping_confidence: HIGH
      provisional_strategy: COMPONENT_FIRST
      evidence:
        - "Both occupy the corresponding CTA boundary before Courses."
        - "Current PC node is a Group rather than an Instance, so implementation must inspect the canonical component relationship instead of assuming both PC CTAs have identical Figma structure."
    - id: courses
      pc_node_id: "21378:7505"
      sp_node_id: "21376:4403"
      mapping_confidence: HIGH
      provisional_strategy: INSPECT_BEFORE_IMPLEMENT
      evidence:
        - "Both contain seven course groups and matching course/recommendation text anchors."
        - "SP layer name is Group 339 while PC is misspelled cources; content identity resolves the mapping."
    - id: links
      pc_node_id: "21378:7458"
      sp_node_id: "21376:4919"
      mapping_confidence: HIGH
      provisional_strategy: STRUCTURE_FIRST
      evidence:
        - "Same semantic layer name and same position near the end of the page."
    - id: cta-value
      pc_node_id: "21378:7481"
      sp_node_id: "21376:4942"
      mapping_confidence: HIGH
      provisional_strategy: INSPECT_BEFORE_IMPLEMENT
      evidence:
        - "Same semantic layer name between links and Footer."
    - id: footer
      pc_node_id: "21378:7457"
      sp_node_id: "21376:4402"
      mapping_confidence: HIGH
      provisional_strategy: COMPONENT_FIRST
      evidence:
        - "Both are Footer instances and corresponding PC/SP definitions exist on the components page."
