name: Budokan Shared Table QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - 'experiments/budokan-wordpress/**'
      - '.github/workflows/budokan-shared-table-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-table:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright && cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh
      - name: Seed native Gutenberg table fixture
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          cat > .runtime/table-fixture.html <<'HTML'
          <!-- wp:table {"className":"is-scroll-on-mobile"} -->
          <figure class="wp-block-table is-scroll-on-mobile"><table><thead><tr><th>ヘッダーセル</th><th>ヘッダーセル</th><th>ヘッダーセル</th><th>ヘッダーセル</th></tr></thead><tbody><tr><td>通常セル</td><td colspan="2">通常セル</td><td>通常セル</td></tr><tr><td>通常セル</td><td colspan="2">通常セル</td><td>通常セル</td></tr></tbody></table></figure>
          <!-- /wp:table -->
          HTML
          docker compose run --rm cli post update 2 --post_title='Table Runtime QA' --post_status=publish --post_content="$(cat .runtime/table-fixture.html)"
      - name: Capture and assert shared table SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-shared-table
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const { chromium } = createRequire(path.resolve('.runtime/playwright/package.json'))('playwright');
          const near=(a,b,t=1)=>Math.abs(a-b)<=t;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{name:'sp',width:390,height:900},{name:'pc',width:1395,height:900}];
            const results=[]; let failed=false;
            for(const item of cases){
              const page=await browser.newPage({viewport:{width:item.width,height:item.height}});
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
              const response=await page.goto(`${process.env.WP_URL}/?page_id=2`,{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const locator=page.locator('.wp-block-table.is-scroll-on-mobile').first();
              await locator.scrollIntoViewIfNeeded(); await page.waitForTimeout(100);
              const m=await page.evaluate(()=>{
                const wrap=document.querySelector('.wp-block-table.is-scroll-on-mobile');
                const table=wrap?.querySelector('table');
                const firstTh=table?.querySelector('th'); const firstTd=table?.querySelector('td');
                const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}};
                const cs=e=>{const s=getComputedStyle(e);return{fontSize:s.fontSize,lineHeight:s.lineHeight,paddingTop:s.paddingTop,paddingLeft:s.paddingLeft,backgroundColor:s.backgroundColor,color:s.color,fontWeight:s.fontWeight,boxShadow:s.boxShadow}};
                return {wrap:wrap?rect(wrap):null,table:table?rect(table):null,head:table?rect(table.querySelector('thead tr')):null,rows:table?[...table.querySelectorAll('tbody tr')].map(rect):[],firstTh:firstTh?rect(firstTh):null,firstTd:firstTd?rect(firstTd):null,th:firstTh?cs(firstTh):null,td:firstTd?cs(firstTd):null,scrollWidth:wrap?.scrollWidth||0,clientWidth:wrap?.clientWidth||0,pageScrollWidth:document.documentElement.scrollWidth,pageClientWidth:document.documentElement.clientWidth};
              });
              const status=response?.status()||0; const pageOverflow=m.pageScrollWidth>m.pageClientWidth+1;
              if(status>=400||pageErrors.length||pageOverflow||!m.wrap||!m.table) failed=true;
              if(!near(m.head?.height||0,54,0.6)||m.rows.some(r=>!near(r.height,54,0.6))) failed=true;
              if(!near(parseFloat(m.th?.fontSize||0),15,.2)||!near(parseFloat(m.th?.lineHeight||0),24,.3)||!near(parseFloat(m.th?.paddingTop||0),15,.2)||!near(parseFloat(m.th?.paddingLeft||0),20,.2)) failed=true;
              if(m.th?.backgroundColor!=='rgb(66, 66, 66)'||m.th?.color!=='rgb(255, 255, 255)'||m.th?.fontWeight!=='400') failed=true;
              if(!String(m.th?.boxShadow).includes('215, 212, 212')) failed=true;
              if(item.name==='sp'){
                if(!near(m.table.width,960,1)||m.scrollWidth<959||m.clientWidth>=m.scrollWidth-100) failed=true;
              } else {
                if(!near(m.table.width,m.wrap.width,1)||!near(m.firstTh?.width||0,m.wrap.width/4,1)) failed=true;
              }
              await locator.screenshot({path:`.runtime/budokan-shared-table/${item.name}-table.png`});
              results.push({viewport:item,status,pageErrors,pageOverflow,metrics:m});
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('.runtime/budokan-shared-table/runtime.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(failed) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-shared-table-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-shared-table
          if-no-files-found: error
      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
