acf_values:
  mv_lead: "７つのコース制で“ミライ”を見つけ、資格取得支援で“チカラ”をつける。千葉の経済と就職に強い学びがここにある。"
  reason_intro: "学生一人ひとりに寄り添う教育と、地域に根ざした実践的な学びで、将来につながる力を育みます。"
  reason_1_title: "少人数教育"
  reason_1_body: "一人ひとりに目が届く少人数教育。質問や相談もしやすい環境です。"
  reason_2_title: "充実のキャリア支援"
  reason_2_body: "キャリア支援と企業連携により、希望進路の実現をサポートします。"
  reason_3_title: "地域連携・インターンシップ"
  reason_3_body: "地域企業・自治体との実践的な学びで、社会で活きる力を養います。"
  education_intro: "千葉経済大学では、経済や経営を学びながら、世の中の仕組みを知り、自分の興味や可能性を見つけていきます。"
  education_1_title: "大学1年生の自分"
  education_1_bullet_1: "将来がまだ見えない"
  education_1_bullet_2: "学科選択制度で基礎を学ぶ"
  education_1_bullet_3: "７つのコースで目標を明確に"
  education_1_bullet_4: "資格取得支援でスキルを発見"
  education_2_title: "世の中の仕組みを知る"
  education_2_bullet_1: "ヒット商品の裏側"
  education_2_bullet_2: "トクするお金のルール"
  education_2_bullet_3: "AIで仕事はどうなる"
  education_3_title: "先生と一緒に考える"
  education_3_bullet_1: "教職員との距離が近い"
  education_3_bullet_2: "悩みを相談しやすい"
  education_3_bullet_3: "個人に合わせた進路のサポート"
  education_4_title: "望んだ将来を実現させる"
  education_4_bullet_1: "４年間の学びを進路につなげる"
  education_4_bullet_2: "経験を社会で発揮する"
  education_4_bullet_3: "自分らしい未来を見つける"

