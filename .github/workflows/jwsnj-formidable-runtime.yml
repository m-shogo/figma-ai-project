name: JWSNJ disposable WordPress Formidable QA
on:
  pull_request:
    branches: [so]
    paths:
      - 'projects/jwsnj/qa/seed-top-news-qa.php'
      - 'projects/jwsnj/qa/top-news-browser-qa.mjs'
      - 'projects/jwsnj/theme/template-parts/_top-news.php'
      - 'projects/jwsnj/theme/template-parts/_list-news_article.php'
      - 'projects/jwsnj/theme/template-parts/_label-category.php'
      - 'projects/jwsnj/theme/css/project/top_news.css'
      - 'projects/jwsnj/theme/css/module/module_newsList-01.css'
      - 'projects/jwsnj/theme/css/wordpress/form.css'
      - 'projects/jwsnj/theme/js/form.js'
      - 'projects/jwsnj/theme/js/file-link-icons.js'
      - 'projects/jwsnj/theme/js/editor-file-link-icons.js'
      - 'projects/jwsnj/theme/inc/front.php'
      - 'projects/jwsnj/theme/template-parts/_head_contents.php'
      - 'projects/jwsnj/theme/footer.php'
      - 'projects/jwsnj/theme/inc/form.php'
      - 'projects/jwsnj/theme/templates/template-form.php'
      - 'projects/jwsnj/qa/form-render-shortcode.php'
      - 'projects/jwsnj/qa/seed-css-form-qa.php'
      - 'projects/jwsnj/qa/formidable-browser-qa.mjs'
      - 'projects/jwsnj/qa/seed-navigation-qa.php'
      - 'projects/jwsnj/qa/navigation-browser-qa.mjs'
      - 'projects/jwsnj/qa/seed-parts-gallery-qa.php'
      - 'projects/jwsnj/qa/parts-gallery-browser-qa.mjs'
      - 'projects/jwsnj/theme/css/blocks/wp-block-gallery-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-image-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-media-text-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-lightbox-overlay.css'
      - 'projects/jwsnj/theme/css/module/module_zoom-button.css'
      - 'projects/jwsnj/qa/seed-fiscal-qa.php'
      - 'projects/jwsnj/qa/fiscal-archive-qa.mjs'
      - 'projects/jwsnj/qa/fixtures/parts-catalog-native.html'
      - 'projects/jwsnj/qa/seed-native-parts-qa.php'
      - 'projects/jwsnj/qa/seed-parts-tabs-qa.php'
      - 'projects/jwsnj/qa/parts-tabs-browser-qa.mjs'
      - 'projects/jwsnj/qa/fixtures/parts-catalog-owner-reference.html'
      - 'projects/jwsnj/theme/css/blocks/wp-block-tabs-style.css'
      - 'projects/jwsnj/qa/native-parts-browser-qa.mjs'
      - 'projects/jwsnj/qa/native-details-fallback-qa.mjs'
      - 'projects/jwsnj/qa/native-parts-editor-qa.mjs'
      - 'projects/jwsnj/qa/seed-inpage-qa.php'
      - 'projects/jwsnj/qa/inpage-browser-qa.mjs'
      - 'projects/jwsnj/theme/css/blocks/wp-block-inPageLink-style.css'
      - 'projects/jwsnj/qa/fixtures/parts-catalog-tables.html'
      - 'projects/jwsnj/qa/seed-parts-tables-qa.php'
      - 'projects/jwsnj/qa/parts-tables-browser-qa.mjs'
      - 'projects/jwsnj/qa/fixtures/parts-catalog-text-boxes.html'
      - 'projects/jwsnj/qa/seed-parts-text-boxes-qa.php'
      - 'projects/jwsnj/qa/parts-text-boxes-browser-qa.mjs'
      - 'projects/jwsnj/theme/css/blocks/wp-block-columns-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-group-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-hidden-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-table-style.css'
      - 'projects/jwsnj/theme/js/table-scroll-hint.js'
      - 'projects/jwsnj/theme/css/blocks/wp-block-heading-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-text-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-list-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-buttonLink-style.css'
      - 'projects/jwsnj/theme/css/blocks/wp-block-details-style.css'
      - 'projects/jwsnj/theme/inc/field.php'
      - 'projects/jwsnj/theme/page.php'
      - 'projects/jwsnj/theme/template-parts/_breadCrumb.php'
      - 'projects/jwsnj/theme/js/common.js'
      - 'projects/jwsnj/theme/inc/menu.php'
      - 'projects/jwsnj/theme/template-parts/_header.php'
      - 'projects/jwsnj/theme/template-parts/_footer.php'
      - 'projects/jwsnj/theme/css/layout/global_navigation.css'
      - 'projects/jwsnj/theme/css/layout/global_header.css'
      - 'projects/jwsnj/theme/css/layout/global_footer.css'
      - '.github/workflows/jwsnj-formidable-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PROJECT: jwsnj
  COMPOSE_PROJECT_NAME: jwsnj-formidable-qa
  WP_PORT: '28001'
jobs:
  wp-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/css-qa" --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.65.1
          "$RUNNER_TEMP/css-qa/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Create disposable WordPress and actual free Formidable form
        id: wp_setup
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose up -d db wordpress
          for i in $(seq 1 90); do
            if docker compose exec -T wordpress test -f /var/www/html/wp-includes/version.php; then break; fi
            sleep 1
          done
          docker compose run --rm cli core install --url="$WP_URL" --title="CSS QA" --admin_user="fixture-admin" --admin_password="fixture-admin-change-me" --admin_email="fixture@example.invalid" --skip-email
          docker compose run --rm cli plugin install advanced-custom-fields formidable --activate
          docker compose run --rm cli theme activate "$THEME_SLUG"
          docker compose run --rm cli core version
          docker compose run --rm cli plugin list
          docker compose exec -T wordpress cp /project/qa/form-render-shortcode.php /var/www/html/wp-content/mu-plugins/90-form-render-qa.php
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local cli eval-file /project/qa/seed-css-form-qa.php
          page_id="$(docker compose run --rm cli option get jwsnj_css_qa_page_id)"
          [[ "$page_id" =~ ^[0-9]+$ ]]
          echo "FORM_QA_URL=${WP_URL}/?page_id=${page_id}" >> "$GITHUB_ENV"
          postal_id="$(docker compose run --rm cli option get jwsnj_css_qa_postal_page_id)"
          [[ "$postal_id" =~ ^[0-9]+$ ]]
          echo "POSTAL_QA_URL=${WP_URL}/?page_id=${postal_id}" >> "$GITHUB_ENV"
      - name: Actual plugin markup cross-engine keyboard and geometry
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: node projects/jwsnj/qa/formidable-browser-qa.mjs "$FORM_QA_URL" "$POSTAL_QA_URL"
      - name: Seed and test registered WordPress navigation
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local cli eval-file /project/qa/seed-navigation-qa.php
          nav_id="$(docker compose run --rm cli option get jwsnj_navigation_qa_page_id)"
          [[ "$nav_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/navigation-browser-qa.mjs "${WP_URL}/?page_id=${nav_id}"
      - name: Actual native gallery and lightbox parts checks
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-parts-gallery-qa.php
          gallery_id="$(docker compose run --rm cli option get jwsnj_parts_gallery_qa_page_id)"
          [[ "$gallery_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/parts-gallery-browser-qa.mjs "${WP_URL}/?page_id=${gallery_id}"
      - name: Actual native text box Group and Columns geometry
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-parts-text-boxes-qa.php
          boxes_id="$(docker compose run --rm cli option get jwsnj_parts_text_boxes_qa_page_id)"
          [[ "$boxes_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/parts-text-boxes-browser-qa.mjs "${WP_URL}/?page_id=${boxes_id}"
      - name: Actual fiscal archive query and pagination
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local cli eval-file /project/qa/seed-fiscal-qa.php
          cd ../..
          node projects/jwsnj/qa/fiscal-archive-qa.mjs "$WP_URL"
      - name: Actual Flexible Table Block and responsive parts checks
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm cli plugin install flexible-table-block --version=3.9.0 --activate
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-parts-tables-qa.php
          table_id="$(docker compose run --rm cli option get jwsnj_parts_tables_qa_page_id)"
          [[ "$table_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/parts-tables-browser-qa.mjs "${WP_URL}/?page_id=${table_id}"
      - name: Native WordPress tabs and nested catalog content
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-parts-tabs-qa.php
          tabs_id="$(docker compose run --rm cli option get jwsnj_parts_tabs_qa_page_id)"
          [[ "$tabs_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/parts-tabs-browser-qa.mjs "${WP_URL}/?page_id=${tabs_id}"
      - name: Native Gutenberg parts fixture and browser checks
        id: native_parts
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-native-parts-qa.php
          parts_id="$(docker compose run --rm cli option get jwsnj_native_parts_qa_page_id)"
          [[ "$parts_id" =~ ^[0-9]+$ ]]
          cd ../..
          echo "seeded=true" >> "$GITHUB_OUTPUT"
          node projects/jwsnj/qa/native-parts-browser-qa.mjs "${WP_URL}/?page_id=${parts_id}"
      - name: Native details without motion enhancement
        if: ${{ !cancelled() && steps.wp_setup.outcome == 'success' && steps.native_parts.outputs.seeded == 'true' }}
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          parts_id="$(docker compose run --rm cli option get jwsnj_native_parts_qa_page_id)"
          [[ "$parts_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/native-details-fallback-qa.mjs "${WP_URL}/?page_id=${parts_id}"
      # Independent coverage must report even when a previous browser check
      # failed. Keep the job failed; do not use continue-on-error.
      - name: In-page links in disposable WordPress
        if: ${{ !cancelled() && steps.wp_setup.outcome == 'success' }}
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_PARTS_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-inpage-qa.php
          inpage_id="$(docker compose run --rm cli option get jwsnj_inpage_qa_page_id)"
          [[ "$inpage_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/inpage-browser-qa.mjs "${WP_URL}/?page_id=${inpage_id}"
      # Editor evidence remains independent of earlier frontend test failures.
      # The prior failing step still fails the job.
      - name: Actual Gutenberg editor validation and save/reopen
        if: ${{ !cancelled() && steps.wp_setup.outcome == 'success' && steps.native_parts.outputs.seeded == 'true' }}
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
          JWSNJ_PARTS_QA_DISPOSABLE: '1'
          QA_WP_ADMIN_USER: fixture-admin
          QA_WP_ADMIN_PASSWORD: fixture-admin-change-me
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          parts_id="$(docker compose run --rm cli option get jwsnj_native_parts_qa_page_id)"
          [[ "$parts_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/native-parts-editor-qa.mjs "${WP_URL}/?page_id=${parts_id}"
      # TOP changes Reading assignments only after the other disposable tests.
      - name: Actual static TOP News and shared post rows
        if: ${{ !cancelled() && steps.wp_setup.outcome == 'success' }}
        env:
          CSS_QA_MODULE_ROOT: ${{ runner.temp }}/css-qa
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local -e JWSNJ_TOP_QA_DISPOSABLE=1 cli eval-file /project/qa/seed-top-news-qa.php
          archive_id="$(docker compose run --rm cli option get jwsnj_top_news_qa_archive)"
          [[ "$archive_id" =~ ^[0-9]+$ ]]
          cd ../..
          node projects/jwsnj/qa/top-news-browser-qa.mjs "$WP_URL" "$archive_id"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jwsnj-formidable-browser
          path: form-qa-results/
          if-no-files-found: warn
      - name: Cleanup only disposable runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
