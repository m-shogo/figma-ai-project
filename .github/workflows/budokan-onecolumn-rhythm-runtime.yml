name: Budokan One Column Rhythm Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/page.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/layout/global_inner.css'
      - 'experiments/wordpress-acf-runtime/scripts/seed-budokan-onecolumn-rhythm-qa.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-onecolumn-rhythm-browser-qa.mjs'
      - '.github/workflows/budokan-onecolumn-rhythm-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable WordPress runtime
        env:
          BUDOKAN_LOCAL_NAV_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-local-nav-runtime-qa.sh
      - name: Seed explicit one-column fixture
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local cli eval-file /fixture/scripts/seed-budokan-onecolumn-rhythm-qa.php
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run explicit one-column PC rhythm QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          page_id="$(docker compose run --rm cli option get budokan_onecolumn_rhythm_qa_page_id)"
          qa_url="${WP_URL}/?page_id=${page_id}"
          cd ../..
          node experiments/wordpress-acf-runtime/scripts/budokan-onecolumn-rhythm-browser-qa.mjs "$qa_url"
      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
