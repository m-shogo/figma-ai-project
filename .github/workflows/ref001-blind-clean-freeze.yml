name: REF001 Blind Clean Freeze

on:
  push:
    branches:
      - agent/ref001-blind-clean-first-pass-20260812
    paths:
      - '.github/workflows/ref001-blind-clean-freeze.yml'
      - 'experiments/ref001-blind-clean-20260812/run.yaml'
      - 'experiments/ref001-blind-clean-20260812/evidence/first-pass-measurement.yaml'

permissions:
  contents: write

jobs:
  freeze-first-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Complete capture provenance metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('experiments/ref001-blind-clean-20260812/run.yaml')
          run = yaml.safe_load(path.read_text(encoding='utf-8'))
          captures = run['captures']['first_pass']
          for capture in captures:
              capture['environment_profile_id'] = 'github-actions-ubuntu-chromium-playwright-1x'
              capture['input_state'] = {
                  'primary_hover': 'HOVER',
                  'primary_pointer': 'FINE',
                  'touch': False,
              }
              capture['preferences'] = {
                  'reduced_motion': 'NO_PREFERENCE',
                  'forced_colors': 'NONE',
                  'contrast': 'NO_PREFERENCE',
                  'color_scheme': 'LIGHT',
              }
              capture['captured_at'] = '2026-08-12T03:28:37+09:00'
              capture['notes'] = [
                  'GitHub-hosted Ubuntu Chromium capture; viewport-only Playwright context, no mobile device emulation.',
                  'FIRST PASS evidence captured before completed-page visual repair.',
              ]
          captures[0]['runtime']['orientation'] = 'LANDSCAPE'
          captures[1]['runtime']['orientation'] = 'PORTRAIT'
          captures[2]['runtime']['orientation'] = 'PORTRAIT'
          path.write_text(yaml.safe_dump(run, allow_unicode=True, sort_keys=False, width=120), encoding='utf-8')
          PY
      - name: Validate run schema before freeze
        run: python scripts/validate_records.py
      - name: Enter FIRST_PASS_FREEZE gate
        run: python scripts/controlled_run_phase.py experiments/ref001-blind-clean-20260812/run.yaml --phase FIRST_PASS_FREEZE
      - name: Freeze immutable FIRST PASS evidence
        run: python scripts/first_pass_evidence.py freeze experiments/ref001-blind-clean-20260812/run.yaml --tooling-revision 7a37ca493f9532c8cb22f4e71a4ca6c65050fa88
      - name: Verify immutable FIRST PASS snapshot
        run: python scripts/first_pass_evidence.py validate experiments/ref001-blind-clean-20260812/run.yaml
      - name: Persist freeze evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/ref001-blind-clean-20260812/run.yaml experiments/ref001-blind-clean-20260812/run.first-pass.json
          if git diff --cached --quiet; then
            echo 'Freeze evidence already persisted.'
            exit 0
          fi
          git commit -m 'Freeze REF-001 FIRST PASS evidence'
          git push
