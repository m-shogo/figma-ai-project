schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-BOUNDED-QA-OWNER
    summary: >-
      Keep a bounded component/runtime workflow gated by assertions that belong to that runtime owner. If an
      unrelated shared visual fixture fails because its assertion still targets superseded synthetic markup,
      first prove the bounded runtime itself passes, then separate the stale shared assertion from that workflow
      rather than changing production code to satisfy the old fixture.
    category: TOOLING
    applicability:
      scope: PROJECT
      conditions:
        - A bounded Disposable WordPress workflow is being extended with interaction or geometry QA.
        - The new bounded QA passes but the job fails later in an imported/shared assertion outside the bounded runtime owner.
        - Current Theme ownership and current Figma authority show that the failing shared assertion targets stale or superseded markup/style ownership.
      exclusions:
        - Do not remove a failing assertion when it is actually owned by the bounded runtime being changed.
        - Do not use workflow scoping to hide a reproduced production defect.
        - Do not change production CSS or markup merely to make a stale fixture green.
        - Same-project evidence is not independent evidence for cross-project promotion.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        Budokan News archive PR #414 added deterministic deep-scroll, pointer, keyboard, hover/focus geometry and
        overflow QA. Those News assertions passed on SP and PC. The first workflow run then failed only in the
        pre-existing shared page-title/Gutenberg heading assertion, which measured a synthetic
        .wp-block-details__button span pseudo-element even though the current Details owner explicitly uses native
        Core <details><summary> markup and summary::after. The News workflow was therefore narrowed back to News
        archive ownership and reran green without a production Theme change. This is useful project evidence but
        not independent cross-project proof.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-NEWS-ARCHIVE-INTERACTION-QA-20260905
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/scripts/budokan-news-archive-interaction-browser-qa.mjs
          commit: 0a0d01551250f5d09b419956e023403b07eec499
          note: >-
            PR #414 verifies real elementFromPoint pointer ownership, deterministic deep scroll, hover/focus
            geometry, keyboard category traversal, pager disabled-state semantics and horizontal-overflow stability
            for the News archive on SP and PC. The final bounded News workflow passed after the unrelated stale
            shared heading assertion was removed from this News-owned workflow.
        - evidence_id: EV-BUDOKAN-DETAILS-NATIVE-OWNER-20260905
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-details-style.css
          commit: 0a0d01551250f5d09b419956e023403b07eec499
          note: >-
            Current Details CSS explicitly declares native Core details/summary markup as WordPress authority and
            states not to depend on synthetic __title/__button/__content wrappers. The live Figma accordion also
            confirms the plus/minus visual belongs to the current accordion control, not the obsolete synthetic
            fixture element measured by the shared QA assertion.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-05: KEEP_PROJECT_ONLY; one Budokan QA ownership correction, no independent reference evidence, no auto-promotion."
