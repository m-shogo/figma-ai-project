name: Budokan Fixed Page Visual QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-fixed-page-visual-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-fixed-page-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live fixed-page capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Create fixed-page QA authority
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose run --rm cli post create \
            --post_type=page \
            --post_status=publish \
            --post_title='研修センター' \
            --post_name='fixed-page-visual-qa' \
            --post_content='<p>Fixed-page visual runtime fixture.</p>' \
            --porcelain > .runtime/fixed-page-id.txt
          docker compose run --rm cli rewrite flush --hard >/dev/null

      - name: Capture SP and PC fixed-page visual
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-fixed-page-visual
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewportWidth: 390, contentWidth: 375, height: 720 },
              { name: 'pc', viewportWidth: 1395, contentWidth: 1380, height: 760 },
            ];
            const results = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.viewportWidth, height: item.height } });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              const response = await page.goto(`${process.env.WP_URL}/fixed-page-visual-qa/`, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);

              const metrics = await page.evaluate(() => {
                const info = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return {
                    x: r.x, y: r.y, width: r.width, height: r.height,
                    fontSize: s.fontSize, fontFamily: s.fontFamily,
                    fontWeight: s.fontWeight, lineHeight: s.lineHeight,
                    color: s.color, backgroundColor: s.backgroundColor,
                    textAlign: s.textAlign,
                  };
                };
                const visual = document.querySelector('.global_mainVisual');
                const vr = visual?.getBoundingClientRect();
                const absolute = value => value && vr ? { ...value, x: value.x - vr.x, y: value.y - vr.y } : value;
                return {
                  visualClass: visual?.className || '',
                  visual: info('.global_mainVisual'),
                  background: absolute(info('.global_mainVisual .gm_background')),
                  title: absolute(info('.global_mainVisual .gm_title')),
                  titleText: document.querySelector('.global_mainVisual .gm_title')?.textContent?.trim() || '',
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                };
              });

              const status = response?.status() || 0;
              const horizontalOverflow = metrics.scrollWidth > metrics.clientWidth + 1;
              if (status >= 400 || pageErrors.length || horizontalOverflow) failed = true;
              if (!metrics.visualClass.includes('_fixedPage')) failed = true;
              if (metrics.titleText !== '研修センター') failed = true;

              if (item.name === 'sp') {
                if (!metrics.visual || Math.abs(metrics.visual.width - item.contentWidth) > 1 || Math.abs(metrics.visual.height - 278) > 2) failed = true;
                if (!metrics.background || Math.abs(metrics.background.width - item.contentWidth) > 1 || Math.abs(metrics.background.height - 240) > 1 || Math.abs(metrics.background.y) > 1) failed = true;
                if (!metrics.title || Math.abs(metrics.title.x) > 1 || Math.abs(metrics.title.y - 199) > 2 || Math.abs(metrics.title.width - 335) > 1 || Math.abs(metrics.title.height - 79) > 2) failed = true;
                if (metrics.title?.fontSize !== '22px' || metrics.title?.textAlign !== 'left') failed = true;
              } else {
                if (!metrics.visual || Math.abs(metrics.visual.width - item.contentWidth) > 1 || Math.abs(metrics.visual.height - 321) > 2) failed = true;
                if (!metrics.background || Math.abs(metrics.background.width - item.contentWidth) > 1 || Math.abs(metrics.background.height - 320) > 1 || Math.abs(metrics.background.y) > 1) failed = true;
                if (!metrics.title || Math.abs(metrics.title.x) > 1 || Math.abs(metrics.title.y - 253) > 2 || Math.abs(metrics.title.width - 360) > 1 || Math.abs(metrics.title.height - 68) > 2) failed = true;
                if (metrics.title?.fontSize !== '32px' || metrics.title?.textAlign !== 'center') failed = true;
              }

              await page.locator('.global_mainVisual').screenshot({ path: `.runtime/budokan-fixed-page-visual/${item.name}-visual.png` });
              results.push({ viewport: item, status, pageErrors, horizontalOverflow, metrics });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-fixed-page-visual/runtime.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-fixed-page-visual-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-fixed-page-visual
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
