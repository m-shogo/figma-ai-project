sections:
  - section_id: header
    figma_nodes:
      pc: "21378:8066"
      sp: "21376:4918"
    page_acf_ownership: NONE_BY_DEFAULT
    reasoning:
      - "Header is a shared Figma component/instance, not page-local content evidence."
      - "Logo, document-request CTA, and open-campus CTA should first be resolved against the existing theme header, menu, options, or global configuration."
    candidate_page_fields: []
    code_or_global_owned:
      - logo
      - document_request_label
      - document_request_url
      - open_campus_label
      - open_campus_url
    unresolved:
      - "Existing target theme's global header/CTA ownership."

  - section_id: main-visual
    figma_nodes:
      pc: "21378:8032"
      sp: "21376:4886"
    page_acf_ownership: PARTIAL
    editor_candidates:
      - id: mv_left_person_image
        type: image
        return_format: ID
        rationale: "Primary content photography may need editor replacement while WordPress attachment helpers preserve image metadata."
        responsive_strategy: SINGLE_ATTACHMENT_SHARED_PC_SP
      - id: mv_right_person_image
        type: image
        return_format: ID
        rationale: "Primary content photography may need editor replacement while WordPress attachment helpers preserve image metadata."
        responsive_strategy: SINGLE_ATTACHMENT_SHARED_PC_SP
      - id: mv_lead
        type: textarea
        rationale: "Supporting explanatory copy can change without redefining the visual system, subject to wrap QA."
    code_owned:
      - id: mv_art_directed_slogan
        figma_text: "ケイザイって、想像以上におもしろい。"
        rationale: "The slogan is decomposed across multiple individually positioned text nodes, quotation marks, type sizes, and colors. Arbitrary CMS editing would break the art-directed composition."
      - id: mv_background_shapes
        rationale: "Vectors, masks, gradients, colors, and geometry are design implementation, not content."
      - id: mv_open_campus_labels
        rationale: "CTA labels are visually composed and likely global; resolve the destination/ownership from the target theme before adding page fields."
    unresolved:
      - "Which of the retained Figma underlay/replacement image layers are true editor-owned sources versus historical design residue."
      - "Whether open-campus URL is global or page-specific."

