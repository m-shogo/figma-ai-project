name: Budokan TOP Body Interaction Runtime

on:
  pull_request:
    paths:
      - 'projects/nipponbudokan/theme/front-page.php'
      - 'projects/nipponbudokan/theme/footer.php'
      - 'projects/nipponbudokan/theme/css/project/top_mainVisual.css'
      - 'projects/nipponbudokan/theme/css/project/top_news.css'
      - 'projects/nipponbudokan/theme/css/project/top_partner.css'
      - 'projects/nipponbudokan/theme/css/project/top_instagram.css'
      - 'projects/nipponbudokan/theme/css/project/top_banner.css'
      - 'projects/nipponbudokan/theme/template-parts/_top-sns.php'
      - 'projects/nipponbudokan/theme/template-parts/_top-instagram.php'
      - 'projects/nipponbudokan/theme/template-parts/_top-partner.php'
      - 'projects/nipponbudokan/theme/template-parts/_top-banner.php'
      - 'projects/nipponbudokan/theme/images/top/sns-octagon-sp.svg'
      - 'projects/nipponbudokan/theme/images/top/banner-octagon-sp.svg'
      - 'projects/nipponbudokan/theme/css/project/top_guide.css'
      - 'projects/nipponbudokan/theme/js/common.js'
      - 'projects/nipponbudokan/qa/budokan-top-fv-runtime-qa.sh'
      - 'projects/nipponbudokan/qa/budokan-top-body-interaction-browser-qa.mjs'
      - '.github/workflows/budokan-top-body-interaction-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: nipponbudokan
  COMPOSE_PROJECT_NAME: nipponbudokan-qa
  WP_PORT: '27248'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress TOP runtime QA
        env:
          BUDOKAN_TOP_FV_KEEP_RUNTIME: '1'
        run: bash projects/nipponbudokan/qa/budokan-top-fv-runtime-qa.sh

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run TOP body interaction stability QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node projects/nipponbudokan/qa/budokan-top-body-interaction-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
