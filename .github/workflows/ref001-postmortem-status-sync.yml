name: REF001 Postmortem Status Sync

on:
  push:
    branches:
      - agent/ref001-clean-replay-knowledge-promotion
    paths:
      - '.github/workflows/ref001-postmortem-status-sync.yml'

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current and historical status text
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          old = '''- 現在の修復済みfixtureはformal FIRST PASS保存前に改善を重ねたため、後付けでFIRST PASS扱いしない
- Clean Replayはまだ`NOT RUN`。reproducibilityを実証済みとは扱わない

Canonical current evidence:

- `references/chiba-keizai-sample.reference.yaml`
- `experiments/ref001-wordpress-acf/README.md`
- `experiments/ref001-wordpress-acf/artifacts/README.md`
'''
          new = '''- historicalの修復済みfixtureはformal FIRST PASS保存前に改善を重ねたため、今後も後付けでFIRST PASS扱いしない
- separate Blind Clean Replay `RUN-REF001-BLIND-CLEAN-20260812-A` は実行済みで、immutable FIRST PASSを保存した
- Blind FIRST PASS fidelity: `57 / 80`、post-freeze visual repair: `2 rounds`、final fidelity: `67 / 80`
- Clean Replay final geometry: PC `1380px` / SP `375px` ともsemantic section top/height `0px` delta
- required 11 runtime widthsでhorizontal overflow / readable-text clipping / runtime errorは`0`
- Human Editability change drills: `10 / 10`
- run statusはmedia transfer / production WordPress target / real ACF ADMIN_UI smoke未解決のため、誇張せず`BLOCKED`
- Clean Replay後の事後比較から3 ruleを`E2 / OPTIONAL` Candidateへ昇格した

Canonical current evidence:

- `references/chiba-keizai-sample.reference.yaml`
- `experiments/ref001-wordpress-acf/README.md`
- `experiments/ref001-blind-clean-20260812/run.yaml`
- `experiments/ref001-blind-clean-20260812/evidence/final-measurement.yaml`
- `docs/ref001-clean-replay-postmortem.md`
- `playbook/candidates/README.md`
'''
          if old not in text:
              raise SystemExit('root README status block not found; refusing broad rewrite')
          root.write_text(text.replace(old, new, 1), encoding='utf-8')

          historical = Path('experiments/ref001-wordpress-acf/README.md')
          htext = historical.read_text(encoding='utf-8')
          anchor = '''Purpose: learn from a real Figma → WordPress fixed-page-template + ACF translation before freezing production rules.\n'''
          note = '''\n> **Post-hoc status note (2026-08-12):** a separate Blind Clean Replay has now been completed and merged under `experiments/ref001-blind-clean-20260812/`. Historical `NOT READY / NOT RUN` wording later in this document is intentionally preserved as the state of this repaired fixture before that separate replay; do not reinterpret this historical fixture as the frozen FIRST PASS.\n'''
          if note.strip() not in htext:
              if anchor not in htext:
                  raise SystemExit('historical README anchor not found; refusing broad rewrite')
              htext = htext.replace(anchor, anchor + note, 1)
              historical.write_text(htext, encoding='utf-8')
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Commit status sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md experiments/ref001-wordpress-acf/README.md
          git commit -m 'Sync REF-001 clean replay current status'
          git push
