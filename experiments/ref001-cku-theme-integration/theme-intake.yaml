unknowns:
  - id: block-support-flags
    question: "Are any block-editor feature flags registered for cku outside this filesystem export (e.g. via a must-use plugin)?"
    blocks: []
    state: RESOLVED
    notes:
      - "Resolved as not-applicable to this integration: page-ref001.php is a classic PHP page template (Template Name header), not a block template, so undetermined block-editor flags do not block this implementation. Left UNDETERMINED at the theme_delivery.observation[block_support] item itself, per the epistemic-state rule (UNDETERMINED must not be laundered into NONE); resolving the *unknown* here only means it does not block freeze, not that the underlying filesystem fact became known."
  - id: acf-pro-license
    question: "Is a real ACF_PRO_LICENSE_KEY available in this run for a full `make qa` FULL E2E run (repeater mutation QA against real ACF PRO)?"
    blocks:
      - qa_reuse.layers.cms_mutation_qa
    state: RESOLVED
    notes:
      - "Answer: no. This is a definitive, documented answer, not an open question: experiments/wordpress-acf-pro-standalone-lp is explicitly designed to degrade gracefully without the secret (`make smoke` runtime-only path), and this repo's safety rules forbid entering/sourcing a real license key on the agent's own initiative. Resolution is 'defer FULL E2E to the human operator's real secret', which is recorded as an explicit manual follow-up in this record and in the final report, not left as a silently-open unknown."

