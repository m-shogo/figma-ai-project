  - "A separate target WordPress theme repository/code baseline has not been supplied; this repository is the Figma-to-code research/workflow project."
  - "Target WordPress theme branch and starting commit are unresolved."
  - "Classic vs Hybrid theme type, styling/build architecture, existing components, template parts, and code tokens must be inferred from the target theme rather than guessed."
  - "WordPress/PHP/ACF versions, ACF PRO availability, ACF Local JSON paths, and existing field/key conventions are unresolved."
  - "Actual page slug/template filename and global-vs-page ownership for Header/CTA content are unresolved."
  - "Code Connect availability/mapping is UNDETERMINED because the current Figma plan/seat blocks MCP Code Connect lookup."
  - "Student Voice interaction behavior and complete expanded content for items 2/3 are unresolved."
  - "Messages content for records 2–4 and slider/carousel behavior are unresolved."

