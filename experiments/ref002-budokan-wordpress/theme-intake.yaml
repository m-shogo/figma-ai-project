qa_reuse:
  layers:
    - id: wordpress_runtime
      existing_asset: experiments/wordpress-acf-pro-standalone-lp
      reuse_mode: REUSE
      notes:
        - "disposable runtime として再利用。theme mount のみ差し替える"
        - "提供Themeは theme-dropin/ へ置くか THEME_SOURCE_DIR で指す (PR #151)"
        - "production Theme構造をこの sample theme から継承しない"
    - id: acf_pro_resolution
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/scripts/setup.sh
      reuse_mode: REUSE
      notes:
        - "ACF_PRO_LICENSE_KEY の secret 境界をそのまま使う"
    - id: cms_mutation_qa
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/tests/runtime.mjs
      reuse_mode: ADAPT
      notes:
        - "0/1/8/多数・長文・改行・空・画像なし・並び替え の形を REF-002 field へ写す"
        - "fixture 内容は ACF field 構造が決まってから作る"
    - id: visual_diff
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/tests/visual-diff.mjs
      reuse_mode: REUSE
      notes:
        - "VISUAL_DIFF_MAX_RATIO 未設定時は MEASURE_ONLY。universal tolerance を入れない"
    - id: typography_metrics
      existing_asset: docs/ref001-typography-runtime-metrics-learning.md
      reuse_mode: ADAPT
      notes:
        - "font-size / line-height / letter-spacing / font-weight を computed style で検証する"
    - id: asset_lineage
      existing_asset: tools/implementation-intake/visual_truth_guard.py
      reuse_mode: REUSE
      notes:
        - "ASSET_PENDING / ASSET_READY / ASSET_CORRUPT / ASSET_INVALID_EPHEMERAL_METADATA をそのまま使う"
        - "REF-002 benchmark は PC/SP それぞれ 35 slot が ASSET_PENDING のまま"
    - id: target_readiness
      existing_asset: scripts/coordinate_wordpress_target_readiness.py
      reuse_mode: REUSE
      notes:
        - "Theme到着時の read-only preflight"
  viewports:
    - width: 1380
      role: PC canonical
    - width: 375
      role: SP canonical
  acf_secret_boundary:
    secret_name: ACF_PRO_LICENSE_KEY
    committed: false

