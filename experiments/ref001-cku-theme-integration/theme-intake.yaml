qa_reuse:
  layers:
    - id: wordpress_runtime
      existing_asset: experiments/wordpress-acf-pro-standalone-lp
      reuse_mode: REUSE
      notes:
        - "cku was applied via scripts/apply-overlay.sh into theme-dropin/cku (git-ignored) and scripts/status.sh confirmed the harness correctly resolved THEME_SOURCE_DIR/theme_slug=cku; no new runtime was built"
        - "`make smoke` was started locally but this agent's sandbox has no outbound Docker Hub network access (verified: even `docker pull hello-world` did not complete) -- WordPress/MariaDB images could not be pulled, so a real WordPress render of the overlay was NOT obtained in this run. This is an environment/network limitation, not a code defect."
        - "In place of the live runtime, experiments/ref001-cku-theme-integration/scripts/ci-render-contract.php exercises the exact same PHP entry points (functions/ref001-integration.php + page-ref001.php) against a minimal WordPress-function stub harness: (1) ACF absent -> byte-parity fixture fallback with no PHP warnings/errors, (2) ACF repeater data present and mutated -> DOM actually changes (title/image/quote text, and item count truncates to the mutated row count). This is E1 local observation at the PHP-contract level, not a substitute for a real WordPress+ACF PRO FULL E2E render."
        - "Manual follow-up for the human operator: run `experiments/ref001-cku-theme-integration/scripts/apply-overlay.sh` against a real cku checkout in `experiments/wordpress-acf-pro-standalone-lp/theme-dropin/`, then `make smoke` (and `make qa` with a real ACF_PRO_LICENSE_KEY) from a network environment that can reach Docker Hub."
    - id: acf_pro_resolution
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/scripts/setup.sh
      reuse_mode: REUSE
      notes:
        - "ACF_PRO_LICENSE_KEY secret boundary reused as-is; this run had no license key available and, separately, no Docker Hub network access, so neither the secret-free `make smoke` runtime path nor the full `make qa` path could be executed end-to-end in this sandbox. `make qa` (full ACF PRO + repeater mutation + Playwright) requires the human operator's real ACF_PRO_LICENSE_KEY and a network-unrestricted environment."
    - id: cms_mutation_qa
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/tests/runtime.mjs
      reuse_mode: ADAPT
      notes:
        - "Mutation shapes (0/1/8/many items, long text, missing image, reordered items) map onto the student_voice and swiper repeaters; requires ACF PRO to execute for real, so this remains a documented/adapted contract pending a licensed FULL E2E run"
    - id: visual_diff
      existing_asset: experiments/wordpress-acf-pro-standalone-lp/tests/visual-diff.mjs
      reuse_mode: REUSE
      notes:
        - "MEASURE_ONLY; no universal tolerance introduced"
    - id: asset_lineage
      existing_asset: tools/implementation-intake/visual_truth_guard.py
      reuse_mode: REUSE
      notes:
        - "REF-001 assets are already ASSET_READY (Human-Reviewed, durable bytes) under experiments/ref001-blind-clean-20260812; no new Figma asset pulls needed for this integration"
    - id: target_readiness
      existing_asset: scripts/coordinate_wordpress_target_readiness.py
      reuse_mode: REUSE
      notes:
        - "Used for read-only preflight against the local scratch unzip of cku"
  viewports:
    - {width: 320, role: "SP QA (mission-listed capture width, not a CSS breakpoint)"}
    - {width: 360, role: "SP QA"}
    - {width: 375, role: "SP QA canonical"}
    - {width: 390, role: "SP QA"}
