name: Budokan TOP Events Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_top-events.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_events.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/home.js'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/inc/front.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-top-events-runtime-qa.sh'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-top-events-browser-qa.mjs'
      - '.github/workflows/budokan-top-events-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress TOP Events runtime QA
        env:
          BUDOKAN_TOP_EVENTS_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-top-events-runtime-qa.sh

      - name: Run SP and PC TOP Events browser geometry QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node experiments/wordpress-acf-runtime/scripts/budokan-top-events-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
