        - evidence_id: EV-OBS-COVERAGE-DISTRIBUTION
          kind: COMMIT
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: scripts/validate_benchmark_replay_pipeline.py
          commit: 03a00410a92d85e245dbcf5fcb98cab4656a17d4
