learning_notes:
  - "Domain identity and editor-owned page copy are separate concerns even inside one visual card."
  - "Seven repeated cards do not justify Repeater when the seven identities are part of the institution's authored course system."
  - "Figma color Variables are stronger evidence than manually sampling card colors; preserve token identity for later mapping to the target theme."
  - "No bitmap media is present, so adding ACF image fields for Courses would be invented CMS surface area."
  - "The Figma kicker currently says # COURCES. Do not silently fix source copy during fidelity First Pass."
