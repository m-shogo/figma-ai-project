name: REF001 Final Human Feedback Once

on:
  push:
    branches:
      - agent/ref001-css-canonicalize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ref001-css-canonicalize
          fetch-depth: 0
      - name: Apply only approved final human feedback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css')
          css = path.read_text()

          desktop_old = '.ref-mv__oc-kicker{left:27px;top:7px;font-size:14px}'
          desktop_new = '.ref-mv__oc-kicker{left:50%;top:9px;transform:translateX(-50%);font-size:14px}'
          sp_old = '.ref-mv__oc-kicker{left:-19px;top:-22px;font-size:14px}'
          sp_new = '.ref-mv__oc-kicker{left:50%;top:-20px;transform:translateX(-50%);font-size:14px}'
          if desktop_old not in css:
              raise SystemExit('desktop OC kicker authority not found')
          if sp_old not in css:
              raise SystemExit('SP OC kicker authority not found')
          css = css.replace(desktop_old, desktop_new)
          css = css.replace(sp_old, sp_new)

          start_marker = '.ref-course__rec-label{\n  position:absolute!important;'
          start = css.rfind(start_marker)
          if start < 0:
              raise SystemExit('final course recommendation block not found')
          end_marker = '.ref-course__rec-tail-fill,.ref-course__rec-tail-line{display:none!important}'
          end = css.find(end_marker, start)
          if end < 0:
              raise SystemExit('final course recommendation tail marker not found')
          end += len(end_marker)
          v2_recommend = '''.ref-course__rec-label{
  position:absolute!important;
  box-sizing:border-box!important;
  display:grid!important;
  place-items:center!important;
  width:189px!important;
  height:49px!important;
  padding:0!important;
  background:#fff!important;
  border:1px solid #777!important;
  border-radius:999px!important;
  overflow:visible!important;
  isolation:auto;
}
.ref-course__rec-label::before{
  content:""!important;
  position:absolute!important;
  left:48px!important;
  bottom:-7px!important;
  top:auto!important;
  width:12px!important;
  height:12px!important;
  background:#fff!important;
  border:0!important;
  border-right:1px solid #777!important;
  border-bottom:1px solid #777!important;
  border-radius:0!important;
  transform:rotate(45deg)!important;
  z-index:auto!important;
  pointer-events:none;
}
.ref-course__rec-label::after{content:none!important;display:none!important}
.ref-course__rec-label>span{position:relative;z-index:2}
.ref-course__rec-tail-fill,.ref-course__rec-tail-line{display:none!important}'''
          css = css[:start] + v2_recommend + css[end:]

          nav_old = '.ref-messages__nav{appearance:none;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;transition:opacity var(--ref-transition) ease,transform var(--ref-transition) ease}'
          nav_new = '.ref-messages__nav{appearance:none;border:0;background:transparent;padding:0;position:relative;display:grid;place-items:center;cursor:pointer;transition:opacity var(--ref-transition) ease,transform var(--ref-transition) ease}\n.ref-messages__nav::before{content:"";position:absolute;inset:-14px}'
          if nav_old not in css:
              raise SystemExit('messages nav authority not found')
          css = css.replace(nav_old, nav_new, 1)

          path.write_text(css)
          PY
      - name: Remove one-shot workflow and push
        run: |
          rm .github/workflows/ref001-final-human-feedback-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css .github/workflows/ref001-final-human-feedback-once.yml
          git commit -m "Polish REF-001 final human feedback"
          git push origin HEAD:agent/ref001-css-canonicalize
