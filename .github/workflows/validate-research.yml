name: Validate research records

on:
  push:
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "policies/**/*.yaml"
      - "references/**/*.yaml"
      - "experiments/**/*.yaml"
      - "contracts/**/*.yaml"
      - "research/**/*.yaml"
      - "requirements-dev.txt"
      - ".github/workflows/validate-research.yml"
      - ".github/workflows/update-radar.yml"
  pull_request:
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "policies/**/*.yaml"
      - "references/**/*.yaml"
      - "experiments/**/*.yaml"
      - "contracts/**/*.yaml"
      - "research/**/*.yaml"
      - "requirements-dev.txt"
      - ".github/workflows/validate-research.yml"
      - ".github/workflows/update-radar.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject duplicate YAML mapping keys
        run: python scripts/validate_yaml_duplicates.py

      - name: Validate official Update Radar source registry
        run: python scripts/validate_update_sources.py

      - name: Validate reference, shared, section, and run records
        run: python scripts/validate_records.py

      - name: Validate company implementation policy and frozen lineage
        run: python scripts/validate_company_policy.py

      - name: Validate resolved device/browser environment contract
        run: python scripts/validate_environment_contract.py

      - name: Validate actual Figma capability profile before contract freeze
        run: python scripts/validate_figma_profile.py

      - name: Validate per-section Figma structure profiles
        run: python scripts/validate_figma_structure_profiles.py

      - name: Validate per-section Figma structure profile lineage
        run: python scripts/validate_figma_structure_profile.py

      - name: Validate component and token resolution tables
        run: python scripts/validate_resolution_tables.py

      - name: Validate frozen breakpoint contract semantics
        run: python scripts/validate_breakpoint_contract.py

      - name: Validate section discovery evidence and mapping confidence
        run: python scripts/validate_section_discovery.py

      - name: Validate parallel section write isolation and dependencies
        run: python scripts/validate_parallel_paths.py

      - name: Validate parallel worker git and sandbox isolation
        run: python scripts/validate_parallel_isolation.py

      - name: Validate immutable run evidence lineage
        run: python scripts/validate_run_lineage.py

      - name: Validate immutable FIRST PASS evidence snapshots
        run: python scripts/first_pass_evidence.py validate

      - name: Validate clean replay pair comparability
        run: python scripts/prepare_clean_replay.py validate

      - name: Validate capture environment lineage and required coverage
        run: python scripts/validate_capture_environment.py

      - name: Test section execution planner and validators
        run: python -m unittest discover -s tests -p 'test_*.py'