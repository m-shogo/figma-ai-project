name: Budokan TOP Events Runtime

on:
  pull_request:
    paths:
      - 'projects/nipponbudokan/theme/template-parts/_top-events.php'
      - 'projects/nipponbudokan/theme/css/project/top_events.css'
      - 'projects/nipponbudokan/theme/js/home.js'
      - 'projects/nipponbudokan/theme/inc/front.php'
      - 'projects/nipponbudokan/qa/budokan-top-events-runtime-qa.sh'
      - 'projects/nipponbudokan/qa/budokan-top-events-browser-qa.mjs'
      - 'projects/nipponbudokan/docs/TOP_EVENTS_VISUAL_ALIGNMENT_2026-08-31.md'
      - '.github/workflows/budokan-top-events-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: nipponbudokan
  COMPOSE_PROJECT_NAME: nipponbudokan-qa
  WP_PORT: '27248'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress TOP Events runtime QA
        env:
          BUDOKAN_TOP_EVENTS_KEEP_RUNTIME: '1'
        run: bash projects/nipponbudokan/qa/budokan-top-events-runtime-qa.sh

      - name: Run SP and PC TOP Events browser geometry QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node projects/nipponbudokan/qa/budokan-top-events-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
