name: Budokan Tab Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/blocks/tabContainer.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/blocks/tabPanel.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/module/module_tab.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/common.js'
      - 'experiments/wordpress-acf-runtime/scripts/seed-budokan-tab-qa.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-tab-interaction-browser-qa.mjs'
      - '.github/workflows/budokan-tab-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax for Budokan tab runtime fixture
        run: php -l experiments/wordpress-acf-runtime/scripts/seed-budokan-tab-qa.php

      - name: Start disposable WordPress runtime
        env:
          BUDOKAN_LOCAL_NAV_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-local-nav-runtime-qa.sh

      - name: Seed tab QA and install browser runtime
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose run --rm -e WP_ENVIRONMENT_TYPE=local cli eval-file /fixture/scripts/seed-budokan-tab-qa.php
          tab_page_id="$(docker compose run --rm cli option get budokan_tab_qa_page_id)"
          tab_template="$(docker compose run --rm cli post meta get "$tab_page_id" _wp_page_template)"
          if [[ "$tab_template" != "templates/template-oneColumn.php" ]]; then
            echo "FAIL tab QA page template mismatch: ${tab_template}." >&2
            exit 1
          fi
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run tab interaction browser QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          tab_page_id="$(docker compose run --rm cli option get budokan_tab_qa_page_id)"
          tab_qa_url="${WP_URL}/?page_id=${tab_page_id}"
          cd ../..
          node experiments/wordpress-acf-runtime/scripts/budokan-tab-interaction-browser-qa.mjs "$tab_qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
