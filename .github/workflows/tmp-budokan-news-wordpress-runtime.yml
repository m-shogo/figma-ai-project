name: Temporary Budokan News WordPress Runtime

on:
  push:
    branches:
      - agent/budokan-news-query-context-20260830

jobs:
  wordpress-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/wordpress-acf-runtime
          export COMPOSE_PROJECT_NAME=budokan-news-${GITHUB_RUN_ID}
          export WP_PORT=8099
          export THEME_SLUG=nipponbudokan
          export THEME_SOURCE_DIR="$GITHUB_WORKSPACE/experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan"
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" >> "$GITHUB_ENV"
          echo "WP_PORT=$WP_PORT" >> "$GITHUB_ENV"
          echo "THEME_SLUG=$THEME_SLUG" >> "$GITHUB_ENV"
          echo "THEME_SOURCE_DIR=$THEME_SOURCE_DIR" >> "$GITHUB_ENV"
          docker compose up -d db wordpress
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WP_PORT}/" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose run --rm cli core install \
            --url="http://127.0.0.1:${WP_PORT}" \
            --title="Budokan Runtime" \
            --admin_user=admin \
            --admin_password=runtime-pass \
            --admin_email=admin@example.test \
            --skip-email
          docker compose run --rm cli plugin install advanced-custom-fields --activate
          docker compose run --rm cli theme activate nipponbudokan
          docker compose run --rm cli post delete 1 --force || true

      - name: Verify fixed Page renders custom query posts, not page globals
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/wordpress-acf-runtime
          cat > /tmp/news-query-runtime.php <<'PHP'
          <?php
          $alpha = wp_insert_post([
              'post_type' => 'post',
              'post_status' => 'publish',
              'post_title' => 'News Alpha',
              'post_content' => 'Alpha body',
          ]);
          $beta = wp_insert_post([
              'post_type' => 'post',
              'post_status' => 'publish',
              'post_title' => 'News Beta',
              'post_content' => 'Beta body',
          ]);
          $page_id = wp_insert_post([
              'post_type' => 'page',
              'post_status' => 'publish',
              'post_title' => 'Training Center Page',
              'post_name' => 'training-center-runtime',
          ]);
          if (is_wp_error($alpha) || is_wp_error($beta) || is_wp_error($page_id)) {
              fwrite(STDERR, "fixture creation failed\n");
              exit(1);
          }

          $page_query = new WP_Query(['page_id' => $page_id]);
          $GLOBALS['wp_query'] = $page_query;
          $GLOBALS['posts'] = $page_query->posts;
          $GLOBALS['post'] = $page_query->posts[0];
          setup_postdata($GLOBALS['post']);

          if (!is_page($page_id)) {
              fwrite(STDERR, "runtime is not in fixed Page context\n");
              exit(1);
          }

          ob_start();
          require get_template_directory() . '/acf/blocks/customPostList.php';
          $html = ob_get_clean();

          if (strpos($html, 'News Alpha') === false || strpos($html, 'News Beta') === false) {
              fwrite(STDERR, "custom query news posts missing\n$html\n");
              exit(1);
          }
          if (strpos($html, 'Training Center Page') !== false) {
              fwrite(STDERR, "page global leaked into shared News renderer\n$html\n");
              exit(1);
          }
          if (substr_count($html, 'news_item') < 2) {
              fwrite(STDERR, "expected shared News item markup not found\n$html\n");
              exit(1);
          }

          echo "PASS real WordPress fixed Page query context renders News Alpha/Beta only\n";
          PHP
          docker compose run --rm -v /tmp/news-query-runtime.php:/tmp/news-query-runtime.php:ro cli eval-file /tmp/news-query-runtime.php

      - name: HTTP smoke and cleanup
        if: always()
        shell: bash
        run: |
          cd experiments/wordpress-acf-runtime
          curl -fsS "http://127.0.0.1:${WP_PORT}/" >/dev/null || true
          docker compose down -v --remove-orphans
