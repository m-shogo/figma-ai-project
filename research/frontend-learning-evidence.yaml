          path: scripts/prepare_section_execution.py
          commit: 6df59cd21cd555014a54f1cd8fe292919165a799
          note: PR #204 moved validation to the actual section execution boundary.
        - evidence_id: EV-OBS-COVERAGE-FREEZE
