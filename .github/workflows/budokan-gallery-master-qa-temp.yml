name: Budokan Gallery Master QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - 'experiments/budokan-wordpress/**'
      - '.github/workflows/budokan-gallery-master-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live gallery capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed deterministic Gutenberg gallery page
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          CONTENT='<!-- wp:heading --><h2 class="wp-block-heading">施設写真</h2><!-- /wp:heading --><!-- wp:gallery {"linkTo":"none"} --><figure class="wp-block-gallery has-nested-images columns-default is-cropped"><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真1"/></figure><!-- /wp:image --><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真2"/></figure><!-- /wp:image --><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真3"/></figure><!-- /wp:image --><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真4"/></figure><!-- /wp:image --><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真5"/></figure><!-- /wp:image --><!-- wp:image {"sizeSlug":"large","linkDestination":"none"} --><figure class="wp-block-image size-large"><img src="/wp-content/themes/nipponbudokan/images/top/mv-sample.png" alt="施設写真6"/></figure><!-- /wp:image --></figure><!-- /wp:gallery -->'
          docker compose run --rm cli post delete $(docker compose run --rm cli post list --post_type=page --name=gallery-qa --field=ID 2>/dev/null || true) --force >/dev/null 2>&1 || true
          docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='Gallery QA' --post_name='gallery-qa' --post_content="$CONTENT" >/dev/null

      - name: Capture SP and PC gallery geometry
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-gallery
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewport: { width: 390, height: 1100 }, expectedColumns: 2, expectedGap: 16 },
              { name: 'pc', viewport: { width: 1395, height: 900 }, expectedColumns: 3, expectedGap: 40 },
            ];
            const results = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: item.viewport });
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(e.message));
              const response = await page.goto(`${process.env.WP_URL}/gallery-qa/`, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const gallery = page.locator('.block-editor_wrap .wp-block-gallery').first();
              await gallery.scrollIntoViewIfNeeded();
              await page.waitForTimeout(100);

              const metrics = await gallery.evaluate(el => {
                const style = getComputedStyle(el);
                const figures = [...el.querySelectorAll(':scope > figure.wp-block-image')];
                const rects = figures.map(figure => {
                  const r = figure.getBoundingClientRect();
                  const img = figure.querySelector('img');
                  const ir = img ? img.getBoundingClientRect() : null;
                  return { width: r.width, height: r.height, imageWidth: ir?.width || 0, imageHeight: ir?.height || 0 };
                });
                const columns = style.gridTemplateColumns.split(' ').filter(Boolean).length;
                const gap = parseFloat(style.columnGap || style.gap || '0');
                return {
                  columns,
                  gap,
                  itemCount: figures.length,
                  rects,
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                };
              });

              const status = response?.status() || 0;
              const horizontalOverflow = metrics.scrollWidth > metrics.clientWidth + 1;
              const ratiosOkay = metrics.rects.every(r => r.imageWidth > 0 && r.imageHeight > 0 && Math.abs((r.imageWidth / r.imageHeight) - 1.5) < 0.03);
              if (status >= 400 || pageErrors.length || horizontalOverflow || metrics.itemCount !== 6 || metrics.columns !== item.expectedColumns || Math.abs(metrics.gap - item.expectedGap) > 0.5 || !ratiosOkay) failed = true;

              await gallery.screenshot({ path: `.runtime/budokan-gallery/${item.name}-gallery.png` });
              results.push({ name: item.name, status, pageErrors, horizontalOverflow, ratiosOkay, metrics });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-gallery/runtime.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-gallery-master-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-gallery
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
