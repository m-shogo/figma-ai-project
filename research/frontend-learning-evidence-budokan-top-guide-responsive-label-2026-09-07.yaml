    summary: >-
      When one semantic label is shared across responsive breakpoints but the current Figma authority intentionally varies presentation casing, preserve one DOM/accessibility text owner and project only the proven visual difference in CSS. Lock both the semantic text and computed presentation in real runtime QA so a visual fix does not fork content ownership.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - Budokan TOP Guide uses one shared semantic DOM label across SP and PC.
        - Current authoritative Figma independently establishes SP `User Guide` and PC `User guide` presentation.
        - The casing difference can be represented without changing markup, content ownership, ACF, or WordPress menu ownership.
        - Disposable WordPress plus Playwright can assert both DOM text and breakpoint-specific computed style.
      exclusions:
        - Do not change semantic DOM text separately per breakpoint merely to match visual casing.
        - Do not use text-transform when current Figma does not prove a breakpoint-specific presentation difference.
        - Do not generalize this Budokan-only finding without independent evidence.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        PR #461 re-fetched current TOP Guide SP 1455:5672 and PC 1603:7370, preserved shared DOM text `User guide`, projected only the SP visual capitalization through CSS, and explicitly reset PC presentation. Budokan TOP Guide Runtime run 34050067294 passed disposable WordPress setup, SP/PC Playwright geometry and typography checks, responsive label casing assertions, purpose-terminal interaction QA, and cleanup. REF001 remains separately blocked at its audit-evidence upload step, so this implementation is intentionally not merged here.
