name: Budokan Anchor Sticky Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/common.js'
      - 'experiments/wordpress-acf-runtime/scripts/seed-budokan-content-interaction-qa.php'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-runtime-qa.sh'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-anchor-sticky-browser-qa.mjs'
      - '.github/workflows/budokan-anchor-sticky-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress normal-page content runtime QA
        env:
          BUDOKAN_CONTENT_INTERACTION_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-content-interaction-runtime-qa.sh

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve anchor interaction QA URL
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          page_id="$(docker compose run --rm cli option get budokan_content_interaction_qa_page_id)"
          echo "BUDOKAN_ANCHOR_QA_URL=${WP_URL}/?page_id=${page_id}" >> "$GITHUB_ENV"

      - name: Audit PC initial hash stability
        run: node experiments/wordpress-acf-runtime/scripts/budokan-anchor-sticky-browser-qa.mjs "$BUDOKAN_ANCHOR_QA_URL" initial pc

      - name: Audit SP initial hash stability
        run: node experiments/wordpress-acf-runtime/scripts/budokan-anchor-sticky-browser-qa.mjs "$BUDOKAN_ANCHOR_QA_URL" initial sp

      - name: Audit PC repeated anchor stability
        run: node experiments/wordpress-acf-runtime/scripts/budokan-anchor-sticky-browser-qa.mjs "$BUDOKAN_ANCHOR_QA_URL" repeat pc

      - name: Audit SP repeated anchor stability
        run: node experiments/wordpress-acf-runtime/scripts/budokan-anchor-sticky-browser-qa.mjs "$BUDOKAN_ANCHOR_QA_URL" repeat sp

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
