schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

# This is an evidence index, not a runtime policy source.
# Keep observations, successes, failures, and counterexamples queryable here.
# Promotion into canonical frontend policy remains a separate reviewed action.
records:
  - learning_id: OBS-REF001-DECORATIVE-EXACT-SOURCE
    summary: Exact Figma decorative vectors combined with live text can be a better implementation mechanism than CSS-only reconstruction when the exact source exists.
    category: ASSET_STRATEGY
    applicability:
      scope: REFERENCE
      conditions:
        - Figma exposes an exact decorative vector or rendered asset whose geometry is part of visual truth.
        - Text or editor-owned content remains separately live where appropriate.
      exclusions:
        - Do not flatten live content into an image merely to simplify implementation.
    promotion_state: null
    promotion:
      candidate: false
      rationale: Single-reference observation only.
      blocked_by:
        - Dedicated clean replay on an independent design.
        - Evidence that exact-source reuse reduces repair cost without harming editability.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-REF001-DECORATIVE-RESEARCH
          kind: LOCAL_RESEARCH
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: research/ref001-v2-v3-frontend-learning-2026-08-20.md
          commit: ''
          note: Student Voice structured-context observation records exact SVG decoration with live text.
        - evidence_id: EV-REF001-DECORATIVE-COOKBOOK
          kind: CANONICAL_DOC
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: docs/frontend-decorative-pattern-cookbook.md
          commit: ''
          note: Existing mechanism-selection guidance keeps exact-source reuse as an evidence-based option rather than a blanket rule.
      contradicts: []
    notes:
      - Preserve as observation until a distinct reference reproduces the benefit.

  - learning_id: OBS-REF001-VISUAL-REPAIR-OWNERSHIP
    summary: V2-level visual close-out is easier to maintain when repairs return to the canonical section or shared owner instead of accumulating chronology-based repair layers.
    category: MAINTAINABILITY
    applicability:
      scope: REFERENCE
      conditions:
        - A visual defect has a discoverable canonical owner.
        - A temporary diagnostic patch can be removed after root-cause repair.
      exclusions:
        - Multiple CSS files are not a failure when they represent stable ownership boundaries.
    promotion_state: null
    promotion:
      candidate: false
      rationale: REF-001 comparison supports the direction but Human Correction Cost is not yet measured across designs.
      blocked_by:
        - Independent-design replay with repair-round and change-locality evidence.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-REF001-REPAIR-OWNERSHIP-RESEARCH
          kind: LOCAL_RESEARCH
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: research/ref001-v2-v3-frontend-learning-2026-08-20.md
          commit: ''
          note: V2/V3 comparison identifies repair-layer archaeology versus section-local ownership.
        - evidence_id: EV-REF001-REPAIR-LOOP-DOC
          kind: CANONICAL_DOC
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: docs/frontend-visual-repair-learning-loop.md
          commit: ''
          note: Existing learning loop requires root-cause repair and clean replay before promotion.
      contradicts: []
    notes:
      - This is not a ban on override files or multiple stylesheets.

  - learning_id: OBS-REF001-FIGMA-PROVENANCE
    summary: Section and asset mappings back to current Figma node evidence reduce rediscovery and help prevent stale source identity from being mistaken for current implementation authority.
    category: FIGMA_PROVENANCE
    applicability:
      scope: CROSS_REFERENCE
      conditions:
        - Figma is an implementation authority and source node/file identity can be recorded and re-resolved.
        - Audits, handoffs, or implementation records may outlive a Figma file or node revision.
      exclusions:
        - Do not invent mappings when the current Figma capability cannot prove them.
        - Historical node lineage may remain useful evidence but must not be silently promoted to current authority.
    promotion_state: CANDIDATE
    promotion:
      candidate: true
      rationale: >-
        REF-001 showed that explicit section/asset provenance made source mismatch easier to diagnose.
        Budokan independently reproduced the failure boundary when a dependency audit still named an old
        Figma file as canonical and treated old mobile evidence too strongly; a live current-file re-scan
        corrected the audit before new implementation was built from stale evidence. This is enough for a
        cross-reference candidate, but not yet for ACTIVE because measured repair-cost reduction is limited.
      blocked_by:
        - Measure rediscovery/rework reduction on another implementation or clean replay that consumes the candidate prospectively.
        - Confirm the rule remains lightweight when Figma authority changes frequently or node IDs are intentionally unstable.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-REF001-PROVENANCE-RESEARCH
          kind: LOCAL_RESEARCH
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: research/ref001-v2-v3-frontend-learning-2026-08-20.md
          commit: ''
          note: V3 section and asset-slot mapping was materially easier to navigate than weaker historical provenance.
        - evidence_id: EV-REF001-STRUCTURE-PROFILE
          kind: LOCAL_RESEARCH
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: references/chiba-keizai-sample.structure-profile.yaml
          commit: ''
          note: Current structured evidence keeps Figma section identity externalized instead of relying on memory.
        - evidence_id: EV-BUDOKAN-PARTS-AUTHORITY-REFRESH-20260902
          kind: CANONICAL_DOC
          reference_id: BUDOKAN-WORDPRESS
          run_id: ''
          path: experiments/budokan-wordpress/PARTS_REMAINING_DEPENDENCY_AUDIT.md
          commit: ''
          note: >-
            Budokan independently exposed stale provenance: the audit still named the superseded w7SG Figma
            file as canonical and overstated old SP Local Navigation parity. Live retrieval from current
            fKYDn9ikpJk1nW7IWFtaUx verified the surviving Slider nodes and the audit was corrected before
            implementation continued.
        - evidence_id: EV-BUDOKAN-PARTS-RESOLUTION-LIVE-REFRESH-20260902
          kind: LOCAL_RESEARCH
          reference_id: BUDOKAN-WORDPRESS
          run_id: ''
          path: experiments/ref002-budokan-wordpress/figma-parts-resolution.yaml
          commit: ''
          note: >-
            A second stale authority surface was found after the canonical audit had already been corrected:
            the structured Parts resolution still named an older Figma file and initial-intake blockers such as
            an unobserved Theme/runtime. Current Figma nodes were re-resolved, historical keys were retained as
            lineage, and unresolved Slider/Local Nav/Search/Calendar ownership stayed fail-closed instead of
            converting stale metadata into implementation authority.
      contradicts: []
    notes:
      - Candidate means re-resolve current authority at decision boundaries; it does not require deleting historical lineage.
      - Keep current-file/page verification separate from assuming every saved node ID remains valid forever.
      - Multiple Budokan evidence items still count as one supporting reference; this refresh does not justify ACTIVE promotion by itself.

  - learning_id: OBS-REF001-OBSERVATION-COVERAGE-LINEAGE
    summary: Externalizing a small fixed set of source-observation classes and pinning that evidence through execution boundaries reduces the chance that an agent silently forgets visible media, decoration, responsive variants, or states.
    category: OBSERVATION_COVERAGE
    applicability:
      scope: REFERENCE
      conditions:
        - Figma is a visual authority and implementation proceeds section-by-section.
        - Source observation must remain distinguishable from browser runtime review.
      exclusions:
        - Observation Coverage does not replace visual diff, browser QA, or structured Figma inspection.
    promotion_state: null
    promotion:
      candidate: true
      rationale: REF-001 now has schema, execution-boundary, First Pass lineage, active-run, and Clean Replay distribution proof, but not a genuinely distinct design replay.
      blocked_by:
        - REF-003 or another independent design proving lower omission/rework without excessive bookkeeping.
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-OBS-COVERAGE-DOC
          kind: CANONICAL_DOC
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: docs/frontend-observation-coverage.md
          commit: ''
          note: Defines the seven coarse source classes and separates source observation from runtime review.
        - evidence_id: EV-OBS-COVERAGE-SCHEMA
          kind: COMMIT
          reference_id: REF-001-CHIBA-KEIZAI-SAMPLE
          run_id: ''
          path: schemas/section.schema.json
          commit: 974ca089cd6d57f8954a119e052aa6cc4dd65918
          note: PR #203 introduced schema-v9 Observation Coverage.
        - evidence_id: EV-OBS-COVERAGE-EXECUTION
