name: Budokan TOP Body Interaction Runtime

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/front-page.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/footer.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_mainVisual.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_news.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_partner.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_banner.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_guide.css'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/js/common.js'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-top-fv-runtime-qa.sh'
      - 'experiments/wordpress-acf-runtime/scripts/budokan-top-body-interaction-browser-qa.mjs'
      - '.github/workflows/budokan-top-body-interaction-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress TOP runtime QA
        env:
          BUDOKAN_TOP_FV_KEEP_RUNTIME: '1'
        run: bash experiments/wordpress-acf-runtime/scripts/budokan-top-fv-runtime-qa.sh

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run TOP body interaction stability QA
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/"
          cd ../..
          node experiments/wordpress-acf-runtime/scripts/budokan-top-body-interaction-browser-qa.mjs "$qa_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd experiments/wordpress-acf-runtime
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
