name: REF001 Materialize Shared CTA Source

on:
  push:
    branches:
      - agent/ref001-v2-visual-completion
    paths:
      - .github/workflows/ref001-materialize-shared-cta-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ref001-v2-visual-completion
          fetch-depth: 1

      - name: Materialize exact WordPress source by Figma SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          TARGET_SHA = 'e95de3af2e6c761a277471db42344c0d3ef0a61b6700fa2a14be1d157855020e'
          TARGET_BYTES = 2066644
          BASE = 'https://www.cku.ac.jp/'
          API = urllib.parse.urljoin(BASE, 'wp-json/wp/v2/media')
          OUT = pathlib.Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/images/ref001/backgrounds/shared-cta-campus-source.jpg')
          UA = 'Mozilla/5.0 REF001-Figma-source-verifier/1.0'

          def fetch(url):
              absolute = urllib.parse.urljoin(BASE, url)
              req = urllib.request.Request(absolute, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read(), absolute

          query = API + '?' + urllib.parse.urlencode({'search': 'acces', 'per_page': 100, 'media_type': 'image'})
          raw, _ = fetch(query)
          items = json.loads(raw.decode('utf-8'))
          if not items:
              raise SystemExit('WordPress media search for acces returned no items')

          for item in items:
              details = item.get('media_details') or {}
              urls = []
              source = item.get('source_url') or ''
              if source:
                  urls.append(source)
              original = details.get('original_image')
              if original and source:
                  source_abs = urllib.parse.urljoin(BASE, source)
                  urls.append(urllib.parse.urljoin(source_abs, original))
              for size in (details.get('sizes') or {}).values():
                  if isinstance(size, dict) and size.get('source_url'):
                      urls.append(size['source_url'])

              print('candidate id=', item.get('id'), 'slug=', item.get('slug'), 'reported=', details.get('width'), 'x', details.get('height'))
              seen = set()
              for candidate in urls:
                  absolute = urllib.parse.urljoin(BASE, candidate)
                  if absolute in seen:
                      continue
                  seen.add(absolute)
                  try:
                      data, absolute = fetch(absolute)
                  except Exception as exc:
                      print('skip', absolute, exc)
                      continue
                  digest = hashlib.sha256(data).hexdigest()
                  print('fetched', len(data), digest, absolute)
                  if digest == TARGET_SHA:
                      if len(data) != TARGET_BYTES:
                          raise SystemExit('SHA matched but byte length unexpectedly differs')
                      OUT.parent.mkdir(parents=True, exist_ok=True)
                      OUT.write_bytes(data)
                      print('MATCH', absolute)
                      raise SystemExit(0)

          raise SystemExit('acces media was found, but no candidate matched the exact Figma SHA-256')
          PY

      - name: Commit exact source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/ref001-blind-clean-20260812/implementation/theme/assets/images/ref001/backgrounds/shared-cta-campus-source.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: materialize exact shared CTA campus source"
          git push origin HEAD:agent/ref001-v2-visual-completion
