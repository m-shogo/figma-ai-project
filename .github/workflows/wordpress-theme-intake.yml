name: WordPress supplied-theme intake

on:
  push:
    paths:
      - "schemas/wordpress-theme-intake.schema.json"
      - "scripts/validate_wordpress_theme_intake.py"
      - "tests/test_validate_wordpress_theme_intake.py"
      - "experiments/**/theme-intake.yaml"
      - "docs/wordpress-theme-intake.md"
      - ".github/workflows/wordpress-theme-intake.yml"
  pull_request:
    paths:
      - "schemas/wordpress-theme-intake.schema.json"
      - "scripts/validate_wordpress_theme_intake.py"
      - "tests/test_validate_wordpress_theme_intake.py"
      - "experiments/**/theme-intake.yaml"
      - "docs/wordpress-theme-intake.md"
      - ".github/workflows/wordpress-theme-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate supplied-theme intake records
        run: python scripts/validate_wordpress_theme_intake.py

      - name: Test intake contract guards
        run: python -m unittest -v tests.test_validate_wordpress_theme_intake

      - name: Reject persisted Figma MCP asset URLs
        run: python scripts/validate_no_figma_mcp_asset_urls.py

      - name: Reject duplicate YAML mapping keys
        run: python scripts/validate_yaml_duplicates.py

      - name: Prove the intake gate is fail-closed before a theme is observed
        run: |
          python - <<'PY'
          import json, tempfile, yaml
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import validate_wordpress_theme_intake as v

          record = Path('experiments/ref002-budokan-wordpress/theme-intake.yaml')
          schema = json.loads(v.SCHEMA_PATH.read_text(encoding='utf-8'))
          assert v.validate_record(record, schema) == [], 'canonical record must pass'

          data = yaml.safe_load(record.read_text(encoding='utf-8'))
          assert data['status'] == 'AWAITING_THEME'
          assert data['theme_delivery']['state'] == 'NOT_SUPPLIED'
          assert data['freeze']['ready'] is False

          # Inventing a production theme path before the theme is observed must fail.
          data['template_coverage'][0]['target_path'] = 'front-page.php'
          with tempfile.TemporaryDirectory() as tmp:
              probe = Path(tmp) / v.RECORD_NAME
              probe.write_text(yaml.safe_dump(data, allow_unicode=True, sort_keys=False), encoding='utf-8')
              errors = v.validate_record(probe, schema)
          assert any('target_path must stay empty' in error for error in errors), errors
          print('fail-closed intake gate verified')
          PY

      - name: ACF PRO license key must never be committed
        run: |
          if grep -R -n -E 'ACF_PRO_LICENSE_KEY[[:space:]]*[:=][[:space:]]*[^[:space:]"'"'"']' \
            --include='*.yaml' --include='*.yml' --include='*.json' --include='*.md' \
            experiments/ref002-budokan-wordpress docs/wordpress-theme-intake.md; then
            echo 'ACF_PRO_LICENSE_KEY value must not be committed.'
            exit 1
          fi
