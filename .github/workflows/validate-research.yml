name: Validate research records

on:
  push:
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "policies/**/*.yaml"
      - "implementation-profiles/**/*.yaml"
      - "references/**/*.yaml"
      - "references/**/*.json"
      - "experiments/**/*.yaml"
      - "experiments/**/*.json"
      - "experiments/ref001-wordpress-acf/fixture-theme/**"
      - "contracts/**/*.yaml"
      - "contracts/**/*.json"
      - "research/**/*.yaml"
      - "docs/human-editability.md"
      - "requirements-dev.txt"
      - ".github/workflows/validate-research.yml"
      - ".github/workflows/update-radar.yml"
  pull_request:
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "policies/**/*.yaml"
      - "implementation-profiles/**/*.yaml"
      - "references/**/*.yaml"
      - "references/**/*.json"
      - "experiments/**/*.yaml"
      - "experiments/**/*.json"
      - "experiments/ref001-wordpress-acf/fixture-theme/**"
      - "contracts/**/*.yaml"
      - "contracts/**/*.json"
      - "research/**/*.yaml"
      - "docs/human-editability.md"
      - "requirements-dev.txt"
      - ".github/workflows/validate-research.yml"
      - ".github/workflows/update-radar.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject persisted Figma MCP asset URLs
        run: python scripts/validate_no_figma_mcp_asset_urls.py

      - name: Validate persisted Figma asset manifests
        run: python scripts/validate_asset_manifests.py

      - name: Reject duplicate YAML mapping keys
        run: python scripts/validate_yaml_duplicates.py

      - name: Validate official Update Radar source registry
        run: python scripts/validate_update_sources.py

      - name: Validate implementation target profiles and Shared Contract binding
        run: python scripts/validate_implementation_profile.py

      - name: Validate ACF export artifacts
        run: python scripts/validate_acf_export.py

      - name: Check deterministic REF-001 ACF import bundle
        run: python scripts/build_ref001_acf_import_bundle.py --check

      - name: Validate REF-001 WordPress learning fixture
        run: python scripts/validate_wordpress_learning_fixture.py

      - name: Validate implementation profile pins on active runs
        run: python scripts/validate_run_implementation_profile.py

      - name: Validate reference, shared, section, and run records
        run: python scripts/validate_records.py

      - name: Validate Human Editability contract and run evidence
        run: python scripts/validate_human_editability.py

      - name: Validate company implementation policy and frozen lineage
        run: python scripts/validate_company_policy.py

      - name: Validate resolved device/browser environment contract
        run: python scripts/validate_environment_contract.py

      - name: Validate actual Figma capability profile before contract freeze
        run: python scripts/validate_figma_profile.py

      - name: Audit responsive Figma Variable Mode inheritance
        run: python scripts/audit_figma_variable_modes.py

      - name: Validate per-section Figma structure profiles
        run: python scripts/validate_figma_structure_profiles.py

      - name: Validate per-section Figma structure profile lineage
        run: python scripts/validate_figma_structure_profile.py

      - name: Validate component and token resolution tables
        run: python scripts/validate_resolution_tables.py

      - name: Validate frozen breakpoint contract semantics
        run: python scripts/validate_breakpoint_contract.py

      - name: Validate section discovery evidence and mapping confidence
        run: python scripts/validate_section_discovery.py

      - name: Validate parallel section write isolation and dependencies
        run: python scripts/validate_parallel_paths.py

      - name: Validate parallel worker git and sandbox isolation
        run: python scripts/validate_parallel_isolation.py

      - name: Validate sanitized REF-001 clean-run workspace selection
        run: python scripts/build_sanitized_run_workspace.py validate experiments/ref001-clean-run/workspace.yaml

      - name: Validate immutable run evidence lineage
        run: python scripts/validate_run_lineage.py

      - name: Validate existing immutable FIRST PASS evidence snapshots
        run: python scripts/first_pass_evidence.py validate

      - name: Validate existing clean replay pair comparability
        run: python scripts/prepare_clean_replay.py validate

      - name: Validate capture environment lineage and required coverage
        run: python scripts/validate_capture_environment.py

      - name: Validate completed implementation deliverables
        run: python scripts/validate_run_deliverables.py

      - name: Validate WordPress supplied-theme intake records
        run: python scripts/validate_wordpress_theme_intake.py

      - name: Test section execution planner and validators
        run: python -m unittest discover -s tests -p 'test_*.py'
