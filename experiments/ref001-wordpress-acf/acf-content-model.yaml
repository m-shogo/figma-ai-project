      - "parentheses and heading typography"
      - "PC horizontal / SP vertical layout"
      - "card image masks/crops and spacing"

prototype_delivery:
  acf_export_path: "experiments/ref001-wordpress-acf/artifacts/acf-export.json"
  template_location_placeholder: "page-templates/template-ref001.php"
  warning: "The prototype JSON is intentionally not a frozen production field group. Its template filename and final field ownership must be reconciled with the actual target theme repository."

learning_notes:
  - "CMS flexibility is a product/editorial requirement, not something that can be inferred from visual repetition alone."
  - "Responsive variants can share one media field even when crop geometry differs substantially."
  - "Art-directed text is not automatically a CMS field just because it is text in Figma."
  - "Global/shared Figma components should trigger target-code reconnaissance before page-level ACF field creation."
