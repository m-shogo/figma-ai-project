name: Budokan TOP Instagram QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-top-instagram-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live Budokan capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Capture TOP Instagram SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-top-instagram
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewportWidth: 390, contentWidth: 375, height: 900 },
              { name: 'pc', viewportWidth: 1395, contentWidth: 1380, height: 900 },
            ];
            const results = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.viewportWidth, height: item.height } });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));

              const response = await page.goto(process.env.WP_URL, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              await page.locator('#top_instagram-01').scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const visibleImages = [...document.querySelectorAll('#top_instagram-01 .ti_thumbnail')]
                  .filter(el => getComputedStyle(el).display !== 'none')
                  .map(el => el.querySelector('img'))
                  .filter(Boolean);
                return visibleImages.length > 0 && visibleImages.every(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
              });

              const metrics = await page.evaluate(() => {
                const rect = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { x: r.x, y: r.y, width: r.width, height: r.height };
                };
                const tiles = [...document.querySelectorAll('#top_instagram-01 .ti_thumbnail')];
                const visibleTiles = tiles.filter(el => getComputedStyle(el).display !== 'none');
                const images = [...document.querySelectorAll('#top_instagram-01 img')];
                const visibleImages = visibleTiles.map(el => el.querySelector('img')).filter(Boolean);
                return {
                  section: rect('#top_instagram-01'),
                  inner: rect('#top_instagram-01 .ti_inner'),
                  head: rect('#top_instagram-01 .ti_head'),
                  titleGroup: rect('#top_instagram-01 .ti_titleGroup'),
                  lead: rect('#top_instagram-01 .ti_lead'),
                  thumbnails: rect('#top_instagram-01 .ti_thumbnails'),
                  firstTile: rect('#top_instagram-01 .ti_thumbnail'),
                  itemCount: tiles.length,
                  visibleItemCount: visibleTiles.length,
                  imageCount: images.length,
                  visibleImageCount: visibleImages.length,
                  brokenVisibleImageCount: visibleImages.filter(img => !img.complete || img.naturalWidth === 0 || img.naturalHeight === 0).length,
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                };
              });

              const status = response?.status() || 0;
              const horizontalOverflow = metrics.scrollWidth > metrics.clientWidth + 1;
              if (status >= 400 || pageErrors.length || horizontalOverflow) failed = true;
              if (metrics.itemCount !== 5 || metrics.imageCount !== 5 || metrics.brokenVisibleImageCount !== 0) failed = true;

              if (item.name === 'sp') {
                if (metrics.visibleItemCount !== 4 || metrics.visibleImageCount !== 4) failed = true;
                if (!metrics.section || Math.abs(metrics.section.width - item.contentWidth) > 1 || Math.abs(metrics.section.height - 683.75) > 3) failed = true;
                if (!metrics.inner || Math.abs(metrics.inner.x - 32) > 1 || Math.abs(metrics.inner.width - 311) > 1) failed = true;
                if (!metrics.thumbnails || Math.abs(metrics.thumbnails.width - 311) > 1 || Math.abs(metrics.thumbnails.height - 389.75) > 3) failed = true;
                if (!metrics.firstTile || Math.abs(metrics.firstTile.width - 155) > 2 || Math.abs(metrics.firstTile.height - 194) > 2) failed = true;
              } else {
                if (metrics.visibleItemCount !== 5 || metrics.visibleImageCount !== 5) failed = true;
                if (!metrics.section || Math.abs(metrics.section.width - item.contentWidth) > 1 || Math.abs(metrics.section.height - 571) > 3) failed = true;
                if (!metrics.inner || Math.abs(metrics.inner.x - 110) > 2 || Math.abs(metrics.inner.width - 1160) > 2) failed = true;
                if (!metrics.head || Math.abs(metrics.head.width - 1160) > 2 || Math.abs(metrics.head.height - 62) > 3) failed = true;
                if (!metrics.thumbnails || Math.abs(metrics.thumbnails.width - 1160) > 2 || Math.abs(metrics.thumbnails.height - 289) > 2) failed = true;
                if (!metrics.firstTile || Math.abs(metrics.firstTile.width - 231) > 1 || Math.abs(metrics.firstTile.height - 289) > 1) failed = true;
              }

              await page.locator('#top_instagram-01').screenshot({ path: `.runtime/budokan-top-instagram/${item.name}-instagram.png` });
              results.push({ viewport: item, status, pageErrors, horizontalOverflow, metrics });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-top-instagram/runtime.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-top-instagram-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-top-instagram
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
