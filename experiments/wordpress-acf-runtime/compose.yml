name: ${COMPOSE_PROJECT_NAME:-figma-ai-wordpress-acf-runtime}

services:
  db:
    image: mariadb:11.4.12
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-wordpress-fixture-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    volumes:
      - wp_data:/var/www/html
      - ${THEME_SOURCE_DIR:-./theme/sample-theme}:/var/www/html/wp-content/themes/${THEME_SLUG:-sample-theme}:ro
      - ./:/fixture:ro
      - ./php/conf.d/99-local-limits.ini:/usr/local/etc/php/conf.d/99-local-limits.ini:ro
      - ./wp-dropins/fatal-error-handler.php:/var/www/html/wp-content/fatal-error-handler.php:ro
      - ./wp-dropins/local-runtime-recover.php:/var/www/html/wp-content/local-runtime-recover.php:ro
      - ./mu-plugins/00-local-runtime-guard.php:/var/www/html/wp-content/mu-plugins/00-local-runtime-guard.php:ro

  cli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
    volumes:
      - wp_data:/var/www/html
      - ${THEME_SOURCE_DIR:-./theme/sample-theme}:/var/www/html/wp-content/themes/${THEME_SLUG:-sample-theme}:ro
      - ./:/fixture:ro
      - ./php/conf.d/99-local-limits.ini:/usr/local/etc/php/conf.d/99-local-limits.ini:ro
      - ./wp-dropins/fatal-error-handler.php:/var/www/html/wp-content/fatal-error-handler.php:ro
      - ./wp-dropins/local-runtime-recover.php:/var/www/html/wp-content/local-runtime-recover.php:ro
      - ./mu-plugins/00-local-runtime-guard.php:/var/www/html/wp-content/mu-plugins/00-local-runtime-guard.php:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
