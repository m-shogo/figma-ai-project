name: Budokan News Single Runtime

on:
  pull_request:
    paths:
      - 'projects/nipponbudokan/theme/single.php'
      - 'projects/nipponbudokan/theme/css/module/module_titleSingle.css'
      - 'projects/nipponbudokan/theme/css/module/module_pager-02.css'
      - 'projects/nipponbudokan/theme/css/module/module_breadCrumb.css'
      - 'projects/nipponbudokan/qa/budokan-news-single-runtime-qa.sh'
      - 'projects/nipponbudokan/qa/budokan-news-single-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-news-single-rhythm-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-news-single-interaction-browser-qa.mjs'
      - 'projects/nipponbudokan/qa/budokan-event-single-interaction-browser-qa.mjs'
      - 'projects/nipponbudokan/docs/learning-notes/2026-08-31-detail-return-pager-master.md'
      - 'projects/nipponbudokan/docs/learning-notes/2026-08-31-breadcrumb-responsive-master.md'
      - '.github/workflows/budokan-news-single-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: nipponbudokan
  COMPOSE_PROJECT_NAME: nipponbudokan-qa
  WP_PORT: '27248'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable WordPress News single runtime QA
        env:
          BUDOKAN_NEWS_SINGLE_KEEP_RUNTIME: '1'
        run: bash projects/nipponbudokan/qa/budokan-news-single-runtime-qa.sh

      - name: Run SP and PC detail pager and breadcrumb browser geometry QA
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          qa_url="${WP_URL}/budokan-news-single-qa/"
          event_qa_id="$(docker compose run --rm cli post list --post_type=event --name=budokan-event-single-qa --field=ID --format=ids)"
          test -n "$event_qa_id"
          event_qa_url="$(docker compose run --rm cli post url "$event_qa_id")"
          event_archive_url="$(docker compose run --rm cli eval 'echo get_post_type_archive_link("event");')"
          test -n "$event_qa_url"
          test -n "$event_archive_url"
          cd ../..
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          node projects/nipponbudokan/qa/budokan-news-single-browser-qa.mjs "$qa_url"
          node projects/nipponbudokan/qa/budokan-news-single-rhythm-browser-qa.mjs "$qa_url"
          node projects/nipponbudokan/qa/budokan-news-single-interaction-browser-qa.mjs "$qa_url"
          node projects/nipponbudokan/qa/budokan-event-single-interaction-browser-qa.mjs "$event_qa_url" "$event_archive_url"

      - name: Cleanup disposable WordPress runtime
        if: always()
        run: |
          cd runtime/wordpress
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans
