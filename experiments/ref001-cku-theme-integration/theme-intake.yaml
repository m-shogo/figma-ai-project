# NOTE: the supplied production theme (cku, real 千葉経済大学 site theme) is a
# client-owned codebase. Per experiments/wordpress-acf-pro-standalone-lp/README.md
# ("a client theme must never be committed to this repository"), the theme's own
# source files are intentionally NOT committed here. They were unzipped from the
# untracked repo-root `cku.zip` into a local scratch directory, observed with
# scripts/scan_wordpress_target.py, and are hosted locally (or in CI) via the
# standalone-lp harness's theme-dropin/ mechanism. This record freezes the
# INTEGRATION DECISIONS made against that observation; `overlay/` in this
# directory holds only the new/added files this project contributes on top of
# the supplied theme.
theme_delivery:
  state: OBSERVED
  supplied_by: "repo root untracked cku.zip (~26MB), provided out-of-band by the human operator"
  repository: "N/A (zip export, not a git repository)"
  starting_commit: "n/a-zip-export (cku.zip has no git history; theme observed as a flat filesystem snapshot)"
  theme_slug: cku
  theme_family: CLASSIC_THEME
  family_is_inference: true
  scan_report_path: "N/A - scan run from a local scratch unzip location, not committed to the repo (see notes above); reproducible via: unzip cku.zip -d <scratch>; python3 scripts/scan_wordpress_target.py <scratch>/cku"
  observation:
    - id: theme_family
      status: OBSERVED
      evidence:
        - "cku/footer.php, cku/functions.php, cku/header.php, cku/index.php present; no theme.json"
      notes:
        - "family_is_inference: true is preserved (scan tool inference, not a company authorization)"
    - id: theme_json
      status: NONE
      evidence:
        - "no cku/theme.json in the unzipped export"
      notes: []
    - id: template_inventory
      status: OBSERVED
      evidence:
        - "cku/front-page.php, page.php, page-form.php, page-library.php, page-library_top.php, page-oneColumn.php, page-oneColumnWide.php, original-opencampus.php, single.php, single-staff.php, archive.php, archive-library_news.php, category.php, taxonomy-library_news_cat.php, search.php, search-library.php, 404.php all present"
      notes:
        - "page-*.php carry `Template Name:` PHP headers (classic page-template convention)"
    - id: template_parts
      status: OBSERVED
      evidence:
        - "cku/_includes/_body_header.php, _body_footer.php, _body_js.php, _head_css.php, _head_js.php, _head_meta.php, _library_*.php, _main_module.php, _side_navigation.php"
        - "flat root-level reusable partials loaded via get_template_part(), e.g. front-page.php calls get_template_part('list','news02') -> list-news02.php"
      notes:
        - "cku has no template-parts/ subdirectory convention of its own; get_template_part() slugs resolve theme-root-relative and support subdirectories, which this project uses to namespace new files (template-parts/ref001/*) without touching theme-root file names"
    - id: global_header_footer
      status: OBSERVED
      evidence:
        - "header.php / footer.php call get_header()/get_footer() across every discovered template; _includes/_body_header.php and _body_footer.php hold the actual header/footer body markup"
      notes:
        - "Header/Footer ownership stays THEME; REF-001 integration does not touch header.php/footer.php/_includes/_body_header.php/_includes/_body_footer.php"
    - id: style_architecture
      status: OBSERVED
      evidence:
        - "cku/css/style.scss compiled to css/style.css (+ .map); base/_reset.scss, base/_normalize.scss, global/_index.scss, layout/_layout.scss, module/_module.scss, wordpress/_wordpress.scss"
        - "cku/style.css (WP theme header stylesheet) is separate from css/style.css (compiled SCSS bundle) and is only loaded for the required WP `Theme Name:` header block, per functions.php enqueue (`new EnqueueStyle('css-style', get_stylesheet_uri(), ...)`)"
      notes:
        - "REF-001's already-frozen assets/css/ref001.css is NOT merged into this SCSS pipeline; it is enqueued standalone, scoped to the new page template only, to avoid recompiling/duplicating the theme's SCSS build (see content_decisions notes)"
    - id: js_architecture
      status: OBSERVED
      evidence:
        - "cku/functions/EnqueueScript.php defines a small wp_enqueue_script wrapper class with an optional conditional-load closure; functions.php registers common.js, home.js (front-page only), form.js (page-form.php only), staff.js (staff archive only), plus CDN swiper-bundle@8 (unconditional, global) and modaal/dualtab/scroll-hint"
      notes:
        - "REF-001's assets/js/ref001-interactions.js self-guards its own Swiper CDN loader with `if (window.Swiper) return Promise.resolve(window.Swiper)`, so it reuses the theme's already-enqueued Swiper 8 global instead of loading Swiper 11 a second time -> no duplicate Swiper enqueue"
    - id: breakpoints
      status: OBSERVED
      evidence:
        - "cku/css/global/functions/_functions.scss defines $breakpoint-2column: calc(#{$width-base-twoColumn} + #{$padding-TB * 2}) (derived, not a bare px literal); breakPoint_original-min() mixin used across layout/_layout.scss"
      notes:
        - "REF-001's own CSS is untouched and keeps its Human-Reviewed <=767 / >=768 breakpoint authority internally; this integration does not add a third breakpoint system or touch cku's SCSS breakpoint variables"
    - id: naming_convention
      status: OBSERVED
      evidence:
        - "cku uses snake_case/prefix classes: top_*, module_*, global_*, gc_*, plus underscore-prefixed state modifiers (_disabled, _center, _white, _column, _oneColumn)"
      notes:
        - "REF-001's own ref- / ref001- prefixed BEM-ish classes are visually and namespace-distinct from cku's convention, which avoids collisions; new PHP template-part files follow cku's flat/get_template_part convention for file naming even though the CSS class prefix stays REF-001's own"
    - id: acf_evidence
      status: OBSERVED
      evidence:
        - "get_field()/have_rows()/get_sub_field()/the_row() used throughout front-page.php, acf5-custom_field.php, list-*.php, single.php, single-staff.php, original-opencampus.php, page-library_top.php, visual.php"
        - "no acf-json/ directory and no acf_add_local_field_group()/save_json or load_json filters found in the unzipped export -> existing production field groups are DB-registered via the ACF admin UI, not exported as Local JSON in this theme copy"
      notes:
        - "no acf-json/ precedent exists in the supplied theme, so this project follows docs/wordpress-theme-intake.md's fallback rule and introduces overlay/acf-json/ using the same Local JSON + human-readable stable-key convention already established in experiments/wordpress-acf-pro-standalone-lp/theme/standalone-lp-sample/acf-json/"
    - id: block_support
      status: UNDETERMINED
      evidence: []
      notes:
        - "no theme.json / block-template evidence found; classic-theme filesystem evidence alone cannot confirm or rule out block-editor feature flags registered elsewhere (e.g. via a must-use plugin not included in this export). Not required for this integration: Student Voice/Swiper page template is a classic PHP page template, not a block template."
    - id: enqueue_convention
      status: OBSERVED
      evidence:
        - "functions.php: get_template_part('functions/EnqueueStyle'); get_template_part('functions/EnqueueScript'); then `new EnqueueStyle(...)` / `new EnqueueScript(...)` calls, several with a conditional-load Closure (e.g. is_page_template('page-form.php'), is_front_page())"
      notes:
        - "overlay/functions/ref001-integration.php follows this exact convention: `new EnqueueStyle('ref001-style', ..., function () { return is_page_template('page-ref001.php'); })` etc., so REF-001 assets load only on the new page template"
    - id: form_evidence
      status: NONE
      evidence:
        - "page-form.php + js/form.js + yubinbango-script (Japanese postal-code autofill) present, but no Contact Form 7 / MW WP Form / Gravity Forms plugin evidence in the theme export; form markup appears theme-owned (acf5-custom_field.php-driven)"
      notes:
        - "irrelevant to this integration: Student Voice and Swiper contain no form fields"
    - id: cpt_evidence
      status: OBSERVED
      evidence:
        - "functions.php registers a `staff` CPT (教員紹介) with `staff_cat` taxonomy"
      notes:
        - "irrelevant to this integration: no new CPT is introduced for Student Voice/Swiper, both remain page-local ACF repeaters"
    - id: image_pipeline
      status: OBSERVED
      evidence:
        - "functions.php add_theme_support('post-thumbnails') + multiple add_image_size() calls (page_img, top_main_pc/sp, module_img, module_img_col2, module_card, etc.), consumed via wp_get_attachment_image_src() throughout templates"
      notes:
        - "ACF Image fields for Student Voice/Swiper use return_format: array (attachment ID/URL) rendered through wp_get_attachment_image_src()-style helpers in overlay/functions/ref001-integration.php, matching this existing pattern, rather than reusing REF-001's fixture ref001_picture() PC/SP <picture> helper verbatim (adapted, not copy-pasted, to fit ACF media fields)"
  blocking_questions: []

