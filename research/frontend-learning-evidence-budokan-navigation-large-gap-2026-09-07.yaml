    summary: >-
      When a shared visual owner still cites a retired Figma source, re-fetch the current authoritative PC and SP nodes before changing spacing. Preserve
      independently different row and column rhythm instead of collapsing both axes into one generic gap, and lock the resulting contract in real runtime QA.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - Budokan Current Authority names one live Figma file and explicitly forbids carrying old-node measurements forward.
        - The existing Navigation Large CSS owner still cited a retired Figma file and encoded one generic gap across axes.
        - Current Navigation Large Figma nodes independently establish SP stack spacing and PC row/column spacing.
        - Existing disposable WordPress and Playwright Navigation runtime can verify computed grid geometry together with pointer, focus and overflow behavior.
      exclusions:
        - Do not change a shared spacing owner from an old screenshot or historical audit without re-fetching the current Figma node.
        - Do not infer equal row and column gaps when the current design establishes different axes.
        - Do not generalize this Budokan-only observation without independent evidence.
    promotion_state: PROJECT_ONLY
