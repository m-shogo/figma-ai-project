name: REF001 CSS Font Import Cleanup

on:
  push:
    branches:
      - agent/ref001-css-canonicalize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message || '', '[ref001-font-import-cleaned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Canonicalize font import position
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css')
          css = path.read_text(encoding='utf-8')
          css = re.sub(r"^@import\s+url\([^\n]+\);\s*$", '', css, flags=re.M)
          css = re.sub(r'\n{3,}', '\n\n', css).lstrip()
          fonts = "@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Poppins:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap');\n\n"
          if css.startswith('/*'):
              end = css.find('*/')
              if end < 0:
                  raise SystemExit('unterminated canonical stylesheet header')
              end += 2
              css = css[:end] + '\n' + fonts + css[end:].lstrip()
          else:
              css = fonts + css
          path.write_text(css.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate canonical CSS contract
        run: python scripts/validate_ref001_css_contract.py

      - name: Assert exactly one top-level font import
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css').read_text()
          assert css.count('@import') == 1, css.count('@import')
          assert css.find('@import') < css.find(':root'), 'font import must precede runtime rules'
          print('PASS one canonical font import before all runtime rules')
          PY

      - name: Commit font import cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/ref001-blind-clean-20260812/implementation/theme/assets/css/ref001.css
          if git diff --cached --quiet; then
            echo 'No font import cleanup required.'
            exit 0
          fi
          git commit -m 'REF-001: canonicalize font loading [ref001-font-import-cleaned]'
          git push origin HEAD:agent/ref001-css-canonicalize
