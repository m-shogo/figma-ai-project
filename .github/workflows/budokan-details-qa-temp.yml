name: Budokan Details QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-details-qa-temp.yml'
  push:
    branches:
      - agent/budokan-details-master
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-details-qa-temp.yml'

permissions:
  contents: read

jobs:
  details-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live Budokan capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed native Gutenberg details fixture
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          cat > .runtime/details-fixture.html <<'HTML'
          <!-- wp:details -->
          <details class="wp-block-details"><summary>通常アコーディオン</summary><!-- wp:paragraph --><p>展開するとテキスト、写真などが表示されます。</p><!-- /wp:paragraph --></details>
          <!-- /wp:details -->
          <!-- wp:details {"showContent":true} -->
          <details class="wp-block-details" open><summary>タイトルが入ります。テキストが長い時。テキストが長い時。テキストが長い時。</summary><!-- wp:paragraph --><p>展開するとテキスト、写真などが表示されます。日本武道館では、武道大会や研修会など、多様な参加型イベントを開催しています。</p><!-- /wp:paragraph --></details>
          <!-- /wp:details -->
          <!-- wp:details {"className":"_qa","showContent":true} -->
          <details class="wp-block-details _qa" open><summary>QAアコーディオン<br>タイトルが入ります。テキストが長い時。</summary><!-- wp:paragraph --><p>展開するとテキスト、写真などが表示されます。日本武道館では多様な参加型イベントを開催しています。</p><!-- /wp:paragraph --></details>
          <!-- /wp:details -->
          HTML
          docker compose run --rm cli post create \
            --post_type=page \
            --post_title='Details Runtime QA' \
            --post_name='details-runtime-qa' \
            --post_status=publish \
            --post_content="$(cat .runtime/details-fixture.html)" \
            --porcelain >/dev/null

      - name: Verify Figma details master at SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-details
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');
          const n = value => Number.parseFloat(value || '0');
          const near = (actual, expected, tolerance = 0.6) => Math.abs(n(actual) - expected) <= tolerance;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', width: 390, height: 1100 },
              { name: 'pc', width: 1395, height: 1000 },
            ];
            const report = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.width, height: item.height } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const response = await page.goto(`${process.env.WP_URL}/details-runtime-qa/`, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);

              const metrics = await page.evaluate(() => {
                const all = [...document.querySelectorAll('.block-editor_wrap > .wp-block-details')];
                const rect = el => { const r = el.getBoundingClientRect(); return { x:r.x, y:r.y, width:r.width, height:r.height }; };
                const css = (el, pseudo = null) => {
                  if (!el) return null;
                  const s = getComputedStyle(el, pseudo);
                  return {
                    display:s.display, paddingTop:s.paddingTop, paddingRight:s.paddingRight,
                    paddingBottom:s.paddingBottom, paddingLeft:s.paddingLeft,
                    fontSize:s.fontSize, fontWeight:s.fontWeight, lineHeight:s.lineHeight,
                    letterSpacing:s.letterSpacing, color:s.color, width:s.width, height:s.height,
                    left:s.left, right:s.right, borderTopWidth:s.borderTopWidth,
                    borderRadius:s.borderRadius,
                  };
                };
                return {
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  details: all.map(el => {
                    const summary = el.querySelector('.wp-block-details__summary');
                    const title = el.querySelector('.wp-block-details__title');
                    const button = el.querySelector('.wp-block-details__button');
                    const span = button?.querySelector('span');
                    const content = el.querySelector('.wp-block-details__content');
                    const paragraph = content?.querySelector('p');
                    return {
                      open: el.open,
                      qa: el.classList.contains('_qa'),
                      rect: rect(el),
                      detailsCss: css(el),
                      summaryCss: css(summary),
                      titleCss: css(title),
                      buttonRect: button ? rect(button) : null,
                      plusBefore: css(span, '::before'),
                      plusAfter: css(span, '::after'),
                      contentRect: content ? rect(content) : null,
                      contentCss: css(content),
                      separator: css(content, '::after'),
                      qMark: el.classList.contains('_qa') ? css(summary, '::before') : null,
                      aMark: el.classList.contains('_qa') ? css(content, '::before') : null,
                      paragraphCss: css(paragraph),
                    };
                  }),
                };
              });

              const status = response?.status() || 0;
              const overflow = metrics.scrollWidth > metrics.clientWidth + 1;
              if (status >= 400 || errors.length || overflow || metrics.details.length !== 3) failed = true;

              const [collapsed, open, qa] = metrics.details;
              for (const d of metrics.details) {
                if (!near(d.detailsCss.borderTopWidth, 1) || !near(d.detailsCss.borderRadius, 3)) failed = true;
                if (!near(d.summaryCss.paddingTop, 24) || !near(d.summaryCss.paddingBottom, 24)) failed = true;
                if (!near(d.summaryCss.paddingRight, 68)) failed = true;
                if (!d.buttonRect || !near(d.buttonRect.width, 68)) failed = true;
                if (!near(d.plusBefore.width, 20) || !near(d.plusBefore.height, 2)) failed = true;
                if (!near(d.plusAfter.width, 20) || !near(d.plusAfter.height, 2)) failed = true;
                if (!near(d.titleCss.fontSize, 16) || !near(d.titleCss.lineHeight, 24) || !near(d.titleCss.letterSpacing, 1.6)) failed = true;
              }

              if (item.name === 'sp') {
                if (!near(collapsed.summaryCss.paddingLeft, 24) || !near(open.summaryCss.paddingLeft, 24) || !near(qa.summaryCss.paddingLeft, 24)) failed = true;
                if (!near(open.contentCss.paddingLeft, 24) || !near(open.contentCss.paddingRight, 24)) failed = true;
                if (!near(qa.contentCss.paddingLeft, 24) || !near(qa.contentCss.paddingRight, 24)) failed = true;
              } else {
                if (!near(collapsed.summaryCss.paddingLeft, 24) || !near(open.summaryCss.paddingLeft, 32) || !near(qa.summaryCss.paddingLeft, 32)) failed = true;
                if (!near(open.contentCss.paddingLeft, 32) || !near(open.contentCss.paddingRight, 32)) failed = true;
                if (!near(qa.contentCss.paddingLeft, 32) || !near(qa.contentCss.paddingRight, 32)) failed = true;
              }

              for (const d of [open, qa]) {
                if (!near(d.separator.left, 0) || !near(d.separator.width, d.contentRect.width)) failed = true;
                if (!near(d.paragraphCss.fontSize, 17) || !near(d.paragraphCss.lineHeight, 27.2)) failed = true;
              }
              if (!near(qa.qMark.fontSize, 24) || !near(qa.aMark.fontSize, 24)) failed = true;
              if (qa.qMark.color !== 'rgb(202, 153, 87)' || qa.aMark.color !== 'rgb(202, 153, 87)') failed = true;

              await page.locator('.block-editor_wrap').screenshot({ path: `.runtime/budokan-details/${item.name}.png` });
              report.push({ viewport:item, status, errors, overflow, metrics });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-details/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-details-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-details
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
