schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-RESPONSIVE-VARIANT-TYPOGRAPHY-SCOPE
    summary: >-
      When a shared component has an existing semantic variant marker, verify typography by both breakpoint and variant
      before changing a shared token. If only one breakpoint/variant combination differs, override only that existing
      combination rather than widening the base component rule or inventing a page-specific selector.
    category: REUSE
    applicability:
      scope: PROJECT
      conditions:
        - Current Figma text properties were inspected for standard and variant instances at both SP and PC.
        - The WordPress editor already emits a stable semantic variant marker.
        - The observed Theme mismatch is confined to one breakpoint/variant combination.
      exclusions:
        - Do not generalize a one-project typography exception into a global token.
        - Do not introduce a page-specific selector when an existing component variant owns the difference.
        - Do not treat same-project evidence as independent promotion evidence.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        Budokan Core Details provides one local case: SP standard is 5% tracking, SP QA 10%, PC standard 10%, and PC QA 5%.
        The existing ._qa marker makes a PC-only override sufficient. This is useful project evidence but not independent
        cross-project evidence.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-QA-ACCORDION-TRACKING-20260903
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/budokan-wordpress/QA_ACCORDION_TRACKING_AUDIT_2026-09-03.md
          commit: ''
          note: >-
            LIVE current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected at SP standard 1399:18837, SP QA 1399:18857,
            PC standard/open 1157:8302/1157:8314, and PC QA 1157:8324. Only PC QA differed from the Theme cascade:
            Figma uses 5% tracking while the PC shared rule supplied 10%. The fix scopes 0.05em to the existing ._qa
            summary inside min-width:768px, preserving standard Details and SP behavior.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-03: KEEP_PROJECT_ONLY; no independent reference evidence, no auto-promotion."
