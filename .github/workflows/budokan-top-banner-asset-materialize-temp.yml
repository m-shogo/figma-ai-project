name: Budokan TOP Banner Asset Materialize Temp

on:
  push:
    branches:
      - agent/budokan-top-banner-v3
    paths:
      - '.github/workflows/budokan-top-banner-asset-materialize-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/budokan-top-banner-v3

      - name: Download current Figma raw-image candidates
        env:
          RAW_1: https://www.figma.com/api/mcp/asset/2c07570a-60ac-48fb-adff-01f4d049e99b
          RAW_2: https://www.figma.com/api/mcp/asset/8ee29694-a772-4070-a19e-95b0e048f852
          RAW_3: https://www.figma.com/api/mcp/asset/65546b23-7a67-40d5-b442-3619fe60673a
          RAW_4: https://www.figma.com/api/mcp/asset/eeb4d26c-4b9e-4d34-b0ee-585bfcf4cdae
        run: |
          set -euo pipefail
          mkdir -p /tmp/budokan-figma-assets
          for n in 1 2 3 4; do
            var="RAW_${n}"
            curl --fail --location --silent --show-error "${!var}" -o "/tmp/budokan-figma-assets/raw-${n}.jpg"
          done
          ls -l /tmp/budokan-figma-assets

      - name: Select and verify exact Figma source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          EXPECTED_SIZE = 235687
          EXPECTED_FNV = 0x310ada8b
          EXPECTED_WH = (1050, 700)

          def fnv1a(data: bytes) -> int:
              h = 0x811c9dc5
              for b in data:
                  h ^= b
                  h = (h * 0x01000193) & 0xffffffff
              return h

          def jpeg_size(data: bytes):
              if data[:2] != b'\xff\xd8':
                  return None
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xff:
                      i += 1
                      continue
                  marker = data[i + 1]
                  i += 2
                  if marker in (0xd8, 0xd9):
                      continue
                  if i + 2 > len(data):
                      break
                  seglen = int.from_bytes(data[i:i+2], 'big')
                  if seglen < 2 or i + seglen > len(data):
                      break
                  if marker in {0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf}:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return (w, h)
                  i += seglen
              return None

          matches = []
          for path in sorted(Path('/tmp/budokan-figma-assets').glob('raw-*.jpg')):
              data = path.read_bytes()
              meta = (len(data), fnv1a(data), jpeg_size(data))
              print(path.name, meta)
              if meta == (EXPECTED_SIZE, EXPECTED_FNV, EXPECTED_WH):
                  matches.append(path)

          if len(matches) != 1:
              raise SystemExit(f'expected exactly one verified source, got {matches}')

          dest = Path('experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/images/top/bg-banner-sp.jpg')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(matches[0].read_bytes())
          print('materialized', dest)
          PY

      - name: Commit durable binary and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/images/top/bg-banner-sp.jpg
          git rm .github/workflows/budokan-top-banner-asset-materialize-temp.yml
          git commit -m 'assets: materialize Budokan TOP banner Figma background'
          git push origin HEAD:agent/budokan-top-banner-v3
