name: ${COMPOSE_PROJECT_NAME:-figma-ai-wordpress-acf-lp}

services:
  db:
    image: mariadb:11.4.12
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-wordpress-fixture-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ./theme/standalone-lp-sample:/var/www/html/wp-content/themes/standalone-lp-sample:ro
      - ./:/fixture:ro

  cli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-fixture}
    volumes:
      - wp_data:/var/www/html
      - ./theme/standalone-lp-sample:/var/www/html/wp-content/themes/standalone-lp-sample:ro
      - ./:/fixture:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
