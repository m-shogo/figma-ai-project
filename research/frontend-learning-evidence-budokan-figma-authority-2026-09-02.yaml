schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-FIGMA-SP-AUTHORITY-DISCOVERY
    summary: >-
      When a Figma family map says a responsive or family authority is unobserved or points at historical lineage,
      inspect the canonical current canvas/root and its current child frames before concluding that the variant is
      missing; a live frame may exist even when a stale historical node no longer resolves. When a family authority
      is refreshed, synchronize any current-summary maps that implementation agents also read so the old node cannot
      silently remain as a competing pseudo-authority. Treat stored full-page geometry the same way: dated audit
      dimensions are evidence, not immutable authority, and must yield to a fresh read of the canonical current node
      before they are used as runtime or visual-QA targets.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - A current Figma file has an explicit current canvas/root authority.
        - A family mapping still carries an unobserved or historical node state, a derived summary map disagrees with the verified family authority, or an audit's stored geometry disagrees with the canonical current node.
      exclusions:
        - Do not infer a responsive frame from naming alone; verify the current node and inspect its actual subtree/content.
        - Do not rewrite unrelated historical mappings solely because one family was re-verified.
        - Reject current-looking candidates whose body is incomplete or whose title, breadcrumb, and semantic family do not agree.
        - Do not convert historical top-level scan evidence into current family authority; preserve dated discovery lists as lineage when they are explicitly historical.
        - Do not treat a changed frame height alone as permission to change Theme code; first prove an implementation/runtime diff at the authored component boundary.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        Budokan has four same-project positive recoveries: POST_DETAIL as SP_post 1451:5197,
        NEWS_ARCHIVE as SP_archive 1399:14225, FEATURE_PAGE_TRAINING_CENTER as SP_navigation 1468:6595,
        and FEATURE_PAGE_JOIN PC as navigation 2197:5391. The root/canvas audits also rejected current-looking
        SP_navigation candidates after inspecting their actual content, a subsequent authority-consistency QA
        caught a stale summary-map row after the JOIN family had already been refreshed, and the 2026-09-03
        Publications re-check caught stale stored full-page geometry before it could become a false visual-QA target.
        This strengthens the project-local procedure, but all evidence still comes entirely from REF-002-BUDOKAN
        rather than independent cross-reference evidence. Keep PROJECT_ONLY and do not auto-promote.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-SP-POST-LIVE-AUTHORITY-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            Current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected through the canonical SP root 114:5409;
            SP_post 1451:5197 was then retrieved directly and matched the POST_DETAIL family before updating
            only that family mapping.
        - evidence_id: EV-BUDOKAN-SP-NEWS-ARCHIVE-LIVE-AUTHORITY-20260902
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/ref002-budokan-wordpress/page-family-map.yaml
          commit: ''
          note: >-
            Current Figma file fKYDn9ikpJk1nW7IWFtaUx was inspected through the canonical SP root 114:5409.
            The live SP_archive frame 1399:14225 contains the expected News archive page title, six category tabs,
            repeated post cards, pagination, breadcrumb, footer, and mobile purpose menu, so the historical 560:2524
            mapping was replaced only for NEWS_ARCHIVE.
        - evidence_id: EV-BUDOKAN-SP-TRAINING-CENTER-LIVE-AUTHORITY-20260902
