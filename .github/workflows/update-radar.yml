name: Update Radar

on:
  schedule:
    # Daily 12:17 JST. Deliberately off the top of the hour to reduce scheduler contention.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch official update sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_update_radar.py --write-history

      - name: Validate generated contracts
        run: |
          python scripts/validate_yaml_duplicates.py
          python scripts/validate_company_policy.py

      - name: Decide whether upstream meaningfully changed
        id: radar
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('research/update-radar/latest.json')
          data = json.loads(p.read_text())
          s = data.get('summary', {})
          meaningful = any(int(s.get(k, 0) or 0) > 0 for k in (
              'changed_count', 'first_observation_count', 'error_count'
          ))
          print(f"meaningful={'true' if meaningful else 'false'}")
          print(f"changed_count={int(s.get('changed_count', 0) or 0)}")
          print(f"error_count={int(s.get('error_count', 0) or 0)}")
          PY

      - name: Commit radar state/history
        if: steps.radar.outputs.meaningful == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/update-radar
          if git diff --cached --quiet; then
            echo "No persisted radar changes."
            exit 0
          fi
          git commit -m "radar: refresh official update signals"
          git push

      - name: Update rolling radar issue
        if: steps.radar.outputs.changed_count != '0' || steps.radar.outputs.error_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/update_radar_issue.py