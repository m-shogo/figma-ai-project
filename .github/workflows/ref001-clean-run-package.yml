name: Build REF-001 clean-run package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_sanitized_run_workspace.py"
      - "scripts/controlled_run_phase.py"
      - "scripts/validate_human_editability.py"
      - "scripts/validate_benchmark_replay_pipeline.py"
      - "tests/test_build_sanitized_run_workspace.py"
      - "tests/test_controlled_run_phase.py"
      - "tests/test_validate_human_editability.py"
      - "tests/test_benchmark_replay_pipeline.py"
      - "experiments/ref001-clean-run/**"
      - "experiments/ref001-benchmark-replay/**"
      - "references/chiba-keizai-sample.reference.yaml"
      - "references/chiba-keizai-sample.structure-profile.yaml"
      - "references/chiba-keizai-sample.variable-mode-audit.yaml"
      - "references/chiba-keizai-sample.remaining-structure-evidence.yaml"
      - "docs/sanitized-clean-run-workspace.md"
      - "docs/ref001-clean-run-agent-handoff.md"
      - "docs/human-editability.md"
      - "templates/run-record.yaml"
      - "templates/shared-contract.yaml"
      - ".github/workflows/ref001-clean-run-package.yml"
      - ".github/workflows/wordpress-acf-pro-standalone-lp.yml"
  push:
    branches: [so]
    paths:
      - "scripts/build_sanitized_run_workspace.py"
      - "scripts/controlled_run_phase.py"
      - "scripts/validate_human_editability.py"
      - "scripts/validate_benchmark_replay_pipeline.py"
      - "experiments/ref001-clean-run/**"
      - "experiments/ref001-benchmark-replay/**"
      - "references/chiba-keizai-sample.reference.yaml"
      - "references/chiba-keizai-sample.structure-profile.yaml"
      - "references/chiba-keizai-sample.variable-mode-audit.yaml"
      - "references/chiba-keizai-sample.remaining-structure-evidence.yaml"
      - "docs/sanitized-clean-run-workspace.md"
      - "docs/ref001-clean-run-agent-handoff.md"
      - "docs/human-editability.md"
      - "templates/run-record.yaml"
      - "templates/shared-contract.yaml"
      - ".github/workflows/ref001-clean-run-package.yml"
      - ".github/workflows/wordpress-acf-pro-standalone-lp.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Human Editability contract
        run: python scripts/validate_human_editability.py

      - name: Validate sanitized selection
        run: >-
          python scripts/build_sanitized_run_workspace.py validate
          experiments/ref001-clean-run/workspace.yaml

      - name: Build sanitized workspace outside repository
        run: >-
          python scripts/build_sanitized_run_workspace.py build
          experiments/ref001-clean-run/workspace.yaml
          --output "$RUNNER_TEMP/ref001-clean-run"

      - name: Audit generated handoff before upload
        run: >-
          python scripts/build_sanitized_run_workspace.py audit
          experiments/ref001-clean-run/workspace.yaml
          --output "$RUNNER_TEMP/ref001-clean-run"

      - name: Prove blind handoff is present and repaired answer is absent
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/ref001-clean-run/.sanitized-run-workspace.json"
          test -f "$RUNNER_TEMP/ref001-clean-run/docs/ref001-clean-run-agent-handoff.md"
          test -f "$RUNNER_TEMP/ref001-clean-run/docs/human-editability.md"
          test -f "$RUNNER_TEMP/ref001-clean-run/scripts/controlled_run_phase.py"
          test -f "$RUNNER_TEMP/ref001-clean-run/scripts/validate_human_editability.py"
          test -f "$RUNNER_TEMP/ref001-clean-run/templates/run-record.yaml"
          test -f "$RUNNER_TEMP/ref001-clean-run/templates/shared-contract.yaml"
          test -f "$RUNNER_TEMP/ref001-clean-run/references/chiba-keizai-sample.remaining-structure-evidence.yaml"
          test ! -e "$RUNNER_TEMP/ref001-clean-run/experiments/ref001-wordpress-acf/fixture-theme"
          test ! -e "$RUNNER_TEMP/ref001-clean-run/experiments/ref001-wordpress-acf/visual-preview"
          test ! -e "$RUNNER_TEMP/ref001-clean-run/research/figma-web-friction"
          test ! -e "$RUNNER_TEMP/ref001-clean-run/scripts/validate_wordpress_learning_fixture.py"
          ! find "$RUNNER_TEMP/ref001-clean-run/scripts" -type f -iname '*ref001*' -print -quit | grep -q .
          echo "PASS blind handoff/gates/live-evidence/manifest present; repaired REF-001 implementation and answer-bearing evidence absent"

      - name: Upload clean-run handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ref001-clean-run-${{ github.sha }}
          path: ${{ runner.temp }}/ref001-clean-run
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  benchmark-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate benchmark replay preflight
        run: python scripts/validate_benchmark_replay_pipeline.py

      - name: Validate benchmark sanitized selection
        run: >-
          python scripts/build_sanitized_run_workspace.py validate
          experiments/ref001-benchmark-replay/workspace.yaml

      - name: Build benchmark sanitized workspace outside repository
        run: >-
          python scripts/build_sanitized_run_workspace.py build
          experiments/ref001-benchmark-replay/workspace.yaml
          --output "$RUNNER_TEMP/ref001-benchmark-clean-replay"

      - name: Audit benchmark handoff before upload
        run: >-
          python scripts/build_sanitized_run_workspace.py audit
          experiments/ref001-benchmark-replay/workspace.yaml
          --output "$RUNNER_TEMP/ref001-benchmark-clean-replay"

      - name: Run preflight from sanitized handoff
        run: >-
          python "$RUNNER_TEMP/ref001-benchmark-clean-replay/scripts/validate_benchmark_replay_pipeline.py"

      - name: Prove benchmark authority is present and historical answers are absent
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ref001-benchmark-clean-replay"
          test -f "$ROOT/.sanitized-run-workspace.json"
          test -f "$ROOT/experiments/ref001-benchmark-replay/FRESH-EXECUTION.md"
          test -f "$ROOT/experiments/ref001-benchmark-replay/implementation-profile.yaml"
          test -f "$ROOT/experiments/ref001-benchmark-replay/shared-contract.yaml"
          test -f "$ROOT/experiments/ref001-benchmark-replay/blank-theme/page-templates/template-ref001-benchmark.php"
          test -f "$ROOT/experiments/ref001-benchmark-replay/blank-theme/template-parts/ref001/benchmark-page.php"
          test -f "$ROOT/scripts/validate_benchmark_replay_pipeline.py"
          test -f "$ROOT/references/chiba-keizai-sample.reference.yaml"
          test -f "$ROOT/experiments/wordpress-acf-pro-standalone-lp/compose.yml"
          test -f "$ROOT/experiments/wordpress-acf-pro-standalone-lp/scripts/setup.sh"
          test ! -e "$ROOT/experiments/ref001-wordpress-acf"
          test ! -e "$ROOT/experiments/ref001-lp-package"
          test ! -e "$ROOT/experiments/ref001-blind-clean-20260812"
          test ! -e "$ROOT/experiments/ref001-frontend-standard-clean-replay"
          test ! -e "$ROOT/experiments/ref001-v3"
          test ! -e "$ROOT/implementation/theme"
          test ! -e "$ROOT/research/figma-web-friction"
          ! find "$ROOT/scripts" -type f -iname '*ref001*' -print -quit | grep -q .
          echo "PASS benchmark handoff contains frozen target/current authority and excludes historical REF answers"

      - name: Upload benchmark clean-replay handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ref001-benchmark-clean-replay-${{ github.sha }}
          path: ${{ runner.temp }}/ref001-benchmark-clean-replay
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
