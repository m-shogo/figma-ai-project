name: REF001 CSS Canonicalize

on:
  push:
    branches:
      - agent/ref001-css-canonicalize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[ref001-css-canonicalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Canonicalize REF-001 CSS and runtime files
        run: python scripts/ref001_css_canonicalize.py

      - name: Validate CSS contract
        run: python scripts/validate_ref001_css_contract.py

      - name: Validate PHP syntax
        run: |
          php -l experiments/ref001-blind-clean-20260812/implementation/theme/functions.php
          php -l experiments/ref001-blind-clean-20260812/implementation/theme/preview.php
          php -l experiments/ref001-blind-clean-20260812/implementation/theme/page-ref001-clean.php

      - name: Validate JavaScript syntax
        run: node --check experiments/ref001-blind-clean-20260812/implementation/theme/assets/js/ref001-interactions.js

      - name: Show canonicalization diff
        run: git diff --stat && git status --short

      - name: Commit generated canonical runtime
        env:
          BRANCH: agent/ref001-css-canonicalize
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/ref001-blind-clean-20260812/implementation/theme scripts/validate_ref001_css_contract.py
          if git diff --cached --quiet; then
            echo 'No canonicalization changes required.'
            exit 0
          fi
          git commit -m 'REF-001: canonicalize runtime CSS [ref001-css-canonicalized]'
          git push origin HEAD:"$BRANCH"
