name: Budokan Columns Runtime QA

on:
  pull_request:
    branches: [so]
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/blocks/wp-block-columns-style.css'
      - '.github/workflows/budokan-columns-runtime.yml'

jobs:
  columns-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress + ACF PRO runtime
        working-directory: experiments/wordpress-acf-runtime
        run: |
          test -n "$ACF_PRO_LICENSE_KEY"
          cp .env.example .env
          printf '\nACF_PRO_LICENSE_KEY=%s\n' "$ACF_PRO_LICENSE_KEY" >> .env
          bash ./scripts/setup.sh
      - name: Seed native Gutenberg columns fixture
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source ./scripts/runtime-env.sh
          CONTENT='<!-- wp:columns --><div class="wp-block-columns"><!-- wp:column --><div class="wp-block-column"><!-- wp:paragraph --><p>Column A</p><!-- /wp:paragraph --></div><!-- /wp:column --><!-- wp:column --><div class="wp-block-column"><!-- wp:paragraph --><p>Column B</p><!-- /wp:paragraph --></div><!-- /wp:column --></div><!-- /wp:columns -->'
          docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='Columns QA' --post_name='columns-qa' --post_content="$CONTENT" --porcelain
          curl --fail --silent --show-error "$WP_URL/columns-qa/" -o /tmp/budokan-columns.html
          grep -q 'wp-block-columns' /tmp/budokan-columns.html
      - name: Install browser probe
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify SP and PC native columns geometry
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source ./scripts/runtime-env.sh
          export QA_URL="$WP_URL/columns-qa/"
          node --input-type=module <<'NODE'
          import { chromium } from '../../node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          const eq=(a,e,l,t=0.8)=>{if(Math.abs(a-e)>t) throw new Error(`${l}: ${a} != ${e}`)};
          async function check(width,mode){
            const page=await browser.newPage({viewport:{width,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const res=await page.goto(process.env.QA_URL,{waitUntil:'networkidle'});
            if(!res||res.status()!==200) throw new Error(`${mode} HTTP ${res?.status()}`);
            const d=await page.locator('.wp-block-columns').first().evaluate(el=>{
              const s=getComputedStyle(el), kids=[...el.children].filter(x=>x.classList.contains('wp-block-column'));
              const r=kids.map(x=>x.getBoundingClientRect());
              return {display:s.display,gap:parseFloat(s.gap),rowGap:parseFloat(s.rowGap),columnGap:parseFloat(s.columnGap),containerW:el.getBoundingClientRect().width,rects:r.map(x=>({x:x.x,y:x.y,w:x.width,h:x.height})),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            eq(d.gap,24,`${mode} gap`); eq(d.rowGap,24,`${mode} row gap`); eq(d.columnGap,24,`${mode} column gap`);
            if(d.rects.length!==2) throw new Error(`${mode} child count ${d.rects.length}`);
            if(mode==='SP') {
              eq(d.rects[0].w,d.containerW,'SP first column fill'); eq(d.rects[1].w,d.containerW,'SP second column fill');
              eq(d.rects[1].y-(d.rects[0].y+d.rects[0].h),24,'SP stacked visual gap',1.2);
            } else {
              eq(d.rects[1].x-(d.rects[0].x+d.rects[0].w),24,'PC horizontal visual gap',1.2);
            }
            if(d.overflow>1) throw new Error(`${mode} page overflow ${d.overflow}`);
            if(errors.length) throw new Error(`${mode} page errors ${errors.join('; ')}`);
            console.log(`PASS ${mode}`,d); await page.close();
          }
          await check(390,'SP'); await check(1395,'PC'); await browser.close();
          NODE
      - name: Tear down runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: bash ./scripts/reset.sh || true
