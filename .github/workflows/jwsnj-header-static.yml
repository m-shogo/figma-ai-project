  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Human ACF navigation block reference and PHP renderers
        run: |
          php -l projects/jwsnj/qa/prepare-navigation-blocks-qa.php
          node --test projects/jwsnj/tests/parts-navigation-acf-reference.test.mjs
      - name: Test header breakpoint and menu close regressions
        run: node --test projects/jwsnj/tests/header-menu-state.test.mjs
      - name: Test Footer WordPress menu contract
        run: node --test projects/jwsnj/tests/footer-menu-contract.test.mjs
      - name: Test official Header and Footer SVG bytes
        run: node --test projects/jwsnj/tests/official-svg-asset-contract.test.mjs
      - name: Test Figma-approved parts heading, copy and list contracts
        run: node --test projects/jwsnj/tests/parts-*.test.mjs
      - name: Test approved news archive and isolated pagination
        run: node --test projects/jwsnj/tests/news-archive-contract.test.mjs projects/jwsnj/tests/news-single-contract.test.mjs projects/jwsnj/tests/fixed-page-contract.test.mjs projects/jwsnj/tests/top-notice-contract.test.mjs
      - name: Test CSS versioning and atomic fallback
        run: node --test projects/jwsnj/tests/css-assets-contract.test.mjs
      - name: Check WordPress Header and Footer PHP syntax
        run: |
          php -l projects/jwsnj/theme/template-parts/_header.php
          php -l projects/jwsnj/theme/template-parts/_footer.php
          php -l projects/jwsnj/theme/inc/editor.php
