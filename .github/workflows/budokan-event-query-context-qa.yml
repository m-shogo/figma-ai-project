name: Budokan Event Query Context QA

on:
  pull_request:
    branches: [so]
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/blocks/customPostList.php'
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_list-card.php'
      - '.github/workflows/budokan-event-query-context-qa.yml'

jobs:
  event-query-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/blocks/customPostList.php
          php -l experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_list-card.php
      - name: Verify customPostList passes event posts explicitly
        run: |
          php <<'PHP'
          <?php
          class WP_Query {
              public $posts;
              public function __construct($args) {
                  $this->posts = [(object)['ID'=>201,'post_title'=>'Event Alpha'], (object)['ID'=>202,'post_title'=>'Event Beta']];
              }
              public function have_posts() { return !empty($this->posts); }
          }
          function get_field($name) {
              return match ($name) {
                  'block_post_type' => 'event',
                  'block_posts_per_page' => 2,
                  'block_event_cat' => [],
                  default => null,
              };
          }
          $captured = null;
          function get_template_part($slug, $name = null, $args = []) {
              global $captured;
              if ($slug === 'template-parts/_list-card') $captured = $args;
          }
          function wp_reset_postdata() {}
          $wp_query = (object)[];
          require 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/acf/blocks/customPostList.php';
          if (!isset($captured['posts']) || count($captured['posts']) !== 2) {
              fwrite(STDERR, "event posts were not passed explicitly\n"); exit(1);
          }
          if (($captured['posts'][0]->post_title ?? '') !== 'Event Alpha' || ($captured['props'] ?? '') !== 'customPostList') {
              fwrite(STDERR, "unexpected event renderer args\n"); exit(1);
          }
          echo "customPostList explicit event posts: GREEN\n";
          PHP
      - name: Verify page renderer ignores page-global posts when explicit events exist
        run: |
          php <<'PHP'
          <?php
          $posts = [(object)['ID'=>1,'post_title'=>'Host Page']];
          $post = $posts[0];
          $wp_query = (object)[];
          $rendered = [];
          function is_front_page(){ return false; }
          function is_page(){ return true; }
          function setup_postdata($p){ global $post; $post=$p; }
          function wp_reset_postdata(){}
          function get_template_part($slug, $name=null, $args=[]){
              global $post, $rendered;
              if ($slug === 'template-parts/_list-card_article') $rendered[] = $post->post_title;
          }
          $args = ['props'=>'customPostList','posts'=>[(object)['ID'=>201,'post_title'=>'Event Alpha'],(object)['ID'=>202,'post_title'=>'Event Beta']]];
          ob_start();
          require 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/template-parts/_list-card.php';
          ob_end_clean();
          if ($rendered !== ['Event Alpha','Event Beta']) {
              fwrite(STDERR, 'wrong renderer data: '.json_encode($rendered)."\n"); exit(1);
          }
          if (in_array('Host Page', $rendered, true)) {
              fwrite(STDERR, "host page leaked into event cards\n"); exit(1);
          }
          echo "page-context shared event renderer: GREEN\n";
          PHP
