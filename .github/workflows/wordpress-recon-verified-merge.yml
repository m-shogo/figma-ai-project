name: WordPress Recon Verified Merge

on:
  push:
    branches:
      - agent/wordpress-target-reconnaissance
    paths:
      - '.github/workflows/wordpress-recon-verified-merge.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate scanner
        run: |
          set -euo pipefail
          python -m unittest tests.test_scan_wordpress_target
          python scripts/check_repository_readiness.py
          python -m unittest discover -s tests -p 'test_*.py'
          git fetch origin so --depth=1
          git diff --check origin/so...HEAD
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:agent%2Fwordpress-target-reconnaissance&base=so&per_page=10" > /tmp/prs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          prs=json.loads(Path('/tmp/prs.json').read_text())
          if len(prs)!=1: raise SystemExit(f'expected one PR, found {len(prs)}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"number={prs[0]['number']}\n")
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wordpress-recon-verified-merge.yml
          git commit -m 'Remove WordPress recon verified merge workflow'
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for final-head checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${FINAL_HEAD}/check-runs?per_page=100" > /tmp/checks.json
            state=$(python - <<'PY'
          import json
          from pathlib import Path
          runs=json.loads(Path('/tmp/checks.json').read_text()).get('check_runs',[])
          if not runs: print('WAIT')
          else:
              bad=[]; pending=[]
              for run in runs:
                  name=run.get('name','<unnamed>'); status=run.get('status'); conclusion=run.get('conclusion')
                  if status!='completed': pending.append(name)
                  elif conclusion not in {'success','neutral','skipped'}: bad.append(f'{name}:{conclusion}')
              print('FAIL:'+','.join(bad) if bad else ('WAIT:'+','.join(pending) if pending else 'PASS'))
          PY
          )
            case "$state" in PASS) exit 0;; FAIL:*) echo "$state" >&2; exit 1;; *) sleep 10;; esac
          done
          exit 1
      - name: Squash merge verified head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          python - <<'PY' > /tmp/merge.json
          import json, os
          print(json.dumps({'sha':os.environ['FINAL_HEAD'],'merge_method':'squash','commit_title':'Add evidence-first WordPress target reconnaissance','commit_message':'Add read-only WordPress target architecture scanning with explicit evidence/inference boundaries and tests.'}))
          PY
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" --data-binary @/tmp/merge.json > /tmp/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/result.json').read_text())
          if r.get('merged') is not True: raise SystemExit(r.get('message','merge rejected'))
          PY
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/wordpress-target-reconnaissance"
