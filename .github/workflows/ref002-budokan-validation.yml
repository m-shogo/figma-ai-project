name: REF002 Budokan FullCalendar Validation

on:
  pull_request:
    paths:
      - 'experiments/ref002-budokan-fullcalendar-validation/**'
      - '.github/workflows/ref002-budokan-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-wave-web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate deterministic Web benchmark contract
        run: |
          python3 -m json.tool experiments/ref002-budokan-fullcalendar-validation/evidence/first-pass-contract.json >/dev/null
          grep -q "new FullCalendar.Calendar" experiments/ref002-budokan-fullcalendar-validation/app.js
          if grep -q "updateSize" experiments/ref002-budokan-fullcalendar-validation/app.js; then
            echo 'Legacy FullCalendar updateSize workaround is not allowed without measured evidence.' >&2
            exit 1
          fi
          # Repository-wide validate-research owns the short-lived Figma URL leak gate.

      - name: Install browser runtime
        run: |
          mkdir -p /tmp/ref002-playwright
          cd /tmp/ref002-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium
          ln -s /tmp/ref002-playwright/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Start current Web fixture
        run: |
          python3 -m http.server 8772 \
            --bind 127.0.0.1 \
            --directory experiments/ref002-budokan-fullcalendar-validation \
            > /tmp/ref002-http.log 2>&1 &
          echo $! > /tmp/ref002-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8772/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ref002-http.log
          exit 1

      - name: Exercise real FullCalendar at PC and SP
        run: |
          node experiments/ref002-budokan-fullcalendar-validation/qa.mjs \
            http://127.0.0.1:8772/ \
            /tmp/ref002-budokan

      - name: Compare Repair Wave 1 geometry with concrete Figma nodes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path('/tmp/ref002-budokan/repair-wave-1-runtime.json').read_text())
          assert runtime['visualComplete'] is False
          rows = {r['name']: r['evidence'] for r in runtime['results']}
          assert set(rows) == {'pc', 'sp'}, rows.keys()
          pc = rows['pc']
          sp = rows['sp']

          authority = {
            'pc': {'headerHeight':100,'heroY':100,'heroHeight':640,'eventsY':740,'eventListWidth':660,'eventListHeight':744,'calendarWidth':420,'calendarHeight':706},
            'sp': {'headerHeight':60,'eventListWidth':327,'eventListHeight':656,'calendarWidth':327,'calendarHeight':674},
          }
          deltas = {
            'pc': {
              'headerHeightDeltaPx': pc['header']['height'] - authority['pc']['headerHeight'],
              'heroYDeltaPx': pc['hero']['y'] - authority['pc']['heroY'],
              'heroHeightDeltaPx': pc['hero']['height'] - authority['pc']['heroHeight'],
              'eventsYDeltaPx': pc['eventSection']['y'] - authority['pc']['eventsY'],
              'eventListWidthDeltaPx': pc['eventList']['width'] - authority['pc']['eventListWidth'],
              'eventListHeightDeltaPx': pc['eventList']['height'] - authority['pc']['eventListHeight'],
              'calendarWidthDeltaPx': pc['calendarPanel']['width'] - authority['pc']['calendarWidth'],
              'calendarHeightDeltaPx': pc['calendarPanel']['height'] - authority['pc']['calendarHeight'],
            },
            'sp': {
              'headerHeightDeltaPx': sp['header']['height'] - authority['sp']['headerHeight'],
              'eventListWidthDeltaPx': sp['eventList']['width'] - authority['sp']['eventListWidth'],
              'eventListHeightDeltaPx': sp['eventList']['height'] - authority['sp']['eventListHeight'],
              'calendarWidthDeltaPx': sp['calendarPanel']['width'] - authority['sp']['calendarWidth'],
              'calendarHeightDeltaPx': sp['calendarPanel']['height'] - authority['sp']['calendarHeight'],
            },
          }
          for viewport, values in deltas.items():
            for key, value in values.items():
              assert abs(value) <= 0.5, f'{viewport} {key}: {value:+.3f}px'
          assert pc['assetPendingCount'] > 0 and sp['assetPendingCount'] > 0
          Path('/tmp/ref002-budokan/repair-wave-1-deltas.json').write_text(json.dumps(deltas, indent=2))
          print(json.dumps(deltas, indent=2))
          PY

      - name: Capture Fast Loop cause evidence for real Web event section
        run: |
          cat > /tmp/ref002-events-pc.json <<'JSON'
          {
            "version":1,
            "id":"ref002-budokan-events-pc-repair-wave-1",
            "mode":"FAST",
            "figma":{"fileKey":"RfAQQ28V1HGaeIcpgRmQq1","nodeId":"894:19272","revision":"observed-2026-08-17"},
            "implementation":{"url":"http://127.0.0.1:8772/","selector":".events-section","index":0},
            "viewport":{"width":1380,"height":1000,"dpr":1},
            "reference":{"measurement":"/tmp/ref002-events-pc.measurement.json"},
            "environment":{"locale":"ja-JP","timezone":"Asia/Tokyo","waitUntil":"networkidle","readySelector":"html.calendar-ready","stabilityFrames":3,"stabilityTolerancePx":0.25,"stabilityTimeoutMs":1500},
            "probes":[".event-list",".event-row",".calendar-panel","#calendar"],
            "repairHistory":[]
          }
          JSON
          node tools/implementation-intake/section_capture.mjs \
            /tmp/ref002-events-pc.json \
            /tmp/ref002-budokan/events-pc-repair-wave-1.png \
            /tmp/ref002-budokan/events-pc-repair-wave-1.measurement.json
          PYTHONPATH=tools/implementation-intake python3 - <<'PY'
          import json
          from pathlib import Path
          from evidence_visibility import classify_stylesheet_visibility
          m = json.loads(Path('/tmp/ref002-budokan/events-pc-repair-wave-1.measurement.json').read_text())
          assert m['captureStability']['stable'] is True, m['captureStability']
          assert m['environment']['devicePixelRatio'] == 1
          assert abs(m['box']['y'] - 740) <= 0.5, m['box']
          assert m['typographyFingerprint']['lineRects'], 'missing typography evidence'
          assert m['matchedRuleSummary']['totalObserved'] > 0, m['matchedRuleSummary']
          kinds = {row['kind'] for row in m['semanticRegions']}
          assert 'text' in kinds, kinds
          visibility = classify_stylesheet_visibility(m['stylesheetDiagnostics'])
          assert visibility['kind'] == 'partial', visibility
          assert visibility['blockedExternalStylesheets'] >= 3, visibility
          assert visibility['canClaimCompleteCssOwnership'] is False, visibility
          assert visibility['cssOwnerConfidenceCeiling'] < 1.0, visibility
          Path('/tmp/ref002-budokan/stylesheet-visibility.json').write_text(json.dumps(visibility, indent=2))
          print(json.dumps(visibility, indent=2))
          PY

      - name: Upload Repair Wave 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref002-budokan-repair-wave-1
          path: /tmp/ref002-budokan
          if-no-files-found: warn
          retention-days: 7
