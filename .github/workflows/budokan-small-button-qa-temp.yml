name: Budokan Small Button QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-small-button-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-small-button:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live Budokan capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed deterministic small button fixture
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          cat > .runtime/small-button-fixture.html <<'HTML'
          <!-- wp:buttons {"className":"small"} -->
          <div class="wp-block-buttons small">
            <!-- wp:button -->
            <div class="wp-block-button"><a class="wp-block-button__link wp-element-button" href="#budo">武道料金はこちら</a></div>
            <!-- /wp:button -->
            <!-- wp:button -->
            <div class="wp-block-button"><a class="wp-block-button__link wp-element-button" href="#general">スポーツ・研修・一般はこちら</a></div>
            <!-- /wp:button -->
          </div>
          <!-- /wp:buttons -->
          HTML
          CONTENT="$(cat .runtime/small-button-fixture.html)"
          docker compose run --rm cli post create --post_type=page --post_status=publish --post_title='Small Button QA' --post_name='small-button-qa' --post_content="$CONTENT" >/dev/null

      - name: Verify small button SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-small-button
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [{ name:'sp', viewportWidth:390, height:700 }, { name:'pc', viewportWidth:1395, height:700 }];
            const results=[]; let failed=false;
            for (const item of cases) {
              const page=await browser.newPage({viewport:{width:item.viewportWidth,height:item.height}});
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
              const response=await page.goto(`${process.env.WP_URL}/small-button-qa/`,{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const metrics=await page.evaluate(()=>{
                const buttons=[...document.querySelectorAll('.wp-block-buttons.small .wp-block-button')];
                if(buttons.length!==2) return {found:false,count:buttons.length};
                const link=buttons[0].querySelector('.wp-block-button__link');
                const style=getComputedStyle(link); const arrow=getComputedStyle(link,'::before'); const rect=link.getBoundingClientRect();
                const parent=getComputedStyle(buttons[0]);
                return {found:true,count:buttons.length,width:rect.width,height:rect.height,fontSize:parseFloat(style.fontSize),fontWeight:style.fontWeight,lineHeight:parseFloat(style.lineHeight),padding:[style.paddingTop,style.paddingRight,style.paddingBottom,style.paddingLeft],borderTopWidth:parseFloat(style.borderTopWidth),backgroundColor:style.backgroundColor,backgroundImage:style.backgroundImage,gap:parseFloat(style.gap),arrowWidth:parseFloat(arrow.width),arrowHeight:parseFloat(arrow.height),arrowFontSize:parseFloat(arrow.fontSize),arrowFontWeight:arrow.fontWeight,arrowColor:arrow.color,arrowBackgroundColor:arrow.backgroundColor,parentMinWidth:parent.minWidth,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};
              });
              const status=response?.status()||0; const overflow=metrics.scrollWidth>metrics.clientWidth+1;
              if(status>=400||pageErrors.length||!metrics.found||overflow) failed=true;
              if(Math.abs(metrics.height-32)>0.5||Math.abs(metrics.fontSize-15)>0.5||metrics.fontWeight!=='500') failed=true;
              if(metrics.padding.some(v=>parseFloat(v)!==0)||metrics.borderTopWidth!==0) failed=true;
              if(Math.abs(metrics.gap-10)>0.5) failed=true;
              if(Math.abs(metrics.arrowWidth-32)>0.5||Math.abs(metrics.arrowHeight-32)>0.5||Math.abs(metrics.arrowFontSize-12)>0.5) failed=true;
              if(metrics.arrowFontWeight!=='400'||metrics.arrowColor!=='rgb(255, 255, 255)'||metrics.arrowBackgroundColor!=='rgb(202, 153, 87)') failed=true;
              if(metrics.backgroundImage!=='none'||metrics.parentMinWidth!=='0px') failed=true;
              await page.locator('.wp-block-buttons.small').first().screenshot({path:`.runtime/budokan-small-button/${item.name}-small-button.png`});
              results.push({viewport:item,status,pageErrors,horizontalOverflow:overflow,metrics}); await page.close();
            }
            await browser.close(); fs.writeFileSync('.runtime/budokan-small-button/runtime.json',JSON.stringify(results,null,2)); console.log(JSON.stringify(results,null,2)); if(failed) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-small-button-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-small-button
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
