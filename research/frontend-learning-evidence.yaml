          commit: b97f4c5646bdb4bfbceb3400077c79a0e36f98ba
          note: PR #205 froze Section Manifest and Structure Profile lineage with First Pass evidence.
        - evidence_id: EV-OBS-COVERAGE-ACTIVE-RUN
          kind: COMMIT
