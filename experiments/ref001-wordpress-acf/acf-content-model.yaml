principles:
  - "Only editor-owned content/config becomes ACF data; Figma layout values stay in code/design tokens."
  - "A repeated visual pattern is not sufficient evidence for an ACF Repeater. Editor-controlled cardinality/reordering must be established separately."
  - "ACF PRO-only architecture is not introduced while the target site's license/tier is unknown."
  - "Do not duplicate PC/SP image fields when both responsive variants use the same underlying image source and only crop/layout differs."
  - "Highly art-directed text can remain code-owned when arbitrary editing would destroy the composition."
  - "A visible open/collapsed or carousel-like state is not an interaction specification unless prototype, annotation, owner, or target-code evidence defines the behavior."
  - "Retained alternate/underlay Figma image layers are design evidence, not automatic CMS fields."

