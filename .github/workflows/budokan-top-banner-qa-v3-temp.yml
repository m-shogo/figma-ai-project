name: Budokan TOP Banner QA v3 Temp

on:
  push:
    branches:
      - agent/budokan-top-banner-v3
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - '.github/workflows/budokan-top-banner-qa-v3-temp.yml'

permissions:
  contents: read

jobs:
  runtime-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify durable Figma asset bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/images/top/bg-banner-sp.jpg')
          data=p.read_bytes()
          h=0x811c9dc5
          for b in data:
              h ^= b
              h = (h * 0x01000193) & 0xffffffff
          assert len(data)==235687, len(data)
          assert h==0x310ada8b, hex(h)
          print('PASS durable asset bytes', len(data), hex(h))
          PY

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live Budokan capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed explicit front-page ACF QA rows
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose run --rm cli eval '
            $id = wp_insert_post(["post_title"=>"Budokan TOP QA", "post_type"=>"page", "post_status"=>"publish"]);
            if (is_wp_error($id) || !$id) { throw new Exception("front-page creation failed"); }
            update_option("show_on_front", "page");
            update_option("page_on_front", $id);
            $rows = [
              ["title"=>"スポーツくじ", "url"=>"https://example.invalid/sports", "target"=>1],
              ["title"=>"日本宝くじ協会", "url"=>"https://example.invalid/lottery", "target"=>1],
            ];
            $ok = update_field("top_banner-01", $rows, $id);
            if (!$ok) { throw new Exception("ACF top_banner-01 seed failed"); }
            echo "PASS seeded front-page ACF rows: ".$id."\n";
          '

      - name: Capture and verify TOP lower banner SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-top-banner-v3
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewportWidth: 390, contentWidth: 375, height: 800 },
              { name: 'pc', viewportWidth: 1395, contentWidth: 1380, height: 700 },
            ];
            const results = [];
            let failed = false;
            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.viewportWidth, height: item.height } });
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(e.message));
              const response = await page.goto(process.env.WP_URL, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const banner = page.locator('#top_banner-01');
              await banner.scrollIntoViewIfNeeded();
              const metrics = await page.evaluate(async () => {
                const rect = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height };
                };
                const el = document.querySelector('#top_banner-01');
                const style = el ? getComputedStyle(el) : null;
                let backgroundNatural = null;
                const bg = style?.backgroundImage || '';
                const matches = [...bg.matchAll(/url\(["']?([^"')]+)["']?\)/g)];
                if (matches.length) {
                  const url = matches[matches.length - 1][1];
                  backgroundNatural = await new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve({ width:img.naturalWidth, height:img.naturalHeight, url });
                    img.onerror = () => resolve({ width:0, height:0, url });
                    img.src = url;
                  });
                }
                return {
                  section: rect('#top_banner-01'),
                  list: rect('#top_banner-01 .tb_list'),
                  firstItem: rect('#top_banner-01 .tb_item'),
                  firstLink: rect('#top_banner-01 .tb_link'),
                  firstArrow: rect('#top_banner-01 .tb_arrow'),
                  firstExternal: rect('#top_banner-01 .tb_external'),
                  itemCount: document.querySelectorAll('#top_banner-01 .tb_item').length,
                  backgroundImage: bg,
                  backgroundNatural,
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                };
              });
              const status = response?.status() || 0;
              const horizontalOverflow = metrics.scrollWidth > metrics.clientWidth + 1;
              if (status >= 400 || pageErrors.length || horizontalOverflow || metrics.itemCount !== 2) failed = true;
              if (item.name === 'sp') {
                if (!metrics.section || Math.abs(metrics.section.width-item.contentWidth)>1 || Math.abs(metrics.section.height-216)>2) failed = true;
                if (!metrics.list || Math.abs(metrics.list.width-270)>1 || Math.abs(metrics.list.height-136)>2) failed = true;
                if (!metrics.firstItem || Math.abs(metrics.firstItem.width-270)>1 || Math.abs(metrics.firstItem.height-60)>1) failed = true;
                if (!metrics.firstArrow || Math.abs(metrics.firstArrow.width-26)>1 || Math.abs(metrics.firstArrow.height-26)>1) failed = true;
                if (!metrics.backgroundNatural || metrics.backgroundNatural.width!==1050 || metrics.backgroundNatural.height!==700 || !metrics.backgroundNatural.url.includes('bg-banner-sp.jpg')) failed = true;
              } else {
                if (!metrics.section || Math.abs(metrics.section.width-item.contentWidth)>1 || Math.abs(metrics.section.height-160)>2) failed = true;
                if (!metrics.list || Math.abs(metrics.list.width-648)>2 || Math.abs(metrics.list.height-80)>1) failed = true;
                if (!metrics.firstItem || Math.abs(metrics.firstItem.width-300)>1 || Math.abs(metrics.firstItem.height-80)>1) failed = true;
                if (metrics.backgroundImage !== 'none') failed = true;
              }
              await banner.screenshot({ path: `.runtime/budokan-top-banner-v3/${item.name}-banner.png` });
              results.push({ viewport:item, status, pageErrors, horizontalOverflow, metrics });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('.runtime/budokan-top-banner-v3/runtime.json', JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if (failed) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-top-banner-v3-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-top-banner-v3
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
