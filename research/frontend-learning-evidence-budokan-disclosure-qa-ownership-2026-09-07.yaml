records:
  - learning_id: OBS-BUDOKAN-DISCLOSURE-QA-VISIBILITY-OWNERSHIP
    summary: >-
      Interaction stability QA must not manufacture the viewport state it is trying to measure, and DOM existence alone does not establish an interactive owner. Stage scroll/overlay state outside the measurement helper, assert the intended control is actually visible and pointer-owned, and treat responsive hidden menu families as non-interactive unless current Theme/design authority proves otherwise.
    category: RUNTIME
    applicability:
      scope: PROJECT
      conditions:
        - Budokan interaction QA measures scroll and geometry stability across disclosure open/close/reopen cycles.
        - A menu hierarchy may exist in WordPress-rendered DOM while responsive Theme CSS deliberately hides that menu family from the active viewport.
        - Real WordPress plus Playwright can establish visibility, pointer hit ownership, disclosure state, scroll position and document width.
      exclusions:
        - Do not use force-click or helper-level scrollIntoView to make a hidden/non-owner control testable.
        - Do not infer an interaction contract from DOM presence or ARIA state alone.
        - Do not change production visibility or WordPress menu ownership merely to satisfy a stale QA assumption.
        - Do not generalize this Budokan-only finding without independent evidence.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        PR #463 strengthened the existing SP Global/Footer runtime QA. The first attempt exposed that the helper self-scrolled with scrollIntoViewIfNeeded while asserting scroll stability. After removing that self-mutation, real runtime proved the Footer button itself was not visible. Current Theme CSS intentionally keeps .gf_links-wrap hidden on SP and only exposes the footer link rail from 768px, while nested footer buttons/wrappers remain non-interactive. The QA was corrected to exercise only the visible Global disclosure through pointer open-close-reopen-close and to lock Footer as non-interactive rather than force-click it. Budokan Global Footer Disclosure Runtime run 34065602640 passed disposable WordPress setup, real WordPress menu seed, semantic baseline probe, Chromium interaction QA and cleanup. REF001 remains separately blocked at audit-evidence upload by repository artifact quota.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: ''
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-DISCLOSURE-QA-OWNERSHIP-20260907
          kind: COMMIT
          reference_id: REF-002-BUDOKAN
          run_id: '34065602640'
          path: experiments/wordpress-acf-runtime/scripts/budokan-global-footer-disclosure-browser-qa.mjs
          commit: 12795b0f0890a66ef408404a5821311dc13c449b
          note: >-
            PR #463 is QA-only. Production Theme/CSS/PHP/ACF/Menu ownership was not changed; the runtime now verifies visible Global disclosure reopen stability and the current non-interactive SP Footer contract without forced clicks or self-scrolling inside the measurement helper.
      contradicts: []
    notes:
      - "Promotion review disposition requested: KEEP_PROJECT_ONLY; one-project runtime/Theme evidence only, no auto-promotion."
