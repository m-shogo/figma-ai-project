<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Figma継続送信</title>
<link rel="stylesheet" href="popup.css">
<main><h1>Figma継続送信・実験版</h1>
<p>このMacのChromeを起動したまま使います。最初は停止。既存タスク・別端末との重複を解消してから開始してください。</p>
<label>対象チャットURL<input id="url" type="url" placeholder="https://chatgpt.com/c/…"></label>
<label>間隔（分・最小60）<input id="interval" type="number" min="60" max="10080" value="60"></label>
<p>Figma +「慎重に進んで」</p>
<label><input id="owner" type="checkbox">既存タスクと他端末の実装が並行しないことを確認済み</label>
<button id="save">設定保存・サイト権限を許可</button>
<button id="probe">状態確認（送信なし）</button>
<button id="once">単発送信</button><button id="start">定期送信を開始</button>
<button id="stop">緊急停止</button>
<pre id="status" role="status"></pre>
<p>結果不明では自動再送しません。保留中の送信がある場合は停止したまま確認してください。回答本文・Cookieは保存せず、設定と結果のみ端末内に保存します。</p>
</main><script type="module" src="popup.mjs"></script></html>
