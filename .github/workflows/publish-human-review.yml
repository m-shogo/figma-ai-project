name: Publish Human Review Dashboard

on:
  push:
    branches:
      - so
    paths:
      - 'review-dashboard/**'
      - 'scripts/build_human_review_site.py'
      - 'scripts/validate_human_review_site.py'
      - 'tests/test_human_review_dashboard.py'
      - 'experiments/ref001-blind-clean-20260812/implementation/**'
      - 'experiments/ref001-blind-clean-20260812/evidence/final/latest/**'
      - 'research/figma-assets/ref001/**'
      - '.github/workflows/publish-human-review.yml'
  pull_request:
    paths:
      - 'review-dashboard/**'
      - 'scripts/build_human_review_site.py'
      - 'scripts/validate_human_review_site.py'
      - 'tests/test_human_review_dashboard.py'
      - 'experiments/ref001-blind-clean-20260812/implementation/**'
      - 'experiments/ref001-blind-clean-20260812/evidence/final/latest/**'
      - 'research/figma-assets/ref001/**'
      - '.github/workflows/publish-human-review.yml'
  workflow_dispatch:

concurrency:
  group: human-review-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runtime versions
        run: |
          python --version
          php --version

      - name: Build static Review Dashboard and Artifact Preview
        run: python scripts/build_human_review_site.py --output _site

      - name: Validate generated review site
        run: python scripts/validate_human_review_site.py _site

      - name: Run focused dashboard tests
        run: python -m unittest tests.test_human_review_dashboard

      - name: Reject short-lived Figma asset locators
        run: python scripts/validate_no_figma_mcp_asset_urls.py

      - name: Validate durable Figma asset manifests when present
        run: python scripts/validate_asset_manifests.py

      - name: Reject transient Figma asset staging
        run: python scripts/validate_no_figma_asset_staging.py

      - name: Upload review backup artifact
        uses: actions/upload-artifact@v5
        with:
          name: ref001-human-review-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy Human Review Dashboard
        id: deployment
        uses: actions/deploy-pages@v5
