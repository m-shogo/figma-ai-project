schema_version: 1
policy:
  auto_promotion: false
  evidence_retention: APPEND_OR_SUPERSEDE_WITH_TRACE
  contradictions_are_preserved: true
  lifecycle_doc: docs/frontend-visual-repair-learning-loop.md
  cross_reference_evidence_required_for_active: true

records:
  - learning_id: OBS-BUDOKAN-TOP-EVENTS-CURRENT-FIGMA-SPACING
    summary: >-
      When one responsive card family keeps different base gaps at SP and PC, preserve the existing breakpoint-specific flex gap and
      express the shared extra separation on the preceding semantic group rather than duplicating two breakpoint overrides.
    category: VISUAL_FIDELITY
    applicability:
      scope: PROJECT
      conditions:
        - Current Figma proves the same semantic relationship at both breakpoints.
        - The existing component already owns the breakpoint-specific base gap.
        - The correction is isolated to the TOP component owner and does not alter FullCalendar internals or shared blocks.
      exclusions:
        - Do not generalize the offset to unrelated cards or shared Gutenberg blocks without independent evidence.
        - Do not infer event date/status data fields from the visual fixture; current Budokan authority says those fields do not exist.
    promotion_state: PROJECT_ONLY
    promotion:
      candidate: false
      rationale: >-
        LIVE current Figma file FKQaJDu5TZXHoCzPsfP92E proves the Budokan TOP event relationship at PC node 1603:7488 and SP node
        1455:5487, but this remains one project/reference family and does not satisfy cross-reference evidence requirements.
      blocked_by:
        - NEEDS_INDEPENDENT_REFERENCE_EVIDENCE_BEFORE_CROSS_PROJECT_PROMOTION
      contradiction_review: >-
        No shared-component contradiction was found. Calendar ownership remains separately governed by CURRENT_AUTHORITY.md and was
        intentionally not changed by this repair.
    evidence:
      supports:
        - evidence_id: EV-BUDOKAN-TOP-EVENTS-CURRENT-FIGMA-20260904
          kind: LOCAL_RESEARCH
          reference_id: REF-002-BUDOKAN
          run_id: ''
          path: experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/css/project/top_events.css
          commit: ''
          note: >-
            LIVE PC node 1603:7488 has label-to-date separation 24px and date-to-title 16px; LIVE SP node 1455:5487 has 20px and
            12px respectively. Theme already used .te_card_body gap 12px at SP and 16px at PC, so adding 8px bottom margin only to
            .te_card_labels exactly produces both current-Figma separations without changing markup. SP Figma also specifies the
            horizontal featured banner background as #5a5a5b; Theme previously used var(--color-text) (#333-family), while the PC
            media query already independently overrides the banner to var(--color-accent). The SP owner was corrected to #5a5a5b,
            preserving the existing PC accent variant and all Calendar behavior.
      contradicts: []
    notes:
      - "Promotion review disposition 2026-09-04: KEEP_PROJECT_ONLY; same-project PC/SP evidence is strong for this repair but is not independent cross-project evidence."
      - FullCalendar DOM/JS and Google Calendar ownership were not changed.
      - ACF/CPT, Form/Formidable, parts.php, and shared CSS were not changed.
