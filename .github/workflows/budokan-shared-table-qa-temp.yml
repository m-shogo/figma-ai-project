name: Budokan Shared Table QA Temp

on:
  pull_request:
    paths:
      - 'experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan/**'
      - 'experiments/budokan-wordpress/**'
      - '.github/workflows/budokan-shared-table-qa-temp.yml'

permissions:
  contents: read

jobs:
  runtime-table:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: PHP syntax
        run: find experiments/wordpress-acf-runtime/theme-dropin/nipponbudokan -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check ACF PRO runtime availability
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -n "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP live table capture: ACF_PRO_LICENSE_KEY is unavailable.'
          fi

      - name: Install browser QA dependency
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          mkdir -p .runtime/playwright
          cd .runtime/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start real WordPress + ACF PRO + Budokan Theme
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
          CI: 'true'
        run: bash scripts/setup.sh

      - name: Seed native Gutenberg table fixture
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          cat > .runtime/table-fixture.html <<'HTML'
          <!-- wp:table {"className":"is-scroll-on-mobile"} -->
          <figure class="wp-block-table is-scroll-on-mobile"><table><thead><tr><th>ヘッダーセル</th><th>ヘッダーセル</th><th>ヘッダーセル</th><th>ヘッダーセル</th></tr></thead><tbody><tr><td>通常セル</td><td colspan="2">通常セル</td><td>通常セル</td></tr><tr><td>通常セル</td><td colspan="2">通常セル</td><td>通常セル</td></tr></tbody></table></figure>
          <!-- /wp:table -->
          HTML
          docker compose run --rm cli post update 2 --post_title='Table Runtime QA' --post_status=publish --post_content="$(cat .runtime/table-fixture.html)"

      - name: Capture and assert shared table SP and PC
        if: steps.acf.outputs.enabled == 'true'
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          mkdir -p .runtime/budokan-shared-table
          WP_URL="$WP_URL" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const requireQA = createRequire(path.resolve('.runtime/playwright/package.json'));
          const { chromium } = requireQA('playwright');

          const near = (actual, expected, tolerance = 1) => Math.abs(actual - expected) <= tolerance;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'sp', viewportWidth: 390, authoredWidth: 375, height: 900 },
              { name: 'pc', viewportWidth: 1395, authoredWidth: 1380, height: 900 },
            ];
            const results = [];
            let failed = false;

            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.viewportWidth, height: item.height } });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              const response = await page.goto(`${process.env.WP_URL}/?page_id=2`, { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              const table = page.locator('.wp-block-table.is-scroll-on-mobile').first();
              await table.scrollIntoViewIfNeeded();
              await page.waitForTimeout(100);

              const metrics = await page.evaluate(() => {
                const q = s => document.querySelector(s);
                const rect = el => { const r = el.getBoundingClientRect(); return { x:r.x, y:r.y, width:r.width, height:r.height }; };
                const wrap = q('.wp-block-table.is-scroll-on-mobile');
                const tbl = wrap?.querySelector('table');
                const head = tbl?.querySelector('thead tr');
                const bodyRows = [...(tbl?.querySelectorAll('tbody tr') || [])];
                const firstTh = tbl?.querySelector('th');
                const firstTd = tbl?.querySelector('td');
                const thStyle = firstTh ? getComputedStyle(firstTh) : null;
                const tdStyle = firstTd ? getComputedStyle(firstTd) : null;
                return {
                  wrap: wrap ? rect(wrap) : null,
                  table: tbl ? rect(tbl) : null,
                  tableScrollWidth: wrap?.scrollWidth || 0,
                  wrapClientWidth: wrap?.clientWidth || 0,
                  head: head ? rect(head) : null,
                  bodyRows: bodyRows.map(rect),
                  firstTh: firstTh ? rect(firstTh) : null,
                  firstTd: firstTd ? rect(firstTd) : null,
                  th: thStyle ? { fontSize: thStyle.fontSize, lineHeight: thStyle.lineHeight, paddingTop: thStyle.paddingTop, paddingLeft: thStyle.paddingLeft, backgroundColor: thStyle.backgroundColor, color: thStyle.color, fontWeight: thStyle.fontWeight } : null,
                  td: tdStyle ? { fontSize: tdStyle.fontSize, lineHeight: tdStyle.lineHeight, paddingTop: tdStyle.paddingTop, paddingLeft: tdStyle.paddingLeft } : null,
                  pageScrollWidth: document.documentElement.scrollWidth,
                  pageClientWidth: document.documentElement.clientWidth,
                };
              });

              const status = response?.status() || 0;
              const horizontalPageOverflow = metrics.pageScrollWidth > metrics.pageClientWidth + 1;
              if (status >= 400 || pageErrors.length || horizontalPageOverflow || !metrics.wrap || !metrics.table) failed = true;
              if (!near(metrics.head?.height || 0, 54, 1) || metrics.bodyRows.some(r => !near(r.height, 54, 1))) failed = true;
              if (!near(parseFloat(metrics.th?.fontSize || 0), 15, .2) || !near(parseFloat(metrics.th?.lineHeight || 0), 24, .3)) failed = true;
              if (!near(parseFloat(metrics.th?.paddingTop || 0), 15, .2) || !near(parseFloat(metrics.th?.paddingLeft || 0), 20, .2)) failed = true;
              if (!near(parseFloat(metrics.td?.fontSize || 0), 15, .2) || !near(parseFloat(metrics.td?.lineHeight || 0), 24, .3)) failed = true;

              if (item.name === 'sp') {
                if (!near(metrics.wrap.width, 327, 1)) failed = true;
                if (!near(metrics.table.width, 960, 2)) failed = true;
                if (!(metrics.tableScrollWidth > metrics.wrapClientWidth + 500)) failed = true;
              } else {
                if (!near(metrics.wrap.width, 960, 1)) failed = true;
                if (!near(metrics.table.width, 960, 1)) failed = true;
                if (!near(metrics.firstTh?.width || 0, 240, 2)) failed = true;
              }

              await table.screenshot({ path: `.runtime/budokan-shared-table/${item.name}-table.png` });
              results.push({ viewport: item, status, pageErrors, horizontalPageOverflow, metrics });
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('.runtime/budokan-shared-table/runtime.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload runtime evidence
        if: steps.acf.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: budokan-shared-table-runtime-temp
          path: experiments/wordpress-acf-runtime/.runtime/budokan-shared-table
          if-no-files-found: error

      - name: Cleanup runtime
        if: always()
        working-directory: experiments/wordpress-acf-runtime
        run: |
          source scripts/runtime-env.sh
          docker compose down -v --remove-orphans || true
